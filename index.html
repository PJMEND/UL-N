      mm.momentos.forEach(function (q) { q.x = fim(q.x); });
      mm.distribuidas.forEach(function (d) { d.x2 = fim(d.x2); });
      mm.L = L;
      mm.apoios = mm.apoios.filter(function (a) { return a.x <= L + 1e-9; });
      mm.rotulas = mm.rotulas.filter(function (r) { return r.x < L - 1e-9; });
      mm.forcas = mm.forcas.filter(function (f) { return f.x <= L + 1e-9; });
      mm.momentos = mm.momentos.filter(function (q) { return q.x <= L + 1e-9; });
      mm.distribuidas = mm.distribuidas.filter(function (d) { return d.x1 < L - 1e-9; });
      mm.distribuidas.forEach(function (d) {
        if (d.x2 > L) { d.q2 = d.q1 + (d.q2 - d.q1) * (L - d.x1) / (d.x2 - d.x1); d.q2 = arred(d.q2); d.x2 = L; }
      });
    });
    var depois = 0;
    TIPOS.forEach(function (k) { depois += est.modelo[k].length; });
    $("comprimento").value = fmt(est.modelo.L);
    if (depois < antes) aviso((antes - depois) + " elemento(s) ficaram fora da viga e foram retirados. Ctrl+Z desfaz.");
  }

  // ------------------------------------------------------------ diálogos

  // O conteúdo de cada diálogo vive num elemento novo: os ouvintes de um
  // diálogo morrem com ele e não se acumulam no seguinte.
  function abrirDialogo(html, aoAbrir, largo) {
    var fundo = $("fundo-dialogo"), caixa = $("dialogo");
    caixa.className = "dialogo" + (largo ? " largo" : "");
    caixa.innerHTML = "";
    var d = document.createElement("div");
    d.innerHTML = html;
    caixa.appendChild(d);
    fundo.hidden = false;
    est.dialogo = true;
    if (aoAbrir) aoAbrir(d);
    var primeiro = d.querySelector("input[type=text]") || d.querySelector("button.principal") || d.querySelector("button");
    if (primeiro) {
      try { primeiro.focus({ preventScroll: true }); } catch (e) { primeiro.focus(); }
      if (primeiro.select) primeiro.select();
    }
    caixa.scrollTop = 0;
  }

  function fecharDialogo() {
    $("fundo-dialogo").hidden = true;
    $("dialogo").innerHTML = "";
    est.dialogo = false;
  }

  function opcoes(grupo, lista, ativa) {
    return '<div class="opcoes" data-grupo="' + grupo + '">' + lista.map(function (o) {
      return '<button type="button" data-v="' + o[0] + '"' + (o[0] === ativa ? ' class="ativa"' : "") + ">" + o[1] + "</button>";
    }).join("") + "</div>";
  }
  function lerOpcao(d, grupo) { var b = d.querySelector('[data-grupo="' + grupo + '"] .ativa'); return b ? b.getAttribute("data-v") : null; }
  function campoNum(id, valor, unidade) {
    return '<input type="text" inputmode="decimal" id="' + id + '" value="' + esc(valor) + '">' + (unidade ? '<span class="unidade">' + unidade + "</span>" : "");
  }
  function valorCampo(d, id) { var e = d.querySelector("#" + id); return e ? lerNum(e.value) : NaN; }

  // cfg: titulo, linhas [[rótulo, html]], previa, aoMudar(d), ler(d) -> {erro} | {valores}, confirmar(v), apagar
  function dialogoForm(cfg) {
    var html = "<h2>" + cfg.titulo + '</h2><div class="form">' + cfg.linhas.map(function (l) {
      return '<label' + (l[2] ? ' data-linha="' + l[2] + '"' : "") + ">" + l[0] + '</label><div class="campo"' +
        (l[2] ? ' data-linha="' + l[2] + '"' : "") + ">" + l[1] + "</div>";
    }).join("") + "</div>" + (cfg.previa ? '<div class="previa" id="d-previa"></div>' : "") +
      '<div class="erro-form" id="d-erro"></div><div class="botoes">' +
      (cfg.apagar ? '<button type="button" data-d="apagar" style="margin-right:auto">Apagar</button>' : "") +
      '<button type="button" data-d="cancelar">Cancelar</button><button type="button" class="principal" data-d="ok">OK</button></div>';
    abrirDialogo(html, function (d) {
      function upd() {
        if (!est.dialogo) return;
        if (cfg.aoMudar) cfg.aoMudar(d);
        var r = cfg.ler(d);
        $("d-erro").textContent = r.erro && r.mostrar !== false ? r.erro : "";
      }
      function ok() {
        if (!est.dialogo) return;
        var r = cfg.ler(d);
        if (r.erro) { $("d-erro").textContent = r.erro; return; }
        fecharDialogo();
        cfg.confirmar(r.valores);
      }
      d.addEventListener("input", upd);
      d.addEventListener("change", upd);
      d.addEventListener("click", function (ev) {
        var b = ev.target.closest("button");
        if (!b) return;
        var g = b.parentNode && b.parentNode.getAttribute && b.parentNode.getAttribute("data-grupo");
        if (g && !b.disabled) {
          Array.prototype.forEach.call(b.parentNode.children, function (c) { c.classList.toggle("ativa", c === b); });
          if (cfg.aoClicarOpcao) cfg.aoClicarOpcao(d, g, b.getAttribute("data-v"));
          upd();
          return;
        }
        var acao = b.getAttribute("data-d");
        if (acao === "ok") ok();
        else if (acao === "cancelar") fecharDialogo();
        else if (acao === "apagar") { fecharDialogo(); cfg.apagar(); }
      });
      d.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter") { ev.preventDefault(); ok(); }
      });
      if (cfg.aoMudar) cfg.aoMudar(d);
      var r = cfg.ler(d);
      if (r.erro && r.mostrar !== false) $("d-erro").textContent = r.erro;
    });
  }

  function lerX(d, id, L) {
    var x = valorCampo(d, id);
    if (!isFinite(x)) return { erro: "Escreva a posição em metros." };
    if (x < -1e-9 || x > L + 1e-9) return { erro: "A posição tem de estar entre 0 e " + fmt(L) + " m." };
    return { x: arred(clamp(x, 0, L)) };
  }

  function dialogoApoio(e, x) {
    var L = est.modelo.L, tipo = e ? e.tipo : (est.ultimo.apoio || "fixo");
    dialogoForm({
      titulo: e ? "Editar apoio" : "Novo apoio",
      linhas: [
        ["Tipo", opcoes("tipo", [["movel", "Móvel"], ["fixo", "Fixo"], ["encastramento", "Encastramento"]], tipo)],
        ["Posição x", campoNum("d-x", fmt(e ? e.x : x), "m")],
        ["Inclinação da reação", campoNum("d-ang", fmt(e && e.tipo === "movel" ? e.angulo || 0 : 0), "° com a vertical"), "ang"]
      ],
      aoMudar: function (d) {
        var movel = lerOpcao(d, "tipo") === "movel";
        Array.prototype.forEach.call(d.querySelectorAll('[data-linha="ang"]'), function (n) { n.style.display = movel ? "" : "none"; });
      },
      ler: function (d) {
        var t = lerOpcao(d, "tipo"), px = lerX(d, "d-x", L);
        if (px.erro) return px;
        var ang = t === "movel" ? valorCampo(d, "d-ang") : 0;
        if (!isFinite(ang) || Math.abs(ang) > 90) return { erro: "A inclinação da reação vai de -90° a 90° (0° = vertical)." };
        var outro = est.modelo.apoios.some(function (a) { return (!e || a.id !== e.id) && Math.abs(a.x - px.x) < 1e-9; });
        if (outro) return { erro: "Já há um apoio em x = " + fmt(px.x) + " m." };
        return { valores: { tipo: t, x: px.x, angulo: arred(ang) } };
      },
      confirmar: function (v) {
        est.ultimo.apoio = v.tipo;
        alterar(function (m) {
          if (e) { var a = acharElemento("apoios", e.id); a.tipo = v.tipo; a.x = v.x; a.angulo = v.angulo; }
          else { var id = est.proximoId++; m.apoios.push({ id: id, x: v.x, tipo: v.tipo, angulo: v.angulo }); est.sel = { k: "apoios", id: id }; }
        });
      },
      apagar: e ? function () { apagar("apoios", e.id); } : null
    });
  }

  function dialogoRotula(e, x) {
    var L = est.modelo.L;
    dialogoForm({
      titulo: e ? "Editar rótula" : "Nova rótula",
      linhas: [["Posição x", campoNum("d-x", fmt(e ? e.x : x), "m")]],
      ler: function (d) {
        var px = lerX(d, "d-x", L);
        if (px.erro) return px;
        if (px.x <= 1e-9 || px.x >= L - 1e-9) return { erro: "Uma rótula tem de ficar no interior da viga." };
        if (est.modelo.rotulas.some(function (r) { return (!e || r.id !== e.id) && Math.abs(r.x - px.x) < 1e-9; })) return { erro: "Já há uma rótula nesse ponto." };
        return { valores: { x: px.x } };
      },
      confirmar: function (v) {
        alterar(function (m) {
          if (e) acharElemento("rotulas", e.id).x = v.x;
          else { var id = est.proximoId++; m.rotulas.push({ id: id, x: v.x }); est.sel = { k: "rotulas", id: id }; }
        });
      },
      apagar: e ? function () { apagar("rotulas", e.id); } : null
    });
  }

  function previaForca(d, F, alfa) {
    var cx = 70, cy = 58, len = 44, a = alfa * Math.PI / 180, ux = Math.cos(a), uy = -Math.sin(a), s = "";
    var hx = cx + ux * len / 2, hy = cy + uy * len / 2, tx = cx - ux * len / 2, ty = cy - uy * len / 2;
    s += linha(10, cy, 130, cy, "#E1E6EB", 1) + linha(cx, 8, cx, 108, "#E1E6EB", 1);
    if (Math.abs(ux) > 1e-6 && Math.abs(uy) > 1e-6) {
      s += seta(tx, ty, hx, ty, COR.carga, 1.1, true) + seta(hx, ty, hx, hy, COR.carga, 1.1, true);
    }
    s += seta(tx, ty, hx, hy, COR.carga, 2.4);
    var c = S.componentesForca({ F: F, alfa: alfa });
    var info = "F<sub>x</sub> = " + fmt(Math.abs(c.Fx)) + " kN " + (c.Fx > 1e-9 ? "→" : c.Fx < -1e-9 ? "←" : "") +
      "<br>F<sub>y</sub> = " + fmt(Math.abs(c.Fy)) + " kN " + (c.Fy > 1e-9 ? "↑" : c.Fy < -1e-9 ? "↓" : "") +
      '<br><span style="color:#7B8794;font-size:12px">' + esc(descreverDirecao(alfa)) + "</span>";
    $("d-previa").innerHTML = '<svg width="140" height="116" viewBox="0 0 140 116">' + s + '</svg><div class="info">' + info + "</div>";
  }

  function dialogoForca(e, x) {
    var L = est.modelo.L, u = est.ultimo.forca || { F: 10, alfa: 270 };
    var F0 = e ? e.F : u.F, an = angulosDeAlfa(e ? e.alfa : u.alfa);
    dialogoForm({
      titulo: e ? "Editar força" : "Nova força",
      previa: true,
      linhas: [
        ["Posição x", campoNum("d-x", fmt(e ? e.x : x), "m")],
        ["Intensidade F", campoNum("d-F", fmt(F0), "kN")],
        ["Ângulo com a horizontal", campoNum("d-th", fmt(an.theta, an.theta % 1 ? 2 : 0), "°") +
          opcoes("atalho", [["90", "90°"], ["0", "0°"], ["30", "30°"], ["45", "45°"], ["60", "60°"]], "")],
        ["Sentido horizontal", opcoes("sh", [["dir", "→ para a direita"], ["esq", "← para a esquerda"]], an.sh)],
        ["Sentido vertical", opcoes("sv", [["baixo", "↓ para baixo"], ["cima", "↑ para cima"]], an.sv)]
      ],
      aoClicarOpcao: function (d, g, v) {
        if (g === "atalho") {
          d.querySelector("#d-th").value = v;
          Array.prototype.forEach.call(d.querySelectorAll('[data-grupo="atalho"] button'), function (b) { b.classList.remove("ativa"); });
        }
      },
      aoMudar: function (d) {
        var th = valorCampo(d, "d-th"), F = valorCampo(d, "d-F");
        Array.prototype.forEach.call(d.querySelectorAll('[data-grupo="sh"] button'), function (b) { b.disabled = Math.abs(th - 90) < 1e-9; });
        Array.prototype.forEach.call(d.querySelectorAll('[data-grupo="sv"] button'), function (b) { b.disabled = Math.abs(th) < 1e-9; });
        if (isFinite(th) && th >= 0 && th <= 90 && isFinite(F) && F > 0) previaForca(d, F, alfaDeAngulos(th, lerOpcao(d, "sh"), lerOpcao(d, "sv")));
        else $("d-previa").innerHTML = "";
      },
      ler: function (d) {
        var px = lerX(d, "d-x", L);
        if (px.erro) return px;
        var F = valorCampo(d, "d-F"), th = valorCampo(d, "d-th");
        if (!(F > 0)) return { erro: "A intensidade tem de ser positiva; o sentido escolhe-se em baixo." };
        if (!(th >= 0 && th <= 90)) return { erro: "O ângulo com a horizontal vai de 0° a 90°." };
        return { valores: { x: px.x, F: arred(F), alfa: alfaDeAngulos(th, lerOpcao(d, "sh"), lerOpcao(d, "sv")) } };
      },
      confirmar: function (v) {
        est.ultimo.forca = { F: v.F, alfa: v.alfa };
        alterar(function (m) {
          if (e) { var f = acharElemento("forcas", e.id); f.x = v.x; f.F = v.F; f.alfa = v.alfa; }
          else { var id = est.proximoId++; m.forcas.push({ id: id, x: v.x, F: v.F, alfa: v.alfa }); est.sel = { k: "forcas", id: id }; }
        });
      },
      apagar: e ? function () { apagar("forcas", e.id); } : null
    });
  }

  function dialogoMomento(e, x) {
    var L = est.modelo.L, u = est.ultimo.momento || { M: 10, sentido: "horario" };
    dialogoForm({
      titulo: e ? "Editar momento" : "Novo momento",
      linhas: [
        ["Posição x", campoNum("d-x", fmt(e ? e.x : x), "m")],
        ["Intensidade M", campoNum("d-M", fmt(e ? e.M : u.M), "kN·m")],
        ["Sentido", opcoes("sentido", [["horario", "↻ horário"], ["anti-horario", "↺ anti-horário"]], e ? e.sentido : u.sentido)]
      ],
      ler: function (d) {
        var px = lerX(d, "d-x", L);
        if (px.erro) return px;
        var M = valorCampo(d, "d-M");
        if (!(M > 0)) return { erro: "A intensidade tem de ser positiva; o sentido escolhe-se em baixo." };
        return { valores: { x: px.x, M: arred(M), sentido: lerOpcao(d, "sentido") } };
      },
      confirmar: function (v) {
        est.ultimo.momento = { M: v.M, sentido: v.sentido };
        alterar(function (m) {
          if (e) { var q = acharElemento("momentos", e.id); q.x = v.x; q.M = v.M; q.sentido = v.sentido; }
          else { var id = est.proximoId++; m.momentos.push({ id: id, x: v.x, M: v.M, sentido: v.sentido }); est.sel = { k: "momentos", id: id }; }
        });
      },
      apagar: e ? function () { apagar("momentos", e.id); } : null
    });
  }

  function dialogoDistribuida(e, x1, x2) {
    var L = est.modelo.L, u = est.ultimo.dist || { q1: 10, q2: 10 };
    var q1 = e ? e.q1 : u.q1, q2 = e ? e.q2 : u.q2, unif = Math.abs(q1 - q2) < 1e-9;
    // as intensidades escrevem-se positivas e o sentido escolhe-se à parte, como nas forças
    var sg = (Math.abs(q1) >= Math.abs(q2) ? q1 : q2) < 0 ? -1 : 1;
    dialogoForm({
      titulo: e ? "Editar carga distribuída" : "Nova carga distribuída",
      previa: true,
      linhas: [
        ["Início x<sub>1</sub>", campoNum("d-x1", fmt(e ? e.x1 : x1), "m")],
        ["Fim x<sub>2</sub>", campoNum("d-x2", fmt(e ? e.x2 : x2), "m")],
        ["Forma", opcoes("forma", [["uniforme", "Uniforme"], ["variavel", "Triangular ou trapezoidal"]], unif ? "uniforme" : "variavel")],
        ["q no início", campoNum("d-q1", fmt(q1 * sg), "kN/m")],
        ["q no fim", campoNum("d-q2", fmt(q2 * sg), "kN/m"), "q2"],
        ["Sentido", opcoes("sentido", [["baixo", "↓ para baixo"], ["cima", "↑ para cima"]], sg > 0 ? "baixo" : "cima")]
      ],
      aoMudar: function (d) {
        var uni = lerOpcao(d, "forma") === "uniforme";
        Array.prototype.forEach.call(d.querySelectorAll('[data-linha="q2"]'), function (n) { n.style.display = uni ? "none" : ""; });
        var r = this.ler(d);
        var pv = $("d-previa");
        if (r.erro) { pv.innerHTML = ""; return; }
        var v = r.valores, R = S.resultanteDistribuida(v);
        pv.innerHTML = '<div class="info">Resultante: <b>R = ' + fmt(Math.abs(R.F)) + " kN " + (R.F > 1e-9 ? "↓" : R.F < -1e-9 ? "↑" : "") +
          "</b>" + (R.x !== null ? " a x = <b>" + fmt(R.x) + " m</b>" : "") + "</div>";
      },
      ler: function (d) {
        var a = lerX(d, "d-x1", L);
        if (a.erro) return a;
        var b = lerX(d, "d-x2", L);
        if (b.erro) return b;
        if (b.x - a.x < 1e-6) return { erro: "O fim tem de estar à direita do início." };
        var uni = lerOpcao(d, "forma") === "uniforme";
        var v1 = valorCampo(d, "d-q1"), v2 = uni ? v1 : valorCampo(d, "d-q2");
        if (!isFinite(v1) || !isFinite(v2)) return { erro: "Escreva os valores da carga em kN/m." };
        if (v1 < 0 || v2 < 0) return { erro: "As intensidades são positivas; o sentido escolhe-se em baixo." };
        if (v1 < 1e-12 && v2 < 1e-12) return { erro: "A carga não pode ser nula nas duas extremidades." };
        var s = lerOpcao(d, "sentido") === "cima" ? -1 : 1;
        return { valores: { x1: a.x, x2: b.x, q1: arred(v1 * s), q2: arred(v2 * s) } };
      },
      confirmar: function (v) {
        est.ultimo.dist = { q1: v.q1, q2: v.q2 };
        alterar(function (m) {
          if (e) { var dd = acharElemento("distribuidas", e.id); dd.x1 = v.x1; dd.x2 = v.x2; dd.q1 = v.q1; dd.q2 = v.q2; }
          else { var id = est.proximoId++; m.distribuidas.push({ id: id, x1: v.x1, x2: v.x2, q1: v.q1, q2: v.q2 }); est.sel = { k: "distribuidas", id: id }; }
        });
      },
      apagar: e ? function () { apagar("distribuidas", e.id); } : null
    });
  }

  function figuraConvencao() {
    var s = '<svg width="420" height="150" viewBox="0 0 420 150" font-family="' + FONTE + '">';
    s += '<rect x="186" y="50" width="48" height="50" fill="#DCE4EC" stroke="' + COR.azul + '" stroke-width="1.5"/>';
    s += texto(210, 81, "S", { tam: 16, peso: 700, cor: COR.azul });
    s += linha(100, 75, 186, 75, COR.azul, 1, ' stroke-dasharray="5 3"') + linha(234, 75, 320, 75, COR.azul, 1, ' stroke-dasharray="5 3"');
    // à esquerda da secção
    s += seta(120, 75, 60, 75, COR.reacao, 2) + texto(56, 70, "N", { ancora: "end", peso: 700, tam: 13 });
    s += seta(160, 112, 160, 42, COR.reacao, 2) + texto(150, 38, "V", { ancora: "end", peso: 700, tam: 13 });
    s += arco(132, 75, 22, 200, 340, COR.reacao, 2) + texto(110, 44, "M", { ancora: "end", peso: 700, tam: 13 });
    // à direita
    s += seta(300, 75, 360, 75, COR.reacao, 2) + texto(364, 70, "N", { ancora: "start", peso: 700, tam: 13 });
    s += seta(260, 42, 260, 112, COR.reacao, 2) + texto(270, 38, "V", { ancora: "start", peso: 700, tam: 13 });
    s += arco(288, 75, 22, 340, 200, COR.reacao, 2) + texto(310, 44, "M", { ancora: "start", peso: 700, tam: 13 });
    s += texto(90, 140, "à esquerda da secção", { tam: 11, cor: COR.cinza }) + texto(330, 140, "à direita da secção", { tam: 11, cor: COR.cinza });
    return s + "</svg>";
  }

  function dialogoAjuda() {
    var html = "<h2>Diagramas de Esforços</h2>" +
      "<h3>Como usar</h3><ul>" +
      "<li>Escolha uma ferramenta na barra e clique na viga para pôr apoios, rótulas, forças, momentos ou cargas distribuídas. As posições acertam pela grelha e pelos elementos já postos.</li>" +
      "<li>Numa carga distribuída, clique no início e arraste até ao fim.</li>" +
      "<li>Com <b>Selecionar</b>, arraste um elemento ao longo da viga. Duplo clique edita os valores; o botão direito ou a tecla <kbd>Delete</kbd> apaga; as setas <kbd>←</kbd> <kbd>→</kbd> deslocam o elemento selecionado.</li>" +
      "<li>No separador <b>Elementos</b> pode escrever todos os valores, sem usar o rato.</li>" +
      "<li>Os resultados atualizam-se a cada alteração. Passe o rato sobre o desenho para ler N, V e M; clique num diagrama, ou escreva o x em <b>Esforços numa secção</b>, para fixar uma secção.</li>" +
      "<li><kbd>Ctrl</kbd>+<kbd>Z</kbd> desfaz e <kbd>Ctrl</kbd>+<kbd>Y</kbd> refaz (<kbd>⌘</kbd> no Mac). A última viga fica guardada neste browser; <b>Guardar</b> cria um ficheiro para a abrir noutro computador.</li></ul>" +
      "<h3>Duas convenções de sinais</h3>" +
      "<p>Os números deste programa usam duas convenções diferentes, e cada quadro diz qual é a sua.</p>" +
      '<p><span class="conv equilibrio">→ + &nbsp;↑ + &nbsp;↺ +</span> <b>Equações de equilíbrio</b>: reações e verificação do equilíbrio.</p><ul>' +
      "<li>Positivo para a direita, para cima e no sentido anti-horário.</li>" +
      "<li>Um valor negativo quer dizer que a reação tem o sentido contrário. No desenho, as setas mostram o sentido real e o valor vem sem sinal.</li></ul>" +
      '<p><span class="conv seccao">convenção da secção</span> <b>Esforços</b>: diagramas de N, V e M e quadros de esforços.</p>' +
      '<div class="convencao">' + figuraConvencao() + "</div><ul>" +
      "<li><b>N</b> positivo de tração; <b>V</b> positivo quando a resultante das forças à esquerda da secção aponta para cima; <b>M</b> positivo quando traciona a fibra inferior.</li>" +
      "<li>O diagrama de M desenha-se do lado das fibras tracionadas: os momentos positivos ficam por baixo do eixo.</li></ul>" +
      "<p>As duas convenções são independentes, e o sinal de uma reação não dá o sinal do esforço junto ao apoio:</p><ul>" +
      "<li>numa consola encastrada à esquerda, com a carga para baixo, a reação M<sub>A</sub> é positiva (↺) e o momento fletor em A é negativo; encastrada à direita, são ambos negativos;</li>" +
      "<li>numa viga simplesmente apoiada, a reação vertical no apoio da direita é positiva (↑) e o esforço transverso junto a ele é negativo;</li>" +
      "<li>num apoio fixo à esquerda, uma reação horizontal positiva (→) empurra a viga, e o esforço axial junto a ele é de compressão (negativo).</li></ul>" +
      "<p>As cargas não levam sinal: forças, momentos e cargas distribuídas escrevem-se com a intensidade, e o sentido escolhe-se à parte.</p>" +
      "<h3>Âmbito</h3><ul>" +
      "<li>Vigas de eixo reto e horizontal, com cargas no plano da viga.</li>" +
      "<li>Classificação pela contagem g = r − 3 − e (r reações, e rótulas) e pela disposição dos vínculos.</li>" +
      "<li>Isostáticas: reações pelas equações de equilíbrio. Hiperestáticas: resolvidas admitindo EI e EA constantes ao longo da viga; as reações dependem da rigidez, e esse cálculo não faz parte da matéria de Estática.</li></ul>" +
      '<p style="color:#7B8794;font-size:12px;margin-top:14px">Estática · 2026/2027 · Paulo Mendes. Adaptado do módulo de diagramas do StructuralTool (Paulo Mendes, licença MIT).</p>' +
      '<div class="botoes"><button type="button" class="principal" data-d="fechar">Fechar</button></div>';
    abrirDialogo(html, function (d) {
      d.querySelector('[data-d="fechar"]').addEventListener("click", fecharDialogo);
    }, true);
  }

  // ------------------------------------------------------------ painel lateral

  // cada quadro diz em que convenção de sinais estão os seus números
  var CONV_EQUILIBRIO = '<span class="conv equilibrio" title="Convenção das equações de equilíbrio: positivo para a direita, para cima e no sentido anti-horário">→ + &nbsp;↑ + &nbsp;↺ +</span>';
  var CONV_SECCAO = '<span class="conv seccao" title="N positivo de tração; V positivo com a resultante à esquerda para cima; M positivo a tracionar a fibra inferior">convenção da secção</span>';

  function seta4(v, eixo) {
    if (Math.abs(v) < 0.005) return "";
    if (eixo === "H") return v > 0 ? "→" : "←";
    if (eixo === "V") return v > 0 ? "↑" : "↓";
    if (eixo === "M") return v > 0 ? "↺" : "↻";
    return "";
  }

  function htmlClassificacao(res) {
    if (res.erros.length) {
      return '<div class="cartao classe erro"><div class="veredicto">Dados por corrigir</div><ul>' +
        res.erros.map(function (e) { return "<li>" + esc(e) + "</li>"; }).join("") + "</ul></div>";
    }
    var c = res.classificacao;
    var cont = '<div class="contagem">r = ' + c.r + " reações · e = " + c.e + " rótula" + (c.e === 1 ? "" : "s") +
      " · g = r − 3 − e = <b>" + c.g + "</b></div>";
    if (c.tipo === "isostatica")
      return '<div class="cartao classe isostatica"><div class="veredicto">Viga isostática</div>' + cont + "</div>";
    if (c.tipo === "hiperestatica")
      return '<div class="cartao classe hiperestatica"><div class="veredicto">Viga hiperestática de grau ' + c.g + "</div>" + cont +
        '<p class="nota">As reações dependem da rigidez: foram calculadas admitindo EI e EA constantes ao longo da viga. Este cálculo não faz parte da matéria de Estática.</p></div>';
    return '<div class="cartao classe hipostatica"><div class="veredicto">Viga hipostática</div>' + cont +
      '<p class="nota" style="color:#7A1F1F">' + esc(c.motivo) + " Sem equilíbrio para um carregamento qualquer, não há diagramas.</p></div>";
  }

  function htmlReacoes(res) {
    var s = '<div class="cartao"><h3>Reações de apoio ' + CONV_EQUILIBRIO + "</h3>", L = est.modelo.L, enc = [];
    res.reacoes.forEach(function (R) {
      // num encastramento de extremidade, a reação M e o momento fletor nessa secção têm o mesmo valor absoluto
      if (R.tipo === "encastramento" && Math.abs(R.M) >= 0.005 && (R.x <= 1e-9 || R.x >= L - 1e-9)) {
        var Mf = res.esforcos(R.x, R.x <= 1e-9 ? "dir" : "esq").M;
        enc.push(" Em " + esc(R.nome) + ", a reação " + nomeHtml("M", R.nome) + " vale " + fmt(R.M) + " kN·m e o momento fletor " +
          fmt(Mf) + " kN·m: o mesmo valor, com o sinal de cada convenção.");
      }
      var nome = R.nome;
      s += '<div class="apoio-cab">' + esc(nome) + " <span>· " + NOME_APOIO[R.tipo].toLowerCase() + " em x = " + fmt(R.x) + " m</span></div>";
      function linhaR(rot, v, eixo, un) {
        return '<div class="reacao"><span>' + rot + '</span><span><span class="val">' + fmt(v) + " " + un + '</span> <span class="seta">' + seta4(v, eixo) + "</span></span></div>";
      }
      if (R.tipo === "movel") {
        if (Math.abs(R.angulo || 0) > 1e-9) {
          s += linhaR(nomeHtml("R", nome) + " (a " + fmtAng(R.angulo) + " da vertical)", R.R, "R", "kN");
          s += linhaR(nomeHtml("R", nome + "h"), R.H, "H", "kN");
          s += linhaR(nomeHtml("R", nome + "v"), R.V, "V", "kN");
        } else s += linhaR(nomeHtml("R", nome), R.V, "V", "kN");
      } else {
        s += linhaR(nomeHtml("R", nome + "h"), R.H, "H", "kN");
        s += linhaR(nomeHtml("R", nome + "v"), R.V, "V", "kN");
        if (R.tipo === "encastramento") s += linhaR(nomeHtml("M", nome), R.M, "M", "kN·m");
      }
    });
    return s + '<p class="nota">Sinais das equações de equilíbrio: → +, ↑ +, ↺ +; a seta indica o sentido real. ' +
      "N, V e M seguem a convenção da secção, e os sinais não se comparam com estes." + enc.join("") + "</p></div>";
  }

  function htmlEquilibrio(res) {
    var e = res.equilibrio;
    function v(nome, val, un) {
      var ok = Math.abs(val) < 0.005;
      return "<span>" + nome + " = " + fmt(val) + " " + un + ' <span class="' + (ok ? "ok" : "") + '">' + (ok ? "✓" : "✗") + "</span></span>";
    }
    return '<div class="cartao"><h3>Verificação do equilíbrio ' + CONV_EQUILIBRIO + '</h3><div class="verif">' +
      v("ΣF<sub>x</sub>", e.Fx, "kN") + v("ΣF<sub>y</sub>", e.Fy, "kN") + v("ΣM<sub>" + esc(e.ref) + "</sub>", e.M, "kN·m") +
      '</div><p class="nota">Com todas as cargas e reações. Momentos em relação a ' + esc(e.ref) + ".</p></div>";
  }

  function htmlSeccao() {
    return '<div class="cartao cartao-seccao' + (est.seccao === null ? " sem-valor" : "") +
      '" id="cartao-seccao"><h3>Esforços numa secção ' + CONV_SECCAO + '</h3><div class="seccao-entrada">x =<input type="text" inputmode="decimal" id="seccao-x" value="' +
      (est.seccao === null ? "" : fmt(est.seccao)) + '"> m <span class="nota" style="margin:0">ou clique num diagrama</span></div><div id="seccao-valores"></div></div>';
  }

  function atualizarSeccao() {
    var alvo = $("seccao-valores"), res = est.res;
    if (!alvo || !res || !res.esforcos) return;
    $("cartao-seccao").classList.toggle("sem-valor", est.seccao === null);
    if (est.seccao === null) { alvo.innerHTML = ""; return; }
    var x = est.seccao, e = res.esforcos(x, "esq"), d = res.esforcos(x, "dir");
    var salto = ["N", "V", "M"].some(function (k) { return Math.abs(e[k] - d[k]) >= 0.005; }) && x > 1e-9 && x < est.modelo.L - 1e-9;
    var cab = "<tr><th></th><th>N (kN)</th><th>V (kN)</th><th>M (kN·m)</th></tr>";
    function lin(rot, v) { return "<tr><td>" + rot + "</td><td>" + fmt(v.N) + "</td><td>" + fmt(v.V) + "</td><td>" + fmt(v.M) + "</td></tr>"; }
    var corpo = salto ? lin('<span class="lado">à esquerda</span>', e) + lin('<span class="lado">à direita</span>', d)
      : lin("x = " + fmt(x) + " m", x >= est.modelo.L - 1e-9 ? e : d);
    alvo.innerHTML = '<table class="quadro">' + cab + corpo + "</table>";
  }

  function htmlMaximos(res) {
    var mx = res.maximos, s = '<div class="cartao"><h3>Valores extremos ' + CONV_SECCAO + "</h3>";
    function lin(rot, e, un, extra) {
      if (!e) return "";
      return '<div class="linha-max"><span>' + rot + " = <b>" + fmt(e.valor) + " " + un + "</b></span><span>x = " + fmt(e.x) + " m" + (extra || "") + "</span></div>";
    }
    function emV0(e) {
      return e && (res.extremos || []).some(function (z) { return Math.abs(z.x - e.x) < 1e-6; }) ? " (V = 0)" : "";
    }
    s += lin("M máximo", mx.Mmax, "kN·m", emV0(mx.Mmax));
    s += lin("M mínimo", mx.Mmin, "kN·m", emV0(mx.Mmin));
    s += lin("V máximo", mx.Vmax, "kN");
    s += lin("V mínimo", mx.Vmin, "kN");
    s += lin("N máximo (tração)", mx.Nmax, "kN");
    s += lin("N mínimo (compressão)", mx.Nmin, "kN");
    if (res.zerosM && res.zerosM.length)
      s += '<div class="linha-max"><span>M = 0 (no interior de um troço)</span><span>x = ' + res.zerosM.map(function (x) { return fmt(x); }).join("; ") + " m</span></div>";
    return s + "</div>";
  }

  function htmlQuadro(res) {
    var L = est.modelo.L, linhas = [];
    res.pontos.forEach(function (p) {
      var nome = p.nome ? "<b>" + esc(p.nome) + "</b> " : "";
      var desc = nome + esc(p.descricao.replace(/^apoio [A-Z]+(, )?/, "")).trim();
      if (p.x <= 1e-9) linhas.push({ x: p.x, h: [fmt(p.x), desc, p.dir] });
      else if (p.x >= L - 1e-9) linhas.push({ x: p.x, h: [fmt(p.x), desc, p.esq] });
      else if (p.salto) {
        linhas.push({ x: p.x, h: [fmt(p.x), desc + ' <span class="lado">esq.</span>', p.esq] });
        linhas.push({ x: p.x, h: ["", '<span class="lado">dir.</span>', p.dir], cls: "salto-dir" });
      } else linhas.push({ x: p.x, h: [fmt(p.x), desc, p.dir] });
    });
    (res.extremos || []).forEach(function (e) {
      linhas.push({ x: e.x, h: [fmt(e.x), "V = 0, M extremo", res.esforcos(e.x)], cls: "especial" });
    });
    (res.zerosM || []).forEach(function (x) {
      linhas.push({ x: x, h: [fmt(x), "M = 0", res.esforcos(x)], cls: "especial" });
    });
    linhas.sort(function (a, b) { return a.x - b.x; });
    var s = '<div class="cartao"><h3>Esforços nos pontos notáveis ' + CONV_SECCAO + '</h3><div class="convencao pequena">' + legendaSeccao() +
      '</div><table class="quadro"><tr><th>x (m)</th><th style="text-align:left">ponto</th><th>N (kN)</th><th>V (kN)</th><th>M (kN·m)</th></tr>';
    linhas.forEach(function (l) {
      var v = l.h[2];
      s += '<tr class="' + (l.cls || "") + '"><td>' + l.h[0] + '</td><td class="ponto">' + l.h[1] + "</td><td>" + fmt(v.N) + "</td><td>" + fmt(v.V) + "</td><td>" + fmt(v.M) + "</td></tr>";
    });
    return s + '</table><p class="nota">Sentidos positivos: N de tração; V com a resultante das forças à esquerda da secção para cima; M a tracionar a fibra inferior. ' +
      "Onde há uma força ou um momento concentrado, os valores vêm à esquerda (esq.) e à direita (dir.) da secção.</p></div>";
  }

  function painelResultados() {
    var res = est.res, alvo = $("sep-resultados"), foco = document.activeElement && document.activeElement.id === "seccao-x";
    if (foco) { atualizarSeccao(); return; }
    var s = htmlClassificacao(res);
    if (res.reacoes) s += htmlSeccao() + htmlReacoes(res) + htmlEquilibrio(res) + htmlMaximos(res) + htmlQuadro(res);
    alvo.innerHTML = s;
    var inp = $("seccao-x");
    if (inp) {
      inp.addEventListener("input", function () {
        var x = lerNum(inp.value);
        est.seccao = isFinite(x) && x >= 0 && x <= est.modelo.L ? x : null;
        desenhar();
        atualizarSeccao();
      });
      atualizarSeccao();
    }
  }

  function painelElementos() {
    var m = est.modelo, nomes = nomesApoios(), res = est.res, s = "";
    s += '<div class="cartao grupo-el"><div class="cab"><h3>Viga</h3></div><div class="vazio">Comprimento L = ' + fmt(m.L) + " m (altera-se na barra de cima)</div></div>";
    function grupoEl(k, titulo, itens) {
      s += '<div class="cartao grupo-el"><div class="cab"><h3>' + titulo + '</h3><button class="mais" data-mais="' + k + '">+ acrescentar</button></div>';
      if (!itens.length) s += '<div class="vazio">Nenhum.</div>';
      itens.forEach(function (it) {
        s += '<div class="item' + (eSel(k, it.id) ? " sel" : "") + '" data-item="' + k + '" data-id="' + it.id + '"><div class="desc">' + it.html +
          '</div><button title="Editar" data-editar="' + k + '" data-id="' + it.id + '">✎</button><button title="Apagar" data-apagar="' + k + '" data-id="' + it.id + '">✕</button></div>';
      });
      s += "</div>";
    }
    grupoEl("apoios", "Apoios", m.apoios.slice().sort(function (a, b) { return a.x - b.x; }).map(function (a) {
      return { id: a.id, html: "<b>" + esc(nomes[a.id] || "?") + "</b> · " + NOME_APOIO[a.tipo] + " · x = " + fmt(a.x) + " m" +
        (a.tipo === "movel" && Math.abs(a.angulo || 0) > 1e-9 ? "<small>reação a " + fmtAng(a.angulo) + " da vertical</small>" : "") };
    }));
    grupoEl("rotulas", "Rótulas", m.rotulas.map(function (r) { return { id: r.id, html: "Rótula · x = " + fmt(r.x) + " m" }; }));
    grupoEl("forcas", "Forças", m.forcas.map(function (f) {
      var c = S.componentesForca(f);
      return { id: f.id, html: "F = " + fmt(f.F) + " kN · x = " + fmt(f.x) + " m<small>" + esc(descreverDirecao(f.alfa)) +
        " · F<sub>x</sub> = " + fmt(c.Fx) + ", F<sub>y</sub> = " + fmt(c.Fy) + " kN</small>" };
    }));
    grupoEl("momentos", "Momentos", m.momentos.map(function (q) {
      return { id: q.id, html: "M = " + fmt(q.M) + " kN·m " + (q.sentido === "horario" ? "↻ horário" : "↺ anti-horário") + " · x = " + fmt(q.x) + " m" };
    }));
    grupoEl("distribuidas", "Cargas distribuídas", m.distribuidas.map(function (d) {
      var R = S.resultanteDistribuida(d);
      var sq = (Math.abs(d.q1) >= Math.abs(d.q2) ? d.q1 : d.q2) < 0 ? -1 : 1;
      var q = (Math.abs(d.q1 - d.q2) < 1e-9 ? "q = " + fmt(d.q1 * sq) : "q = " + fmt(d.q1 * sq) + " a " + fmt(d.q2 * sq)) + " kN/m " + (sq > 0 ? "↓" : "↑");
      return { id: d.id, html: q + " · de " + fmt(d.x1) + " a " + fmt(d.x2) + " m<small>resultante " + fmt(Math.abs(R.F)) + " kN " +
        (R.F > 1e-9 ? "↓" : R.F < -1e-9 ? "↑" : "") + (R.x !== null ? " em x = " + fmt(R.x) + " m" : "") + "</small>" };
    }));
    $("sep-elementos").innerHTML = s;
  }

  function painel() {
    if (!est.res) return;
    painelResultados();
    painelElementos();
  }

  // ------------------------------------------------------------ barra

  var ICONES = {
    selecionar: '<path d="M9 4 L9 21 L13.5 16.5 L17 23 L19.5 21.8 L16 15.5 L22 15.5 Z" fill="none" stroke="#12344F" stroke-width="1.6" stroke-linejoin="round"/>',
    movel: '<line x1="2" y1="7" x2="28" y2="7" stroke="#12344F" stroke-width="2.5"/><polygon points="15,8 9,17 21,17" fill="none" stroke="#12344F" stroke-width="1.6"/><line x1="7" y1="21" x2="23" y2="21" stroke="#12344F" stroke-width="1.6"/>',
    fixo: '<line x1="2" y1="7" x2="28" y2="7" stroke="#12344F" stroke-width="2.5"/><polygon points="15,8 9,18 21,18" fill="none" stroke="#12344F" stroke-width="1.6"/><line x1="7" y1="18" x2="23" y2="18" stroke="#12344F" stroke-width="1.6"/><line x1="9" y1="18" x2="6" y2="22" stroke="#12344F" stroke-width="1.1"/><line x1="13" y1="18" x2="10" y2="22" stroke="#12344F" stroke-width="1.1"/><line x1="17" y1="18" x2="14" y2="22" stroke="#12344F" stroke-width="1.1"/><line x1="21" y1="18" x2="18" y2="22" stroke="#12344F" stroke-width="1.1"/>',
    encastramento: '<line x1="10" y1="3" x2="10" y2="23" stroke="#12344F" stroke-width="3"/><line x1="10" y1="13" x2="28" y2="13" stroke="#12344F" stroke-width="2.5"/><line x1="10" y1="5" x2="5" y2="10" stroke="#12344F" stroke-width="1.1"/><line x1="10" y1="10" x2="5" y2="15" stroke="#12344F" stroke-width="1.1"/><line x1="10" y1="15" x2="5" y2="20" stroke="#12344F" stroke-width="1.1"/><line x1="10" y1="20" x2="5" y2="25" stroke="#12344F" stroke-width="1.1"/>',
    rotula: '<line x1="2" y1="13" x2="28" y2="13" stroke="#12344F" stroke-width="2.5"/><circle cx="15" cy="13" r="4.5" fill="#fff" stroke="#12344F" stroke-width="2"/>',
    forca: '<line x1="15" y1="2" x2="15" y2="17" stroke="#C62828" stroke-width="2.2"/><polygon class="cheio" points="15,23 10.5,15 19.5,15" fill="#C62828"/>',
    momento: '<path d="M8 19 A8 8 0 1 1 22 19" fill="none" stroke="#C62828" stroke-width="2"/><polygon class="cheio" points="22,23 18,16.5 25.5,17" fill="#C62828"/>',
    distribuida: '<line x1="3" y1="5" x2="27" y2="5" stroke="#C62828" stroke-width="1.6"/><line x1="5" y1="5" x2="5" y2="17" stroke="#C62828" stroke-width="1.3"/><line x1="12" y1="5" x2="12" y2="17" stroke="#C62828" stroke-width="1.3"/><line x1="19" y1="5" x2="19" y2="17" stroke="#C62828" stroke-width="1.3"/><line x1="26" y1="5" x2="26" y2="17" stroke="#C62828" stroke-width="1.3"/><polygon class="cheio" points="5,21 2.5,16 7.5,16" fill="#C62828"/><polygon class="cheio" points="12,21 9.5,16 14.5,16" fill="#C62828"/><polygon class="cheio" points="19,21 16.5,16 21.5,16" fill="#C62828"/><polygon class="cheio" points="26,21 23.5,16 28.5,16" fill="#C62828"/>'
  };
  var FERRAMENTAS = [
    ["selecionar", "Selecionar", "Selecionar, arrastar e editar (Esc)"],
    ["movel", "Móvel", "Apoio móvel (1 reação)"],
    ["fixo", "Fixo", "Apoio fixo (2 reações)"],
    ["encastramento", "Encastram.", "Encastramento (3 reações)"],
    ["rotula", "Rótula", "Rótula interior (M = 0)"],
    ["forca", "Força", "Força concentrada"],
    ["momento", "Momento", "Momento concentrado"],
    ["distribuida", "Distribuída", "Carga distribuída: uniforme, triangular ou trapezoidal"]
  ];

  function construirBarra() {
    $("ferramentas").innerHTML = FERRAMENTAS.map(function (f) {
      return '<button class="ferramenta' + (f[0] === est.ferramenta ? " ativa" : "") + '" data-ferramenta="' + f[0] + '" title="' + esc(f[2]) +
        '"><svg viewBox="0 0 30 26">' + ICONES[f[0]] + "</svg><span>" + f[1] + "</span></button>";
    }).join("");
    $("lista-exemplos").innerHTML = EXEMPLOS.map(function (e) {
      return '<button data-exemplo="' + e.chave + '">' + esc(e.nome) + "<small>" + esc(e.desc) + "</small></button>";
    }).join("");
  }

  function escolherFerramenta(f) {
    est.ferramenta = f;
    Array.prototype.forEach.call(document.querySelectorAll(".ferramenta"), function (b) {
      b.classList.toggle("ativa", b.getAttribute("data-ferramenta") === f);
    });
    $("area-desenho").style.cursor = f === "selecionar" ? "default" : "crosshair";
    mostrarEstado(dica());
  }

  function atualizarBotoes() {
    document.querySelector('[data-acao="desfazer"]').disabled = !est.hist.length;
    document.querySelector('[data-acao="refazer"]').disabled = !est.fut.length;
  }

  function descarregar(blob, nome) {
    var url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = nome;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
  }

  function guardarFicheiro() {
    var dados = { formato: "diagramas-de-esforcos", versao: 1, modelo: semIds(est.modelo) };
    descarregar(new Blob([JSON.stringify(dados, null, 2)], { type: "application/json" }), "viga.json");
  }

  function abrirFicheiro(ficheiro) {
    var leitor = new FileReader();
    leitor.onload = function () {
      try {
        var dados = JSON.parse(leitor.result), mod = dados.modelo || dados;
        if (!mod || typeof mod !== "object" || !(lerNum(mod.L) > 0)) throw new Error("sem comprimento");
        TIPOS.forEach(function (k) { if (mod[k] !== undefined && !Array.isArray(mod[k])) throw new Error(k); });
        carregarModelo(mod, true);
        mostrarEstado("Viga aberta de <b>" + esc(ficheiro.name) + "</b>.");
      } catch (e) {
        aviso("O ficheiro não é uma viga guardada por este programa.");
      }
    };
    leitor.readAsText(ficheiro);
  }

  function exportarImagem() {
    var g = est.geo, svg = construirSvg(g, est.res, true), img = new Image();
    img.onload = function () {
      var k = 2, c = document.createElement("canvas");
      c.width = g.W * k; c.height = g.H * k;
      var ctx = c.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(function (b) { if (b) descarregar(b, "diagramas.png"); else aviso("Este browser não deixou criar a imagem."); }, "image/png");
    };
    img.onerror = function () { aviso("Este browser não deixou criar a imagem."); };
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  }

  function ligarEventos() {
    var area = $("area-desenho");
    area.addEventListener("pointerdown", aoPremir);
    area.addEventListener("pointermove", aoMover);
    area.addEventListener("pointerup", aoLargar);
    area.addEventListener("pointercancel", aoLargar);
    area.addEventListener("pointerleave", function () { if (!est.arrasto) esconderCursor(); });
    area.addEventListener("contextmenu", aoMenuContexto);

    $("ferramentas").addEventListener("click", function (ev) {
      var b = ev.target.closest("[data-ferramenta]");
      if (b) escolherFerramenta(b.getAttribute("data-ferramenta"));
    });
    $("comprimento").addEventListener("change", function () { mudarComprimento(this.value); });
    $("comprimento").addEventListener("keydown", function (ev) { if (ev.key === "Enter") { ev.preventDefault(); this.blur(); } });
    $("grelha").addEventListener("change", function () { est.grelha = parseFloat(this.value) || 0; guardarLocal(); });
    $("mostrar-valores").addEventListener("change", function () { est.valores = this.checked; guardarLocal(); desenhar(); });

    document.querySelector(".barra").addEventListener("click", function (ev) {
      var b = ev.target.closest("[data-acao]");
      var lista = $("lista-exemplos");
      if (ev.target.closest("[data-exemplo]")) {
        var ch = ev.target.closest("[data-exemplo]").getAttribute("data-exemplo");
        var ex = EXEMPLOS.filter(function (e) { return e.chave === ch; })[0];
        lista.hidden = true;
        if (ex) { carregarModelo(ex.modelo, true); mostrarEstado("Exemplo: <b>" + esc(ex.nome) + "</b>. Ctrl+Z volta à viga anterior."); }
        return;
      }
      if (!b) return;
      var acao = b.getAttribute("data-acao");
      if (acao === "exemplos") { lista.hidden = !lista.hidden; return; }
      lista.hidden = true;
      if (acao === "desfazer") desfazer();
      else if (acao === "refazer") refazer();
      else if (acao === "limpar") { alterar(function (m) { var L = m.L; TIPOS.forEach(function (k) { m[k] = []; }); m.L = L; }); est.sel = null; est.seccao = null; atualizar(); mostrarEstado("Viga limpa. Ctrl+Z desfaz."); }
      else if (acao === "abrir") $("ficheiro").click();
      else if (acao === "guardar") guardarFicheiro();
      else if (acao === "imagem") exportarImagem();
      else if (acao === "imprimir") window.print();
    });
    document.querySelector('[data-acao="ajuda"]').addEventListener("click", dialogoAjuda);
    document.addEventListener("click", function (ev) {
      if (!ev.target.closest(".menu")) $("lista-exemplos").hidden = true;
    });
    $("ficheiro").addEventListener("change", function () {
      if (this.files && this.files[0]) abrirFicheiro(this.files[0]);
      this.value = "";
    });

    document.querySelector(".separadores").addEventListener("click", function (ev) {
      var b = ev.target.closest("[data-sep]");
      if (!b) return;
      var sep = b.getAttribute("data-sep");
      Array.prototype.forEach.call(document.querySelectorAll(".separador"), function (x) { x.classList.toggle("ativo", x === b); });
      $("sep-resultados").hidden = sep !== "resultados";
      $("sep-elementos").hidden = sep !== "elementos";
    });

    $("sep-elementos").addEventListener("click", function (ev) {
      var t = ev.target.closest("button");
      if (t && t.getAttribute("data-mais")) { acrescentar(t.getAttribute("data-mais")); return; }
      if (t && t.getAttribute("data-editar")) { editar(t.getAttribute("data-editar"), +t.getAttribute("data-id")); return; }
      if (t && t.getAttribute("data-apagar")) { apagar(t.getAttribute("data-apagar"), +t.getAttribute("data-id")); return; }
      var it = ev.target.closest("[data-item]");
      if (it) { est.sel = { k: it.getAttribute("data-item"), id: +it.getAttribute("data-id") }; desenhar(); painelElementos(); }
    });
    $("sep-elementos").addEventListener("dblclick", function (ev) {
      var it = ev.target.closest("[data-item]");
      if (it) editar(it.getAttribute("data-item"), +it.getAttribute("data-id"));
    });

    $("fundo-dialogo").addEventListener("pointerdown", function (ev) { if (ev.target === this) fecharDialogo(); });

    document.addEventListener("keydown", function (ev) {
      var tag = ev.target && ev.target.tagName, emCampo = tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA";
      if (ev.key === "Escape") {
        if (est.dialogo) { fecharDialogo(); return; }
        $("lista-exemplos").hidden = true;
        est.sel = null; est.seccao = null;
        escolherFerramenta("selecionar");
        desenhar(); painel();
        return;
      }
      if (est.dialogo || emCampo) return;
      var mod = ev.ctrlKey || ev.metaKey;
      if (mod && (ev.key === "z" || ev.key === "Z") && !ev.shiftKey) { ev.preventDefault(); desfazer(); }
      else if (mod && (ev.key === "y" || ev.key === "Y" || ((ev.key === "z" || ev.key === "Z") && ev.shiftKey))) { ev.preventDefault(); refazer(); }
      else if ((ev.key === "Delete" || ev.key === "Backspace") && est.sel) { ev.preventDefault(); apagar(est.sel.k, est.sel.id); }
      else if (ev.key === "ArrowLeft" && est.sel) { ev.preventDefault(); moverSelecionado(-1); }
      else if (ev.key === "ArrowRight" && est.sel) { ev.preventDefault(); moverSelecionado(1); }
    });

    var tempo = null;
    window.addEventListener("resize", function () {
      clearTimeout(tempo);
      tempo = setTimeout(function () { desenhar(); }, 80);
    });
  }

  function iniciar() {
    construirBarra();
    ligarEventos();
    var hash = (location.hash || "").replace("#", "");
    var ex = /exemplo=([a-z]+)/.exec(hash), guardado = lerLocal();
    var exemplo = ex ? EXEMPLOS.filter(function (e) { return e.chave === ex[1]; })[0] : null;
    if (guardado) {
      if (typeof guardado.grelha === "number") est.grelha = guardado.grelha;
      if (typeof guardado.valores === "boolean") est.valores = guardado.valores;
    }
    if (exemplo) est.modelo = comIds(exemplo.modelo);
    else if (hash === "vazio") est.modelo = comIds(vazio(6));
    else if (guardado && guardado.modelo && lerNum(guardado.modelo.L) > 0) est.modelo = comIds(guardado.modelo);
    else est.modelo = comIds(EXEMPLOS[0].modelo);
    $("comprimento").value = fmt(est.modelo.L);
    $("grelha").value = String(est.grelha);
    if ($("grelha").value === "") { est.grelha = 0.1; $("grelha").value = "0.1"; }
    $("mostrar-valores").checked = est.valores;
    escolherFerramenta("selecionar");
    atualizar();
  }

  // para os testes da interface
  window.Diagramas = {
    estado: est,
    carregar: function (mod) { carregarModelo(mod, true); },
    modelo: function () { return semIds(est.modelo); }
  };

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", iniciar);
  else iniciar();
})();

</script>
</body>
</html>
