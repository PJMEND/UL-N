<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagramas de Esforços · Estática</title>
<style>
:root {
  --azul: #12344F;
  --azul-medio: #2E5574;
  --azul-claro: #E6EDF3;
  --dourado: #FCC000;
  --carga: #C62828;
  --reacao: #1E7B34;
  --tracao: #C62828;
  --compressao: #2E6DA4;
  --texto: #1F2933;
  --texto-2: #52606D;
  --linha: #D5DCE3;
  --fundo: #F4F6F8;
  --branco: #FFFFFF;
  --verde-fundo: #E6F4EA;
  --ambar-fundo: #FFF6DA;
  --vermelho-fundo: #FDECEC;
  font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  color: var(--texto);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { display: flex; flex-direction: column; background: var(--fundo); font-size: 14px; }
button, input, select { font: inherit; color: inherit; }

/* ---- cabeçalho */
.topo {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--azul); color: #fff; padding: 8px 16px; gap: 12px;
}
.marca { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brasao {
  width: 42px; height: 42px; border-radius: 50%; background: #fff; flex: none;
  display: flex; align-items: center; justify-content: center;
}
.brasao img { width: 38px; height: 38px; }
.titulo { font-size: 19px; font-weight: 700; letter-spacing: 0.2px; }
.subtitulo { font-size: 12px; opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.botao-topo {
  background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.5);
  border-radius: 6px; padding: 6px 12px; cursor: pointer; white-space: nowrap;
}
.botao-topo:hover { background: rgba(255,255,255,0.12); }

/* ---- barra de ferramentas */
.barra {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px;
  background: var(--branco); border-bottom: 1px solid var(--linha); padding: 6px 12px;
}
.grupo { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.ferramenta {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  width: 62px; height: 54px; padding: 3px 2px; border: 1px solid transparent; border-radius: 7px;
  background: transparent; cursor: pointer; font-size: 11px; color: var(--texto-2); gap: 2px;
}
.ferramenta svg { width: 30px; height: 26px; }
.ferramenta:hover { background: var(--azul-claro); }
.ferramenta.ativa { background: var(--azul); color: #fff; border-color: var(--azul); }
.ferramenta.ativa svg * { stroke: #fff; }
.ferramenta.ativa svg .cheio { fill: #fff; }
.campos label { display: flex; flex-direction: column; font-size: 11px; color: var(--texto-2); gap: 2px; margin-right: 6px; }
.campos label.caixa { flex-direction: row; align-items: center; gap: 6px; font-size: 13px; color: var(--texto); }
.entrada { display: flex; align-items: center; gap: 4px; color: var(--texto); font-size: 13px; }
.campos input[type=text], .campos select {
  border: 1px solid var(--linha); border-radius: 5px; padding: 4px 6px; background: #fff; font-size: 13px;
}
.campos input[type=text] { width: 72px; text-align: right; }
.acao {
  border: 1px solid var(--linha); background: #fff; border-radius: 6px; padding: 6px 10px;
  cursor: pointer; font-size: 13px; white-space: nowrap;
}
.acao:hover { background: var(--azul-claro); }
.acao.icone { font-size: 17px; line-height: 1; padding: 4px 9px; }
.acao:disabled { opacity: 0.45; cursor: default; background: #fff; }
.menu { position: relative; }
.lista-menu {
  position: absolute; top: 100%; left: 0; z-index: 20; margin-top: 4px; min-width: 290px;
  background: #fff; border: 1px solid var(--linha); border-radius: 8px; box-shadow: 0 8px 24px rgba(18,52,79,0.18);
  padding: 4px;
}
.lista-menu button {
  display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px;
  border-radius: 5px; cursor: pointer;
}
.lista-menu button:hover { background: var(--azul-claro); }
.lista-menu small { display: block; color: var(--texto-2); font-size: 11.5px; }

/* ---- corpo */
.corpo { flex: 1; display: flex; min-height: 0; }
.coluna-desenho { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.area-desenho { flex: 1; overflow: auto; background: #fff; min-height: 0; touch-action: none; }
.area-desenho svg { display: block; user-select: none; -webkit-user-select: none; }
.estado {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  border-top: 1px solid var(--linha); background: #fff; padding: 6px 12px; font-size: 13px;
  color: var(--texto-2); min-height: 32px; font-variant-numeric: tabular-nums;
}
.estado b { color: var(--texto); }
.caixa-estado { display: flex; align-items: center; gap: 6px; white-space: nowrap; color: var(--texto); cursor: pointer; }
.painel {
  width: 400px; flex: none; border-left: 1px solid var(--linha); background: var(--fundo);
  display: flex; flex-direction: column; min-height: 0;
}
.separadores { display: flex; background: #fff; border-bottom: 1px solid var(--linha); }
.separador {
  flex: 1; border: 0; background: transparent; padding: 10px; cursor: pointer; font-weight: 600;
  color: var(--texto-2); border-bottom: 3px solid transparent;
}
.separador.ativo { color: var(--azul); border-bottom-color: var(--dourado); }
.conteudo-sep { flex: 1; overflow: auto; padding: 10px; }

.cartao {
  background: #fff; border: 1px solid var(--linha); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px;
}
.cartao h3 {
  margin: 0 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--azul);
  display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;
}
/* a convenção de sinais de cada quadro */
.conv {
  text-transform: none; letter-spacing: 0; font-size: 11px; font-weight: 600; white-space: nowrap;
  padding: 1px 8px; border-radius: 9px; border: 1px solid; cursor: help;
  -webkit-print-color-adjust: exact; print-color-adjust: exact;
}
.conv.equilibrio { background: var(--verde-fundo); color: var(--reacao); border-color: #B5DCC0; }
.conv.seccao { background: #E3EBF3; color: var(--azul); border-color: #BFCEDC; }
.cartao .nota { font-size: 12px; color: var(--texto-2); margin: 6px 0 0; }
.classe { border-left: 5px solid; }
.classe.isostatica { border-left-color: var(--reacao); background: var(--verde-fundo); }
.classe.hiperestatica { border-left-color: #C98A00; background: var(--ambar-fundo); }
.classe.hipostatica, .classe.erro { border-left-color: var(--carga); background: var(--vermelho-fundo); }
.classe .veredicto { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.classe .contagem { font-variant-numeric: tabular-nums; }
.classe ul { margin: 4px 0 0 18px; padding: 0; }

table.quadro { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
.quadro th { text-align: right; font-size: 11.5px; color: var(--texto-2); font-weight: 600; border-bottom: 1px solid var(--linha); padding: 3px 4px; }
.quadro td { text-align: right; padding: 3px 4px; border-bottom: 1px solid #EEF1F4; white-space: nowrap; }
.quadro th:first-child, .quadro td:first-child { text-align: left; }
.quadro td.ponto { text-align: left; color: var(--texto-2); font-size: 12px; white-space: normal; }
.quadro tr.especial td { background: #FFF9E3; }
.quadro tr.especial td.ponto { color: #8A6100; font-weight: 600; }
.quadro tr.salto-dir td { border-bottom: 1px solid var(--linha); }
.quadro .lado { color: var(--texto-2); font-size: 11px; }

.reacao { display: flex; justify-content: space-between; align-items: baseline; padding: 2px 0; font-variant-numeric: tabular-nums; }
.reacao .val { font-weight: 600; }
.reacao .seta { display: inline-block; width: 18px; text-align: center; color: var(--reacao); font-weight: 700; }
.apoio-cab { font-weight: 700; color: var(--azul); margin-top: 6px; }
.apoio-cab:first-of-type { margin-top: 0; }
.apoio-cab span { font-weight: 400; color: var(--texto-2); font-size: 12px; }
.verif { display: flex; gap: 12px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.verif span.ok { color: var(--reacao); font-weight: 700; }
.linha-max { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; font-variant-numeric: tabular-nums; }
.linha-max span:last-child { color: var(--texto-2); }
.seccao-entrada { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.seccao-entrada input { width: 80px; text-align: right; border: 1px solid var(--linha); border-radius: 5px; padding: 4px 6px; }

/* ---- elementos */
.grupo-el { margin-bottom: 10px; }
.grupo-el .cab { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.grupo-el .cab h3 { margin: 0; }
.mais { border: 1px solid var(--linha); background: #fff; border-radius: 5px; padding: 2px 8px; cursor: pointer; font-size: 12px; }
.mais:hover { background: var(--azul-claro); }
.item {
  display: flex; align-items: center; gap: 6px; padding: 5px 6px; border-radius: 6px; cursor: pointer;
  font-variant-numeric: tabular-nums;
}
.item:hover { background: var(--azul-claro); }
.item.sel { background: #FFF3C4; }
.item .desc { flex: 1; min-width: 0; }
.item .desc small { display: block; color: var(--texto-2); font-size: 11.5px; }
.item button { border: 0; background: transparent; cursor: pointer; padding: 2px 5px; border-radius: 4px; color: var(--texto-2); }
.item button:hover { background: #fff; color: var(--texto); }
.vazio { color: var(--texto-2); font-size: 12.5px; padding: 2px 6px; }

/* ---- diálogos */
.fundo-dialogo {
  position: fixed; inset: 0; background: rgba(18,52,79,0.35); z-index: 50;
  display: flex; align-items: center; justify-content: center; padding: 16px;
}
.fundo-dialogo[hidden] { display: none; }
.dialogo {
  background: #fff; border-radius: 10px; box-shadow: 0 16px 48px rgba(0,0,0,0.25);
  width: 100%; max-width: 440px; max-height: calc(100vh - 32px); overflow: auto; padding: 16px 18px;
}
.dialogo.largo { max-width: 680px; }
.dialogo h2 { margin: 0 0 12px; font-size: 17px; color: var(--azul); }
.dialogo h3 { font-size: 14px; color: var(--azul); margin: 16px 0 6px; }
.dialogo p, .dialogo li { line-height: 1.45; }
.dialogo ul { padding-left: 20px; }
.form { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; align-items: center; }
.form label { font-size: 13px; color: var(--texto-2); }
.form .campo { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.form input[type=text], .form select {
  border: 1px solid var(--linha); border-radius: 5px; padding: 5px 7px; font-size: 14px; background: #fff;
}
.form input[type=text] { width: 96px; text-align: right; }
.form .unidade { color: var(--texto-2); font-size: 13px; }
.opcoes { display: flex; gap: 4px; flex-wrap: wrap; }
.opcoes button {
  border: 1px solid var(--linha); background: #fff; border-radius: 5px; padding: 4px 9px; cursor: pointer; font-size: 13px;
}
.opcoes button.ativa { background: var(--azul); color: #fff; border-color: var(--azul); }
.opcoes button:disabled { opacity: 0.4; cursor: default; }
.previa { display: flex; gap: 12px; align-items: center; margin-top: 12px; padding: 8px; background: var(--fundo); border-radius: 8px; }
.previa svg { flex: none; background: #fff; border-radius: 6px; border: 1px solid var(--linha); }
.previa .info { font-size: 13px; font-variant-numeric: tabular-nums; line-height: 1.5; }
.erro-form { color: var(--carga); font-size: 13px; margin-top: 10px; min-height: 1em; }
.botoes { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.botoes button { border-radius: 6px; padding: 7px 16px; cursor: pointer; border: 1px solid var(--linha); background: #fff; }
.botoes .principal { background: var(--azul); color: #fff; border-color: var(--azul); }
.convencao { display: flex; justify-content: center; margin: 6px 0 10px; }
.convencao.pequena { justify-content: flex-start; margin: 2px 0 6px; }
kbd { border: 1px solid var(--linha); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font-size: 12px; background: var(--fundo); }

/* ---- ecrãs estreitos */
@media (max-width: 1050px) {
  .corpo { flex-direction: column; }
  .painel { width: auto; border-left: 0; border-top: 1px solid var(--linha); }
  .area-desenho { min-height: 560px; }
  .subtitulo { display: none; }
}

/* ---- impressão */
@media print {
  @page { size: A4 landscape; margin: 10mm; }
  body { background: #fff; display: block; }
  .barra, .botao-topo, .separadores, .estado, .mais, .item button, .seccao-entrada { display: none !important; }
  .topo { background: #fff; color: var(--azul); border-bottom: 2px solid var(--azul); padding: 0 0 6px; }
  .corpo { display: block; }
  .area-desenho { overflow: visible; }
  .area-desenho svg { width: 100%; height: auto; }
  .painel { width: auto; border: 0; display: block; }
  .conteudo-sep { overflow: visible; padding: 0; }
  #sep-elementos[hidden], #sep-resultados[hidden] { display: block !important; }
  .conteudo-sep { columns: 2; column-gap: 16px; }
  .cartao, .grupo-el { break-inside: avoid; }
  .cartao-seccao.sem-valor { display: none; }
}

</style>
</head>

<script>
/* Diagramas de Esforços — motor de cálculo.
 *
 * Viga plana de eixo reto e horizontal, com origem na extremidade esquerda.
 * Unidades: m e kN.
 *
 * Convenções (as da sebenta, §3):
 *   forças e reações    H positiva para a direita, V positiva para cima,
 *                       momentos positivos no sentido anti-horário;
 *   esforço normal N    positivo de tração;
 *   esforço transverso V positivo quando a resultante das forças à esquerda
 *                       da secção aponta para cima;
 *   momento fletor M    positivo quando traciona a fibra inferior.
 *
 * Isostáticas: resolve-se a matriz de equilíbrio das peças (exata, sem EI).

      for (var i = r + 1; i < nl; i++) if (Math.abs(A[i][c]) > Math.abs(A[p][c])) p = i;
      if (Math.abs(A[p][c]) <= tol) continue;
      var t = A[p]; A[p] = A[r]; A[r] = t;
      for (var k = r + 1; k < nl; k++) {
        var f = A[k][c] / A[r][c];

      r++;

  }

    var n = A0.length;

      if (Math.abs(A[p][c]) <= tol) return null;

  // ---------------------------------------------------------------- ações

  // Componentes de uma força: alfa medido a partir do eixo x, sentido anti-horário.
  function componentesForca(f) {

  // Direção da reação de um apoio móvel: ângulo medido a partir da vertical.
  function direcaoMovel(angulo) {

  // Dois triângulos, e não área e centroide do trapézio, para uma carga que troca
  // de sinal ao longo do troço, cuja resultante é nula mas o momento não.

  // ---------------------------------------------------------------- modelo

      rotulas: (mod.rotulas || []).map(function (r) { return { id: r.id, x: num(r.x, 0) }; }),
      forcas: (mod.forcas || []).map(function (f) { return { id: f.id, x: num(f.x, 0), F: num(f.F, 0), alfa: num(f.alfa, 270) }; }),
      momentos: (mod.momentos || []).map(function (q) {

      distribuidas: (mod.distribuidas || []).map(function (d) {

    m.apoios.forEach(function (a) {
      if (fora(a.x)) erros.push("O apoio em x = " + fmtx(a.x) + " m está fora da viga.");
      if (["movel", "fixo", "encastramento"].indexOf(a.tipo) < 0) erros.push("Tipo de apoio desconhecido: " + a.tipo + ".");
      if (a.tipo === "movel" && Math.abs(a.angulo) > 90 + TOL) erros.push("A reação de um apoio móvel faz com a vertical um ângulo entre -90° e 90°.");
    });

    m.rotulas.forEach(function (r) {
      if (r.x <= TOL || r.x >= L - TOL) erros.push("A rótula em x = " + fmtx(r.x) + " m tem de estar no interior da viga.");
    });
    for (var k = 1; k < m.rotulas.length; k++)
      if (Math.abs(m.rotulas[k].x - m.rotulas[k - 1].x) < TOL) erros.push("Há duas rótulas em x = " + fmtx(m.rotulas[k].x) + " m.");
    m.forcas.forEach(function (f) { if (fora(f.x)) erros.push("A força em x = " + fmtx(f.x) + " m está fora da viga."); });
    m.momentos.forEach(function (q) { if (fora(q.x)) erros.push("O momento em x = " + fmtx(q.x) + " m está fora da viga."); });
    m.distribuidas.forEach(function (d) {
      if (fora(d.x1) || fora(d.x2)) erros.push("A carga distribuída de " + fmtx(d.x1) + " a " + fmtx(d.x2) + " m sai da viga.");

  // ---------------------------------------------------------------- classificação

  // Parte-se a viga nas rótulas. Incógnitas: as reações e as duas forças de
  // ligação de cada rótula. Três equações de equilíbrio por peça (ΣFx, ΣFy e
  // ΣM em relação à origem).
  function equilibrioDasPecas(m) {
    var hx = m.rotulas.map(function (r) { return r.x; });

    cols.forEach(function (c, k) { c.e.forEach(function (t) { A[t[0]][k] += t[1]; }); });

  // ---------------------------------------------------------------- reações

  function reacaoVazia(a) {

  // Matriz de rigidez de flexão de um elemento (Euler-Bernoulli, EI = 1).

  // Gauss de 5 pontos: exato para este integrando (grau 4).
  var GP = [-0.906179845938664, -0.538469310105683, 0, 0.538469310105683, 0.906179845938664];
  var GW = [0.236926885056189, 0.478628670499366, 0.568888888888889, 0.478628670499366, 0.236926885056189];

  function fefTrapezio(w0, w1, a, b, L) {
    var vao = b - a, fef = [0, 0, 0, 0];

      var s = a + vao * (GP[k] + 1) / 2, ds = vao / 2;
      var w = w0 + (w1 - w0) * (s - a) / vao, t = s / L;
      var N1 = 1 - 3 * t * t + 2 * t * t * t;

      var N4 = s * s / L * (t - 1);
      fef[0] -= w * N1 * GW[k] * ds;
      fef[1] -= w * N2 * GW[k] * ds;
      fef[2] -= w * N3 * GW[k] * ds;
      fef[3] -= w * N4 * GW[k] * ds;
    }
    return fef;
  }

  function reacoesPorRigidez(m) {
    var L = m.L;

    m.apoios.forEach(function (a) { xs.push(a.x); });
    m.rotulas.forEach(function (r) { xs.push(r.x); });
    m.forcas.forEach(function (f) { xs.push(f.x); });

    var extra = {};

    var ndof = 3 * nn + m.rotulas.length;

    var K = matriz(ndof, ndof), f = zeros(ndof);
    for (var e = 0; e < nn - 1; e++) {

      var k4 = ke(Le);
      for (var a = 0; a < 4; a++) for (var b = 0; b < 4; b++) K[dofs[a]][dofs[b]] += k4[a][b];
      var ka = EA / Le, ua = 3 * e, ub = 3 * (e + 1);

    m.forcas.forEach(function (fo) {

    var linhas = [];
    m.apoios.forEach(function (a, ia) {
      var i = no(a.x);

        linhas.push({ apoio: ia, comp: "V", c: lv });

      }

    linhas.forEach(function (l, k) {
      Object.keys(l.c).forEach(function (dof) {

        S[+dof][ndof + k] = l.c[dof];
      });
    });
    var sol = resolverSistema(S, rhs);
    if (!sol) return null;

    var reac = m.apoios.map(reacaoVazia);
    linhas.forEach(function (l, k) {

      } else R[l.comp] = val;
    });
    return reac;
  }

  // ---------------------------------------------------------------- esforços

  function acoesConcentradas(m, reac) {
    var ac = [];
    reac.forEach(function (r) { ac.push({ x: r.x, Fx: r.H, Fy: r.V, M: r.M }); });
    m.forcas.forEach(function (f) { var c = componentesForca(f); ac.push({ x: f.x, Fx: c.Fx, Fy: c.Fy, M: 0 }); });
    m.momentos.forEach(function (q) { ac.push({ x: q.x, Fx: 0, Fy: 0, M: momentoAntiHorario(q) }); });
    return ac;
  }

  // Esforços na secção x, pelo equilíbrio da parte à esquerda.
  // lado = "esq": imediatamente à esquerda de x; "dir" (por omissão): à direita.
  function fazerEsforcos(m, ac) {
    return function (x, lado) {
      var dir = lado !== "esq", N = 0, V = 0, M = 0;
      for (var i = 0; i < ac.length; i++) {
        var a = ac[i];
        if (dir ? a.x <= x + TOL : a.x < x - TOL) {
          N -= a.Fx; V += a.Fy; M += a.Fy * (x - a.x) - a.M;
        }
      }
      for (var k = 0; k < m.distribuidas.length; k++) {
        var d = m.distribuidas[k];
        if (x > d.x1 + TOL) {

          for (var j = 0; j < pc.length; j++) { V -= pc[j].F; M -= pc[j].F * (x - pc[j].x); }
        }
      }
      return { N: N, V: V, M: M };
    };
  }

  function posicoesNotaveis(m) {
    var lista = [];
    function junta(x, motivo) {
      for (var i = 0; i < lista.length; i++)
        if (Math.abs(lista[i].x - x) <= TOL) { if (lista[i].motivos.indexOf(motivo) < 0) lista[i].motivos.push(motivo); return; }
      lista.push({ x: x, motivos: [motivo] });
    }
    junta(0, "extremidade"); junta(m.L, "extremidade");
    m.apoios.forEach(function (a) { junta(a.x, "apoio " + a.nome); });
    m.rotulas.forEach(function (r) { junta(r.x, "rótula"); });
    m.forcas.forEach(function (f) { junta(f.x, "força"); });
    m.momentos.forEach(function (q) { junta(q.x, "momento"); });
    m.distribuidas.forEach(function (d) { junta(d.x1, "início de carga"); junta(d.x2, "fim de carga"); });
    lista.sort(function (a, b) { return a.x - b.x; });
    lista.forEach(function (p) {
      // se há um apoio, é ele que dá o nome ao ponto
      var ap = p.motivos.filter(function (t) { return t.indexOf("apoio ") === 0; });
      var outros = p.motivos.filter(function (t) { return t.indexOf("apoio ") !== 0 && t !== "extremidade"; });
      p.nome = ap.length ? ap[0].slice(6) : "";
      p.descricao = (ap.length ? ["apoio " + p.nome] : []).concat(outros).join(", ") || "extremidade";
    });
    return lista;
  }

  function quaseIgual(a, b, escala) { return Math.abs(a - b) <= 1e-9 * Math.max(1, escala); }

  // Zeros de V num troço sem pontos notáveis no interior: V é aí um polinómio de
  // grau ≤ 2 (carga linear), que fica definido por três valores.
  function zerosV(esf, a, b, escala) {
    var V0 = esf(a, "dir").V, Vm = esf((a + b) / 2).V, V1 = esf(b, "esq").V;
    var c0 = V0, c2 = 2 * (V1 - 2 * Vm + V0), c1 = V1 - V0 - c2;
    var tol = 1e-9 * Math.max(1, escala), ts = [];
    if (Math.abs(c0) <= tol && Math.abs(c1) <= tol && Math.abs(c2) <= tol) return [];
    if (Math.abs(c2) <= tol) {
      if (Math.abs(c1) > tol) ts.push(-c0 / c1);
    } else {
      var disc = c1 * c1 - 4 * c2 * c0;
      if (disc >= 0) {
        var s = Math.sqrt(disc);
        ts.push((-c1 - s) / (2 * c2), (-c1 + s) / (2 * c2));
      }
    }
    ts.sort(function (p, q) { return p - q; });
    return ts.filter(function (t, i) { return t > 1e-7 && t < 1 - 1e-7 && (i === 0 || t - ts[i - 1] > 1e-9); })
      .map(function (t) { return a + t * (b - a); });
  }

  // Zeros de M no interior de um troço (M é aí um polinómio de grau ≤ 3).
  function zerosM(esf, a, b, escala) {
    var n = 64, tol = 1e-9 * Math.max(1, escala), out = [];
    function Mx(x) { return x <= a ? esf(a, "dir").M : x >= b ? esf(b, "esq").M : esf(x).M; }
    var xs = [], ms = [];
    for (var i = 0; i <= n; i++) { var x = a + (b - a) * i / n; xs.push(x); ms.push(Mx(x)); }
    if (ms.every(function (v) { return Math.abs(v) <= tol; })) return [];
    for (var k = 0; k < n; k++) {
      var m0 = ms[k], m1 = ms[k + 1];
      if (Math.abs(m0) <= tol) {
        if (k > 0 && Math.abs(ms[k - 1]) > tol && Math.abs(m1) > tol) out.push(xs[k]);
        continue;
      }
      if (Math.abs(m1) <= tol || (m0 < 0) === (m1 < 0)) continue;
      var lo = xs[k], hi = xs[k + 1];
      for (var it = 0; it < 80; it++) {
        var mid = (lo + hi) / 2, mm = Mx(mid);
        if ((mm < 0) === (m0 < 0)) lo = mid; else hi = mid;
      }
      out.push((lo + hi) / 2);
    }
    return out.filter(function (x) { return x > a + 1e-7 * (b - a) && x < b - 1e-7 * (b - a); });
  }

  // ---------------------------------------------------------------- resolver

  function resolver(modelo) {
    var m = normalizar(modelo);
    var erros = validar(m);
    var res = { modelo: m, erros: erros };
    if (erros.length) return res;

    var cls = classificar(m);
    res.classificacao = cls;
    res.resultantes = m.distribuidas.map(resultanteDistribuida);
    if (cls.tipo === "hipostatica") return res;

    var reac = cls.tipo === "isostatica" ? reacoesPorEquilibrio(m, cls) : reacoesPorRigidez(m);
    if (!reac) {
      cls.tipo = "hipostatica";
      cls.motivo = "O sistema de equações é singular: os vínculos não impedem todos os movimentos.";
      return res;
    }

    // escala das ações, para as tolerâncias
    var escala = 1;
    m.forcas.forEach(function (f) { escala = Math.max(escala, Math.abs(f.F)); });
    m.momentos.forEach(function (q) { escala = Math.max(escala, Math.abs(q.M) / m.L); });
    m.distribuidas.forEach(function (d) { escala = Math.max(escala, Math.abs(d.q1) * m.L, Math.abs(d.q2) * m.L); });
    var escalaM = escala * m.L;

    reac.forEach(function (r) {
      ["H", "V", "M", "R"].forEach(function (k) { r[k] = limpa(r[k], k === "M" ? escalaM * 1e3 : escala * 1e3); });
    });
    res.reacoes = reac;
    var ac = acoesConcentradas(m, reac);
    var esf = fazerEsforcos(m, ac);
    function esfLimpo(x, lado) {
      var v = esf(x, lado);
      return { N: limpa(v.N, escala * 1e3), V: limpa(v.V, escala * 1e3), M: limpa(v.M, escalaM * 1e3) };
    }
    res.esforcos = esfLimpo;

    // pontos notáveis, com os valores à esquerda e à direita
    var pos = posicoesNotaveis(m);
    pos.forEach(function (p) {
      p.esq = esfLimpo(p.x, "esq");
      p.dir = esfLimpo(p.x, "dir");
      p.salto = !(quaseIgual(p.esq.N, p.dir.N, escala) && quaseIgual(p.esq.V, p.dir.V, escala) && quaseIgual(p.esq.M, p.dir.M, escalaM));
    });
    res.pontos = pos;

    // extremos de M (V = 0) e zeros de M, troço a troço
    var extremos = [], nulos = [];
    for (var i = 0; i < pos.length - 1; i++) {
      var a = pos[i].x, b = pos[i + 1].x;
      zerosV(esf, a, b, escala).forEach(function (x) { extremos.push({ x: x, M: esfLimpo(x).M }); });
      zerosM(esf, a, b, escalaM).forEach(function (x) { nulos.push(x); });
    }
    res.extremos = extremos;
    res.zerosM = nulos;

    // amostragem dos diagramas: os saltos ficam na vertical
    var pts = [];
    function empurra(x, v) { pts.push({ x: x, N: v.N, V: v.V, M: v.M }); }
    for (var k = 0; k < pos.length; k++) {
      empurra(pos[k].x, pos[k].esq);
      empurra(pos[k].x, pos[k].dir);
      if (k === pos.length - 1) break;
      var x0 = pos[k].x, x1 = pos[k + 1].x;
      var interiores = [];
      var n = Math.max(24, Math.ceil(120 * (x1 - x0) / m.L));
      for (var s = 1; s < n; s++) interiores.push(x0 + (x1 - x0) * s / n);
      extremos.concat(nulos.map(function (x) { return { x: x }; })).forEach(function (e) {
        if (e.x > x0 && e.x < x1) interiores.push(e.x);
      });
      interiores.sort(function (p1, p2) { return p1 - p2; }).forEach(function (x) { empurra(x, esfLimpo(x)); });
    }
    res.diagrama = pts;

    // máximos e mínimos
    function extremo(chave, sinal) {
      var melhor = null;
      pts.forEach(function (p) {
        var v = p[chave] * sinal;
        if (melhor === null || v > melhor.v + 1e-12) melhor = { v: v, x: p.x, valor: p[chave] };
      });
      return melhor && melhor.valor * sinal > 0 ? { x: melhor.x, valor: melhor.valor } : null;
    }
    res.maximos = {
      Nmax: extremo("N", 1), Nmin: extremo("N", -1),
      Vmax: extremo("V", 1), Vmin: extremo("V", -1),
      Mmax: extremo("M", 1), Mmin: extremo("M", -1)
    };

    // verificação do equilíbrio global, com momentos em relação ao primeiro apoio
    var xr = m.apoios.length ? m.apoios[0].x : 0, Fx = 0, Fy = 0, Mr = 0;
    ac.forEach(function (a) { Fx += a.Fx; Fy += a.Fy; Mr += a.Fy * (a.x - xr) + a.M; });
    m.distribuidas.forEach(function (d) {
      parcelas(d, d.x1, d.x2).forEach(function (pc) { Fy -= pc.F; Mr -= pc.F * (pc.x - xr); });
    });
    res.equilibrio = { Fx: limpa(Fx, escala * 1e3), Fy: limpa(Fy, escala * 1e3), M: limpa(Mr, escalaM * 1e3), xRef: xr,
                       ref: m.apoios.length ? m.apoios[0].nome : "O" };
    return res;
  }

  global.Solver = {
    resolver: resolver,
    componentesForca: componentesForca,
    direcaoMovel: direcaoMovel,
    resultanteDistribuida: resultanteDistribuida,
    normalizar: normalizar,
    TOL: TOL
  };
})(typeof window !== "undefined" ? window : this);

<script>
/* Diagramas de Esforços — interface.
 *
 * Desenho em SVG: o modelo da viga em cima e os diagramas de N, V e M por baixo,
 * com o mesmo eixo x. Cada alteração volta a resolver a viga e a desenhar tudo.
 */
(function () {
  "use strict";
  var S = window.Solver;

  var COR = {
    azul: "#12344F", dourado: "#FCC000", carga: "#C62828", cargaClaro: "#F9DEDE",
    reacao: "#1E7B34", tracao: "#C62828", tracaoClaro: "#F7D7D7", compressao: "#2E6DA4",
    compressaoClaro: "#D5E4F2", preenche: "#DCE4EC", cinza: "#7B8794", guia: "#E4E9EE",
    texto: "#1F2933"
  };
  var FONTE = "Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif";
  var TIPOS = ["apoios", "rotulas", "forcas", "momentos", "distribuidas"];
  var CHAVE_LOCAL = "est-diagramas-esforcos-v1";
  var NOME_APOIO = { movel: "Apoio móvel", fixo: "Apoio fixo", encastramento: "Encastramento" };

  // ------------------------------------------------------------ formatação

  function fmt(v, casas) {
    if (casas === undefined) casas = 2;
    if (v === null || v === undefined || !isFinite(v)) return "—";
    if (Math.abs(v) < 0.5 * Math.pow(10, -casas)) v = 0;
    return v.toFixed(casas).replace(".", ",");
  }
  function fmtAng(a) {
    var t = Math.round(a * 100) / 100;
    return (t % 1 === 0 ? t.toFixed(0) : fmt(t, 2)) + "°";
  }
  function lerNum(s) {
    if (typeof s === "number") return s;
    s = String(s).trim().replace(/\s/g, "").replace(",", ".").replace("−", "-");
    if (!/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s)) return NaN;
    return parseFloat(s);
  }
  function esc(t) {
    return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function $(id) { return document.getElementById(id); }
  function r1(v) { return Math.round(v * 10) / 10; }
  function arred(x) { return Math.round(x * 1e6) / 1e6; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  // índice em HTML: R<sub>Av</sub>
  function nomeHtml(base, ind) { return esc(base) + "<sub>" + esc(ind) + "</sub>"; }
  // índice em SVG
  function nomeSvg(base, ind, resto) {
    return esc(base) + '<tspan dy="3.5" font-size="78%">' + esc(ind) + '</tspan><tspan dy="-3.5">' + resto + "</tspan>";
  }

  // ------------------------------------------------------------ forças: ângulos

  function angulosDeAlfa(alfa) {
    var a = ((alfa % 360) + 360) % 360, rr = a * Math.PI / 180;
    var cx = Math.cos(rr), cy = Math.sin(rr);
    if (Math.abs(cx) < 1e-9) cx = 0;
    if (Math.abs(cy) < 1e-9) cy = 0;
    var th = Math.atan2(Math.abs(cy), Math.abs(cx)) * 180 / Math.PI;
    return { theta: Math.round(th * 1e6) / 1e6, sh: cx < 0 ? "esq" : "dir", sv: cy > 0 ? "cima" : "baixo" };
  }
  function alfaDeAngulos(theta, sh, sv) {
    var a;
    if (sh === "dir" && sv === "baixo") a = 360 - theta;
    else if (sh === "esq" && sv === "baixo") a = 180 + theta;
    else if (sh === "dir") a = theta;
    else a = 180 - theta;
    return arred(((a % 360) + 360) % 360);
  }
  function descreverDirecao(alfa) {
    var g = angulosDeAlfa(alfa);
    if (Math.abs(g.theta - 90) < 1e-6) return g.sv === "baixo" ? "vertical ↓" : "vertical ↑";
    if (g.theta < 1e-6) return g.sh === "dir" ? "horizontal →" : "horizontal ←";
    var s = { "dir-baixo": "↘", "esq-baixo": "↙", "dir-cima": "↗", "esq-cima": "↖" }[g.sh + "-" + g.sv];
    return "a " + fmtAng(g.theta) + " com a horizontal " + s;
  }

  // ------------------------------------------------------------ exemplos

  var EXEMPLOS = [
    { chave: "simples", nome: "Viga simplesmente apoiada", desc: "Carga uniforme num vão de 6,00 m",
      modelo: { L: 6, apoios: [{ x: 0, tipo: "fixo" }, { x: 6, tipo: "movel" }], distribuidas: [{ x1: 0, x2: 6, q1: 10, q2: 10 }] } },
    { chave: "consola", nome: "Consola", desc: "Encastrada, com uma força na extremidade livre",
      modelo: { L: 3, apoios: [{ x: 0, tipo: "encastramento" }], forcas: [{ x: 3, F: 20, alfa: 270 }] } },
    { chave: "balanco", nome: "Viga com consola", desc: "Vão de 6,00 m e consola de 2,00 m",
      modelo: { L: 8, apoios: [{ x: 0, tipo: "fixo" }, { x: 6, tipo: "movel" }], forcas: [{ x: 8, F: 15, alfa: 270 }],
                distribuidas: [{ x1: 0, x2: 8, q1: 10, q2: 10 }] } },
    { chave: "triangular", nome: "Carga triangular", desc: "De 0 a 18 kN/m num vão de 6,00 m",
      modelo: { L: 6, apoios: [{ x: 0, tipo: "fixo" }, { x: 6, tipo: "movel" }], distribuidas: [{ x1: 0, x2: 6, q1: 0, q2: 18 }] } },
    { chave: "inclinada", nome: "Força inclinada e momento", desc: "25 kN a 45° e um momento de 20 kN·m",
      modelo: { L: 6, apoios: [{ x: 0, tipo: "fixo" }, { x: 6, tipo: "movel" }], forcas: [{ x: 2, F: 25, alfa: 315 }],
                momentos: [{ x: 4.5, M: 20, sentido: "horario" }] } },
    { chave: "rotula", nome: "Viga com rótula", desc: "Encastramento, rótula e apoio móvel",
      modelo: { L: 10, apoios: [{ x: 0, tipo: "encastramento" }, { x: 10, tipo: "movel" }], rotulas: [{ x: 4 }],
                distribuidas: [{ x1: 0, x2: 10, q1: 8, q2: 8 }] } },
    { chave: "continua", nome: "Viga contínua (hiperestática)", desc: "Dois tramos de 5,00 m",
      modelo: { L: 10, apoios: [{ x: 0, tipo: "fixo" }, { x: 5, tipo: "movel" }, { x: 10, tipo: "movel" }],
                distribuidas: [{ x1: 0, x2: 10, q1: 12, q2: 12 }] } }

  // ------------------------------------------------------------ estado

  var est = {
    modelo: null, proximoId: 1, ferramenta: "selecionar", grelha: 0.1, valores: true,
    sel: null, seccao: null, hist: [], fut: [], res: null, geo: null,
    arrasto: null, previa: null, ultimo: {}, dialogo: false, temporizador: null
  };

  function vazio(L) { return { L: L || 6, apoios: [], rotulas: [], forcas: [], momentos: [], distribuidas: [] }; }

  function comIds(mod) {
    var m = vazio(lerNum(mod.L) > 0 ? lerNum(mod.L) : 6);
    TIPOS.forEach(function (k) {
      (mod[k] || []).forEach(function (e) {
        var c = {};
        Object.keys(e).forEach(function (q) {
          if (q === "id" || q === "nome") return;
          var v = e[q];
          c[q] = q === "tipo" || q === "sentido" ? v : lerNum(v);
        });
        c.id = est.proximoId++;
        m[k].push(c);
      });
    });
    m.apoios.forEach(function (a) { if (a.tipo === "movel" && a.angulo === undefined) a.angulo = 0; });
    m.distribuidas.forEach(function (d) { if (d.q2 === undefined) d.q2 = d.q1; });
    return m;
  }

  function semIds(mod) {
    var m = { L: mod.L };
    TIPOS.forEach(function (k) {
      m[k] = mod[k].map(function (e) {
        var c = {};
        Object.keys(e).forEach(function (q) { if (q !== "id") c[q] = e[q]; });
        return c;
      });
    });
    return m;
  }

  function acharElemento(k, id) {
    var lista = est.modelo[k] || [];
    for (var i = 0; i < lista.length; i++) if (lista[i].id === id) return lista[i];
    return null;
  }

  function guardarHistorico() {
    est.hist.push(JSON.stringify(est.modelo));
    if (est.hist.length > 200) est.hist.shift();
    est.fut = [];
  }

  function alterar(fn) {
    guardarHistorico();
    fn(est.modelo);
    atualizar();
  }

  function desfazer() {
    if (!est.hist.length) return;
    est.fut.push(JSON.stringify(est.modelo));
    est.modelo = JSON.parse(est.hist.pop());
    depoisDeRepor();
  }

  function refazer() {
    if (!est.fut.length) return;
    est.hist.push(JSON.stringify(est.modelo));
    est.modelo = JSON.parse(est.fut.pop());
    depoisDeRepor();
  }

  function depoisDeRepor() {
    if (est.sel && !acharElemento(est.sel.k, est.sel.id)) est.sel = null;
    $("comprimento").value = fmt(est.modelo.L);
    atualizar();
  }

  function carregarModelo(mod, comHistorico) {
    if (comHistorico) guardarHistorico();
    est.modelo = comIds(mod);
    est.sel = null;
    est.seccao = null;
    $("comprimento").value = fmt(est.modelo.L);
    atualizar();
  }

  function guardarLocal() {
    try {
      localStorage.setItem(CHAVE_LOCAL, JSON.stringify({ modelo: semIds(est.modelo), grelha: est.grelha, valores: est.valores }));

  }

  function atualizar() {
    est.res = S.resolver(est.modelo);
    guardarLocal();
    desenhar();
    painel();
    atualizarBotoes();
  }

  function recalcular() {
    est.res = S.resolver(est.modelo);
    agendar();
  }

  function geometria() {
    var area = $("area-desenho");
    var Hd = Math.max(520, Math.floor(area.clientHeight) - 4);
    var hM = Math.max(250, Math.round(Hd * 0.4));
    var hD = Math.max(90, Math.floor((Hd - hM) / 3));
    // se o desenho não couber na altura, aparece a barra de deslocamento: descontá-la
    var barra = hM + 3 * hD > area.clientHeight ? 18 : 0;
    var W = Math.max(640, Math.floor(area.clientWidth) - barra);
    var ml = 96, mr = 48, L = est.modelo.L;
    var sx = (W - ml - mr) / L;
    // por baixo da viga: apoios, reações (até três linhas de rótulos) e cotas
    var g = { W: W, ml: ml, mr: mr, sx: sx, L: L, hM: hM, hD: hD, y0: hM - 136 };
    g.H = hM + 3 * hD;
    g.X = function (x) { return ml + x * sx; };
    g.xDe = function (px) { return (px - ml) / sx; };
    g.paineis = [
      { k: "N", top: hM, h: hD, nome: "N", unidade: "kN", nota: "tração +" },
      { k: "V", top: hM + hD, h: hD, nome: "V", unidade: "kN", nota: "" },
      { k: "M", top: hM + 2 * hD, h: hD, nome: "M", unidade: "kN·m", nota: "lado tracionado" }
    ];

  }

  // ---- primitivas SVG

  function linha(x1, y1, x2, y2, cor, esp, extra) {
    return '<line x1="' + r1(x1) + '" y1="' + r1(y1) + '" x2="' + r1(x2) + '" y2="' + r1(y2) +
      '" stroke="' + cor + '" stroke-width="' + esp + '"' + (extra || "") + "/>";
  }

  function seta(x1, y1, x2, y2, cor, esp, tracejado) {
    var dx = x2 - x1, dy = y2 - y1, l = Math.hypot(dx, dy);
    if (l < 1e-6) return "";
    var ux = dx / l, uy = dy / l, c = Math.min(10, l * 0.5), w = c * 0.42 + esp * 0.4;
    var bx = x2 - ux * c, by = y2 - uy * c;
    return linha(x1, y1, bx, by, cor, esp, tracejado ? ' stroke-dasharray="4 3"' : "") +
      '<polygon points="' + r1(x2) + "," + r1(y2) + " " + r1(bx - uy * w) + "," + r1(by + ux * w) + " " +
      r1(bx + uy * w) + "," + r1(by - ux * w) + '" fill="' + cor + '"/>';
  }

  // arco de (cx, cy), ângulos de ecrã em graus (y para baixo: a crescer = horário), com seta no fim
  function arco(cx, cy, raio, th0, th1, cor, esp, ponta) {
    var sg = th1 > th0 ? 1 : -1, c = ponta || 9, w = c * 0.49;
    var dth = (c * 0.85 / raio) * 180 / Math.PI * sg;
    var n = 30, pts = [];
    for (var i = 0; i <= n; i++) {
      var t = (th0 + (th1 - dth - th0) * i / n) * Math.PI / 180;
      pts.push(r1(cx + raio * Math.cos(t)) + "," + r1(cy + raio * Math.sin(t)));
    }
    var te = th1 * Math.PI / 180;
    var ex = cx + raio * Math.cos(te), ey = cy + raio * Math.sin(te);
    var ux = -Math.sin(te) * sg, uy = Math.cos(te) * sg;
    var bx = ex - ux * c, by = ey - uy * c;
    return '<polyline fill="none" stroke="' + cor + '" stroke-width="' + esp + '" points="' + pts.join(" ") + '"/>' +
      '<polygon points="' + r1(ex) + "," + r1(ey) + " " + r1(bx - uy * w) + "," + r1(by + ux * w) + " " +
      r1(bx + uy * w) + "," + r1(by - ux * w) + '" fill="' + cor + '"/>';
  }

  function texto(x, y, t, o) {
    o = o || {};
    return '<text x="' + r1(x) + '" y="' + r1(y) + '" font-size="' + (o.tam || 12) + '" fill="' + (o.cor || COR.texto) +
      '" text-anchor="' + (o.ancora || "middle") + '"' + (o.peso ? ' font-weight="' + o.peso + '"' : "") +
      (o.halo ? ' stroke="#fff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"' : "") +
      (o.estilo ? ' font-style="' + o.estilo + '"' : "") + ">" + t + "</text>";
  }

  function larguraTexto(t, tam) { return String(t).replace(/<[^>]*>/g, "").length * tam * 0.56 + 4; }

  // caixas já ocupadas por rótulos, para não escrever uns por cima dos outros
  function Colocador() { this.caixas = []; }
  Colocador.prototype.livre = function (b) {
    for (var i = 0; i < this.caixas.length; i++) {
      var c = this.caixas[i];
      if (!(b.x + b.w < c.x || c.x + c.w < b.x || b.y + b.h < c.y || c.y + c.h < b.y)) return false;
    }
    return true;
  };
  Colocador.prototype.por = function (b) { this.caixas.push(b); };
  function caixaTexto(x, y, t, tam, ancora) {
    var w = larguraTexto(t, tam);
    var x0 = ancora === "start" ? x : ancora === "end" ? x - w : x - w / 2;
    return { x: x0, y: y - tam * 0.9, w: w, h: tam + 2 };
  }

  // ------------------------------------------------------------ desenho do modelo

  function nomesApoios() {
    var mapa = {};
    if (est.res && est.res.modelo) est.res.modelo.apoios.forEach(function (a) { mapa[a.id] = a.nome; });
    return mapa;
  }

  function reacaoDoApoio(id) {
    if (!est.res || !est.res.reacoes) return null;
    for (var i = 0; i < est.res.reacoes.length; i++) if (est.res.reacoes[i].id === id) return est.res.reacoes[i];
    return null;
  }

  function eSel(k, id) { return est.sel && est.sel.k === k && est.sel.id === id; }

  function realce(x, y, w, h) {
    return '<rect x="' + r1(x) + '" y="' + r1(y) + '" width="' + r1(w) + '" height="' + r1(h) +
      '" rx="6" fill="' + COR.dourado + '" fill-opacity="0.32" stroke="' + COR.dourado + '" stroke-width="1.5"/>';
  }

  function grupo(k, id, conteudo) { return '<g class="el" data-k="' + k + '" data-id="' + id + '" style="cursor:pointer">' + conteudo + "</g>"; }

  function desenharApoio(g, a, nome) {
    var x = g.X(a.x), y0 = g.y0, s = "", az = COR.azul, i;
    if (eSel("apoios", a.id)) s += realce(x - 22, y0 - 22, 44, 54);
    if (a.tipo === "encastramento") {
      var lado = a.x >= g.L - 1e-9 && a.x > 1e-9 ? 1 : -1;
      s += linha(x, y0 - 20, x, y0 + 20, az, 4);
      for (i = 0; i < 6; i++) { var yy = y0 - 18 + i * 7.2; s += linha(x, yy, x + lado * 9, yy + 9, az, 1.3); }
      // a letra fica por fora, acima do arco do momento de encastramento
      s += texto(x + lado * 34, y0 - 22, esc(nome), { tam: 14, peso: 700, cor: az, ancora: lado > 0 ? "start" : "end" });
      s += '<rect x="' + r1(x - 16) + '" y="' + r1(y0 - 22) + '" width="32" height="46" fill="transparent"/>';
    } else {
      var ang = a.tipo === "movel" ? (a.angulo || 0) : 0;
      var t = '<polygon points="' + r1(x) + "," + r1(y0 + 3) + " " + r1(x - 11) + "," + r1(y0 + 21) + " " + r1(x + 11) + "," + r1(y0 + 21) +
        '" fill="#fff" stroke="' + az + '" stroke-width="1.8" stroke-linejoin="round"/>';
      var base = a.tipo === "movel" ? y0 + 26 : y0 + 21;
      t += linha(x - 16, base, x + 16, base, az, 1.8);
      for (i = 0; i < 6; i++) { var hx = x - 13 + i * 5.6; t += linha(hx, base, hx - 5, base + 6, az, 1.1); }
      s += ang ? '<g transform="rotate(' + r1(ang) + " " + r1(x) + " " + r1(y0 + 3) + ')">' + t + "</g>" : t;
      // inclinado para a direita, o símbolo avança para a esquerda: a letra afasta-se
      s += texto(x - 20 - Math.max(0, ang) / 90 * 16, y0 + 17, esc(nome), { tam: 14, peso: 700, cor: az, ancora: "end" });
      s += '<rect x="' + r1(x - 18) + '" y="' + r1(y0) + '" width="36" height="34" fill="transparent"/>';
    }
    return grupo("apoios", a.id, s);
  }

  // setas e rótulos das reações; os rótulos vão para um bloco por baixo do apoio
  function desenharReacao(g, a, R, nome, blocos) {
    var x = g.X(a.x), y0 = g.y0, s = "", vd = COR.reacao, linhas = [];
    var temH = Math.abs(R.H) >= 0.005, temV = Math.abs(R.V) >= 0.005, temM = Math.abs(R.M) >= 0.005;
    var inclinado = a.tipo === "movel" && Math.abs(a.angulo || 0) > 1e-9;
    if (inclinado) {
      if (Math.abs(R.R) >= 0.005) {
        var b = (a.angulo || 0) * Math.PI / 180, dx = -Math.sin(b), dy = Math.cos(b);  // do apoio para fora
        var px = x + dx * 34, py = y0 + 3 + dy * 34, qx = x + dx * 72, qy = y0 + 3 + dy * 72;
        s += R.R > 0 ? seta(qx, qy, px, py, vd, 2) : seta(px, py, qx, qy, vd, 2);
      }
      linhas.push(nomeSvg("R", nome, " = " + fmt(Math.abs(R.R)) + " kN"));
      linhas.push('<tspan font-size="10.5">(H ' + fmt(R.H) + " · V " + fmt(R.V) + ")</tspan>");
    } else {
      if (temV) {
        var yTopo = a.tipo === "encastramento" ? y0 + 26 : y0 + 33;
        s += R.V > 0 ? seta(x, y0 + 70, x, yTopo, vd, 2.2) : seta(x, yTopo, x, y0 + 70, vd, 2.2);
      }
      if (a.tipo === "movel") linhas.push(nomeSvg("R", nome, " = " + fmt(Math.abs(R.V)) + " kN"));
      else {
        linhas.push(nomeSvg("R", nome + "v", " = " + fmt(Math.abs(R.V)) + " kN"));
        // a componente horizontal vai abaixo do símbolo, para não cortar a letra do apoio
        if (temH) s += R.H > 0 ? seta(x - 58, y0 + 46, x - 6, y0 + 46, vd, 2.2) : seta(x + 58, y0 + 46, x + 6, y0 + 46, vd, 2.2);
        linhas.push(nomeSvg("R", nome + "h", " = " + fmt(Math.abs(R.H)) + " kN"));
      }
    }
    if (a.tipo === "encastramento") {
      if (temM) {
        var lado = a.x >= g.L - 1e-9 && a.x > 1e-9 ? 1 : (a.x <= 1e-9 ? -1 : 0);
        var anti = R.M > 0, th0, th1;
        if (lado < 0) { th0 = anti ? 260 : 100; th1 = anti ? 100 : 260; }
        else if (lado > 0) { th0 = anti ? 80 : -80; th1 = anti ? -80 : 80; }
        else { th0 = anti ? 340 : 200; th1 = anti ? 200 : 340; }
        s += arco(x, y0, 27, th0, th1, vd, 2);
      }
      linhas.push(nomeSvg("M", nome, " = " + fmt(Math.abs(R.M)) + " kN·m"));
    }
    var w = 0;
    linhas.forEach(function (l) { w = Math.max(w, larguraTexto(l.replace(/<[^>]*>/g, ""), 12)); });
    blocos.push({ x: x, w: w, linhas: linhas });
    return s;
  }

  function colocarBlocos(g, blocos) {
    var s = "", y = g.y0 + 84, fim = -1e9;
    blocos.sort(function (a, b) { return a.x - b.x; });
    blocos.forEach(function (b) {
      var x0 = clamp(b.x - b.w / 2, 4, g.W - 4 - b.w);
      if (x0 < fim + 10) x0 = fim + 10;
      fim = x0 + b.w;
      b.linhas.forEach(function (l, i) {
        s += texto(x0 + b.w / 2, y + i * 14, l, { tam: 12, cor: COR.reacao, peso: i === 0 ? 600 : 500, halo: true });
      });
    });
    return s;
  }

  function desenharRotula(g, rt) {
    var x = g.X(rt.x), y0 = g.y0, s = "";
    if (eSel("rotulas", rt.id)) s += realce(x - 13, y0 - 13, 26, 26);
    s += '<circle cx="' + r1(x) + '" cy="' + y0 + '" r="6.5" fill="#fff" stroke="' + COR.azul + '" stroke-width="2.4"/>';
    s += '<circle cx="' + r1(x) + '" cy="' + y0 + '" r="12" fill="transparent"/>';
    return grupo("rotulas", rt.id, s);
  }

  function desenharForca(g, f, col) {
    var c = S.componentesForca(f), F = Math.hypot(c.Fx, c.Fy);
    if (F < 1e-12) return "";
    var ux = c.Fx / F, uy = -c.Fy / F, len = 56, x = g.X(f.x), y0 = g.y0, s = "";
    var horizontal = Math.abs(c.Fy) <= 1e-9 * F;
    var cabeca, cauda;
    if (horizontal) {
      cabeca = [x, y0 - 10]; cauda = [x - ux * len, y0 - 10];
    } else if (c.Fy < 0) {
      cabeca = [x, y0 - 4]; cauda = [x - ux * len, y0 - 4 - uy * len];
    } else {
      cauda = [x, y0 - 4]; cabeca = [x + ux * len, y0 - 4 + uy * len];
    }
    var minx = Math.min(cabeca[0], cauda[0]), maxx = Math.max(cabeca[0], cauda[0]);
    var miny = Math.min(cabeca[1], cauda[1]), maxy = Math.max(cabeca[1], cauda[1]);
    if (eSel("forcas", f.id)) s += realce(minx - 12, miny - 12, maxx - minx + 24, maxy - miny + 18);
    var inclinada = !horizontal && Math.abs(c.Fx) > 1e-9 * F;
    if (inclinada) {
      var canto = [cabeca[0], cauda[1]];
      s += seta(cauda[0], cauda[1], canto[0], canto[1], COR.carga, 1.2, true);
      s += seta(canto[0], canto[1], cabeca[0], cabeca[1], COR.carga, 1.2, true);
      var aH = ux > 0 ? 0 : 180, aF = Math.atan2(cabeca[1] - cauda[1], cabeca[0] - cauda[0]) * 180 / Math.PI;
      var d = aF - aH;
      while (d > 180) d -= 360;
      while (d < -180) d += 360;
      var n = 16, pts = [];
      for (var i = 0; i <= n; i++) {
        var t = (aH + d * i / n) * Math.PI / 180;
        pts.push(r1(cauda[0] + 18 * Math.cos(t)) + "," + r1(cauda[1] + 18 * Math.sin(t)));
      }
      s += '<polyline fill="none" stroke="' + COR.carga + '" stroke-width="1" points="' + pts.join(" ") + '"/>';
      var tm = (aH + d / 2) * Math.PI / 180;
      s += texto(cauda[0] + 31 * Math.cos(tm), cauda[1] + 31 * Math.sin(tm) + 4, fmtAng(angulosDeAlfa(f.alfa).theta),
        { tam: 10.5, cor: COR.carga, halo: true });
    }
    s += seta(cauda[0], cauda[1], cabeca[0], cabeca[1], COR.carga, 2.3);
    // rótulo junto à extremidade livre da seta
    var livre = (c.Fy < 0 || horizontal) ? cauda : cabeca;
    var rot = fmt(F) + " kN", tam = 12, ancora = "middle", lx = livre[0], ly = livre[1] - 7;
    if (horizontal) { ancora = ux > 0 ? "end" : "start"; lx = livre[0] - ux * 4; ly = livre[1] + 4; }
    else if (Math.abs(ux) > 0.2) { ancora = (livre === cauda ? -ux : ux) > 0 ? "start" : "end"; lx = livre[0] + (ancora === "start" ? 3 : -3); }
    for (var tentativa = 0; tentativa < 4; tentativa++) {
      var cx = caixaTexto(lx, ly, rot, tam, ancora);
      if (col.livre(cx)) { col.por(cx); break; }
      ly -= 13;
    }
    s += texto(lx, ly, esc(rot), { tam: tam, cor: COR.carga, peso: 600, halo: true, ancora: ancora });
    s += linha(cauda[0], cauda[1], cabeca[0], cabeca[1], "transparent", 16);
    return grupo("forcas", f.id, s);
  }

  function desenharMomento(g, q, col) {
    var x = g.X(q.x), y0 = g.y0, s = "";
    if (eSel("momentos", q.id)) s += realce(x - 24, y0 - 24, 48, 40);
    s += q.sentido === "horario" ? arco(x, y0, 16, 150, 410, COR.carga, 2) : arco(x, y0, 16, 30, -230, COR.carga, 2);
    var rot = fmt(q.M) + " kN·m", lx = x + 20, ly = y0 - 22;
    for (var t = 0; t < 4; t++) {
      var cx = caixaTexto(lx, ly, rot, 12, "start");
      if (col.livre(cx)) { col.por(cx); break; }
      ly -= 13;
    }
    s += texto(lx, ly, esc(rot), { tam: 12, cor: COR.carga, peso: 600, halo: true, ancora: "start" });
    s += '<circle cx="' + r1(x) + '" cy="' + y0 + '" r="21" fill="transparent"/>';
    return grupo("momentos", q.id, s);
  }

  // faixas: cargas distribuídas que se sobrepõem ficam umas por cima das outras
  function faixasDistribuidas(ds) {
    var ordem = ds.slice().sort(function (a, b) { return a.x1 - b.x1; }), fins = [], faixa = {};
    ordem.forEach(function (d) {
      var k = 0;
      while (k < fins.length && fins[k] > d.x1 + 1e-9) k++;
      fins[k] = d.x2;
      faixa[d.id] = k;
    });
    return { faixa: faixa, n: Math.max(1, fins.length) };
  }

  function desenharDistribuida(g, d, yb, hq, qmax, col) {
    var X = g.X, x1 = X(d.x1), x2 = X(d.x2), s = "";
    function q(x) { return d.x2 > d.x1 ? d.q1 + (d.q2 - d.q1) * (x - d.x1) / (d.x2 - d.x1) : d.q1; }
    function h(qq) { return qmax > 0 ? Math.abs(qq) / qmax * hq : 0; }
    var topo = yb - Math.max(h(d.q1), h(d.q2));
    if (eSel("distribuidas", d.id)) s += realce(x1 - 6, topo - 6, x2 - x1 + 12, yb - topo + 10);
    var pts = [r1(x1) + "," + r1(yb)];
    for (var i = 0; i <= 24; i++) {
      var xx = d.x1 + (d.x2 - d.x1) * i / 24;
      pts.push(r1(X(xx)) + "," + r1(yb - h(q(xx))));
    }
    pts.push(r1(x2) + "," + r1(yb));
    s += '<polygon points="' + pts.join(" ") + '" fill="' + COR.cargaClaro + '" stroke="' + COR.carga + '" stroke-width="1.3" stroke-linejoin="round"/>';
    var n = Math.max(2, Math.round((x2 - x1) / 24)) + 1;
    for (var k = 0; k < n; k++) {
      var xa = d.x1 + (d.x2 - d.x1) * k / (n - 1), qa = q(xa), ha = h(qa), px = X(xa);
      if (ha < 6) continue;
      s += qa > 0 ? seta(px, yb - ha, px, yb, COR.carga, 1.1) : seta(px, yb, px, yb - ha, COR.carga, 1.1);
    }
    // rótulos
    var rots = [];
    // sem sinal: o sentido lê-se nas setas
    if (Math.abs(d.q1 - d.q2) < 1e-9) rots.push({ x: (x1 + x2) / 2, y: yb - h(d.q1) - 5, t: fmt(Math.abs(d.q1)) + " kN/m", a: "middle" });
    else {
      if (Math.abs(d.q1) > 1e-9) rots.push({ x: x1, y: yb - h(d.q1) - 5, t: fmt(Math.abs(d.q1)) + " kN/m", a: "start" });
      if (Math.abs(d.q2) > 1e-9) rots.push({ x: x2, y: yb - h(d.q2) - 5, t: fmt(Math.abs(d.q2)) + " kN/m", a: "end" });
    }
    rots.forEach(function (rt) {
      for (var t = 0; t < 3; t++) {
        var cx = caixaTexto(rt.x, rt.y, rt.t, 11.5, rt.a);
        if (col.livre(cx)) { col.por(cx); break; }
        rt.y -= 12;
      }
      s += texto(rt.x, rt.y, esc(rt.t), { tam: 11.5, cor: COR.carga, peso: 600, halo: true, ancora: rt.a });
    });
    s += '<rect x="' + r1(x1) + '" y="' + r1(topo) + '" width="' + r1(Math.max(4, x2 - x1)) + '" height="' + r1(yb - topo + 2) + '" fill="transparent"/>';
    if (eSel("distribuidas", d.id)) {
      [[x1, "1"], [x2, "2"]].forEach(function (p) {
        s += '<rect data-ponta="' + p[1] + '" x="' + r1(p[0] - 5) + '" y="' + r1((topo + yb) / 2 - 9) + '" width="10" height="18" rx="2" fill="' +
          COR.dourado + '" stroke="' + COR.azul + '" stroke-width="1" style="cursor:ew-resize"/>';
      });
    }
    return grupo("distribuidas", d.id, s);
  }

  function posicoesCota(m) {
    var xs = [0, m.L];
    m.apoios.forEach(function (a) { xs.push(a.x); });
    m.rotulas.forEach(function (r) { xs.push(r.x); });
    m.forcas.forEach(function (f) { xs.push(f.x); });
    m.momentos.forEach(function (q) { xs.push(q.x); });
    m.distribuidas.forEach(function (d) { xs.push(d.x1, d.x2); });
    xs = xs.filter(function (x) { return x >= -1e-9 && x <= m.L + 1e-9; }).sort(function (a, b) { return a - b; });
    var out = [];
    xs.forEach(function (x) { if (!out.length || x - out[out.length - 1] > 1e-6) out.push(x); });
    return out;
  }

  function desenharModelo(g) {
    var m = est.modelo, s = [], y0 = g.y0, X = g.X, nomes = nomesApoios(), col = new Colocador();
    s.push('<rect x="0" y="0" width="' + g.W + '" height="' + g.hM + '" fill="#fff"/>');

    // régua em metros, no topo
    var passos = [0.25, 0.5, 1, 2, 5, 10, 20, 50], p = passos[passos.length - 1];
    for (var i = 0; i < passos.length; i++) if (passos[i] * g.sx >= 50) { p = passos[i]; break; }
    var casas = p < 0.5 ? 2 : p < 1 ? 1 : 0;
    for (var xr = 0; xr <= m.L + 1e-9; xr += p) {
      s.push(linha(X(xr), 18, X(xr), y0 - 8, "#F0F3F6", 1));
      s.push(texto(X(xr), 13, fmt(xr, casas), { tam: 10, cor: "#A3ADB8" }));
    }
    s.push(texto(g.ml - 22, 13, "x (m)", { tam: 10, cor: "#A3ADB8", ancora: "end" }));

    // cargas distribuídas
    var fx = faixasDistribuidas(m.distribuidas), qmax = 0;
    m.distribuidas.forEach(function (d) { qmax = Math.max(qmax, Math.abs(d.q1), Math.abs(d.q2)); });
    var livre = y0 - 32, hq = clamp((livre - 18 * fx.n) / fx.n, 12, 44);
    m.distribuidas.forEach(function (d) {
      var yb = y0 - 4 - fx.faixa[d.id] * (hq + 18);
      s.push(desenharDistribuida(g, d, yb, hq, qmax, col));
    });
    if (est.previa) {
      var a = X(Math.min(est.previa.x1, est.previa.x2)), b = X(Math.max(est.previa.x1, est.previa.x2));
      s.push('<rect x="' + r1(a) + '" y="' + r1(y0 - 4 - hq) + '" width="' + r1(Math.max(2, b - a)) + '" height="' + r1(hq) +
        '" fill="' + COR.cargaClaro + '" fill-opacity="0.7" stroke="' + COR.carga + '" stroke-dasharray="5 3"/>');
    }

    // viga
    s.push(linha(X(0), y0, X(m.L), y0, COR.azul, 5));

    // cotas
    var yc = y0 + 127, pc = posicoesCota(m);
    s.push(linha(X(0), yc, X(m.L), yc, COR.cinza, 1));
    pc.forEach(function (x) { s.push(linha(X(x) - 4, yc + 4, X(x) + 4, yc - 4, COR.cinza, 1.2)); s.push(linha(X(x), yc - 7, X(x), yc + 7, COR.cinza, 0.8)); });
    for (var k = 0; k < pc.length - 1; k++) {
      var wseg = (pc[k + 1] - pc[k]) * g.sx;
      if (wseg >= 34) s.push(texto(X((pc[k] + pc[k + 1]) / 2), yc - 5, fmt(pc[k + 1] - pc[k]), { tam: 11, cor: COR.cinza }));
    }
    s.push(texto(g.ml - 12, yc + 4, "cotas (m)", { tam: 10, cor: "#A3ADB8", ancora: "end" }));

    // apoios, reações, rótulas
    var blocos = [];
    m.apoios.forEach(function (a) { s.push(desenharApoio(g, a, nomes[a.id] || "?")); });
    m.rotulas.forEach(function (rt) { s.push(desenharRotula(g, rt)); });
    m.apoios.forEach(function (a) {
      var R = reacaoDoApoio(a.id);
      if (R) s.push(desenharReacao(g, a, R, nomes[a.id] || "?", blocos));
    });
    s.push(colocarBlocos(g, blocos));

    // forças e momentos por cima de tudo
    m.momentos.forEach(function (q) { s.push(desenharMomento(g, q, col)); });
    m.forcas.forEach(function (f) { s.push(desenharForca(g, f, col)); });
    return s.join("");
  }

  // ------------------------------------------------------------ diagramas

  function regioes(pts, k, tolv) {
    var regs = [], cur = null, xZero = null;
    function sg(v) { return v > tolv ? 1 : v < -tolv ? -1 : 0; }
    function fecha(x) { if (cur) { cur.pts.push([x, 0]); regs.push(cur); cur = null; } }
    for (var i = 0; i < pts.length; i++) {
      var x = pts[i].x, v = pts[i][k], s1 = sg(v);
      if (cur && s1 !== 0 && s1 !== cur.s) {
        var ant = cur.pts[cur.pts.length - 1];
        var xc = Math.abs(ant[0] - x) < 1e-12 ? x : ant[0] + (x - ant[0]) * (ant[1] / (ant[1] - v));
        fecha(xc);
        cur = { s: s1, pts: [[xc, 0]] };
      }
      if (s1 === 0) { fecha(x); xZero = x; continue; }
      // a região começa no último ponto em que o diagrama passou por zero
      if (!cur) cur = { s: s1, pts: [[xZero !== null ? xZero : x, 0]] };
      xZero = null;
      cur.pts.push([x, v]);
    }
    if (pts.length) fecha(pts[pts.length - 1].x);
    return regs;
  }

  // sentidos positivos de N, V ou M nas duas faces de um troço, como na figura da sebenta (§3)
  function pictogramaSeccao(k, cx, cy) {
    var az = COR.azul, s = '<g><title>Sentidos positivos de ' + k + " (convenção da secção)</title>";
    s += '<rect x="' + r1(cx - 4) + '" y="' + r1(cy - 6) + '" width="8" height="12" fill="#DCE4EC" stroke="' + az + '" stroke-width="1"/>';
    if (k === "N") s += seta(cx - 6, cy, cx - 20, cy, az, 1.5) + seta(cx + 6, cy, cx + 20, cy, az, 1.5);
    else if (k === "V") s += seta(cx - 10, cy + 8, cx - 10, cy - 8, az, 1.5) + seta(cx + 10, cy - 8, cx + 10, cy + 8, az, 1.5);
    else s += arco(cx - 15, cy, 8, 160, 340, az, 1.5, 5) + arco(cx + 15, cy, 8, 20, -160, az, 1.5, 5);
    return s + "</g>";
  }

  // os três sentidos positivos numa linha, por cima do quadro de esforços
  function legendaSeccao() {
    var s = '<svg width="330" height="30" viewBox="0 0 330 30" font-family="' + FONTE + '">';
    ["N", "V", "M"].forEach(function (k, i) {
      var ox = 6 + i * 110;
      s += texto(ox, 20, k, { tam: 14, peso: 700, cor: COR.azul, ancora: "start" });
      s += pictogramaSeccao(k, ox + 44, 15);
    });
    return s + "</svg>";
  }

  function desenharPainel(g, p, res) {
    var s = [], top = p.top, h = p.h, yb = top + h / 2, X = g.X, k = p.k, m = est.modelo;
    s.push('<rect x="0" y="' + top + '" width="' + g.W + '" height="' + h + '" fill="#fff"/>');
    s.push(linha(0, top + 0.5, g.W, top + 0.5, "#DDE3E9", 1));
    s.push(pictogramaSeccao(k, 46, yb - 28));
    s.push(texto(16, yb + 2, p.nome, { tam: 22, peso: 700, cor: COR.azul, ancora: "start" }));
    s.push(texto(16, yb + 18, esc(p.unidade), { tam: 11, cor: COR.cinza, ancora: "start" }));
    if (p.nota) s.push(texto(16, yb + 32, esc(p.nota), { tam: 10, cor: COR.cinza, ancora: "start" }));
    // guias nos apoios e nas rótulas
    m.apoios.forEach(function (a) { s.push(linha(X(a.x), top + 6, X(a.x), top + h - 6, COR.guia, 1, ' stroke-dasharray="3 3"')); });
    m.rotulas.forEach(function (rt) { s.push(linha(X(rt.x), top + 6, X(rt.x), top + h - 6, COR.guia, 1, ' stroke-dasharray="3 3"')); });

    var temDiagrama = res && res.diagrama && res.diagrama.length;
    if (!temDiagrama) {
      s.push(linha(X(0), yb, X(m.L), yb, "#C3CCD5", 1.2));
      return s.join("");
    }
    var pts = res.diagrama, vmax = 0;
    pts.forEach(function (q) { vmax = Math.max(vmax, Math.abs(q[k])); });
    if (vmax < 0.005) {
      s.push(linha(X(0), yb, X(m.L), yb, COR.azul, 1.6));
      s.push(texto(X(m.L / 2), yb - 8, esc(p.nome + " = 0 em toda a viga"), { tam: 12, cor: COR.cinza, estilo: "italic" }));
      return s.join("");
    }
    var escala = (h / 2 - 22) / vmax;
    function Y(v) { return k === "M" ? yb + v * escala : yb - v * escala; }
    var regs = regioes(pts, k, vmax * 1e-9);
    regs.forEach(function (rg) {
      var cheio = k === "N" ? (rg.s > 0 ? COR.tracaoClaro : COR.compressaoClaro) : COR.preenche;
      var traco = k === "N" ? (rg.s > 0 ? COR.tracao : COR.compressao) : COR.azul;
      var pp = rg.pts.map(function (q) { return r1(X(q[0])) + "," + r1(Y(q[1])); }).join(" ");
      s.push('<polygon points="' + pp + '" fill="' + cheio + '"/>');
      s.push('<polyline points="' + pp + '" fill="none" stroke="' + traco + '" stroke-width="2" stroke-linejoin="round"/>');
    });
    s.push(linha(X(0), yb, X(m.L), yb, COR.azul, 1.4));

    var col = new Colocador();
    // sinais: no centroide de cada região, se houver espaço
    regs.forEach(function (rg) {
      var A = 0, Ax = 0;
      for (var i = 1; i < rg.pts.length; i++) {
        var a = rg.pts[i - 1], b = rg.pts[i], dx = b[0] - a[0], va = Math.abs(a[1]), vb = Math.abs(b[1]);
        A += (va + vb) / 2 * dx;
        Ax += (va + vb) / 2 * dx * (a[0] + b[0]) / 2;
      }
      if (A <= 0) return;
      var xc = Ax / A, x0 = rg.pts[0][0], x1 = rg.pts[rg.pts.length - 1][0];
      if ((x1 - x0) * g.sx < 26) return;
      var vc = 0;
      for (var j = 1; j < rg.pts.length; j++) {
        var p0 = rg.pts[j - 1], p1 = rg.pts[j];
        if (p0[0] <= xc && p1[0] >= xc && p1[0] > p0[0]) { vc = p0[1] + (p1[1] - p0[1]) * (xc - p0[0]) / (p1[0] - p0[0]); break; }
      }
      if (Math.abs(vc) * escala < 22) return;
      var cx = X(xc), cy = (yb + Y(vc)) / 2;
      var corS = k === "N" ? (rg.s > 0 ? COR.tracao : COR.compressao) : COR.azul;
      s.push('<circle cx="' + r1(cx) + '" cy="' + r1(cy) + '" r="8.5" fill="#fff" stroke="' + corS + '" stroke-width="1.4"/>');
      s.push(texto(cx, cy + 4.6, rg.s > 0 ? "+" : "−", { tam: 14, peso: 700, cor: corS }));
      col.por({ x: cx - 10, y: cy - 10, w: 20, h: 20 });
    });

    // valores nos pontos notáveis e nos extremos
    if (est.valores) {
      var cands = [], tolv = 0.005, L = m.L;
      var mx = res.maximos || {}, gmax = mx[k + "max"], gmin = mx[k + "min"];
      function prio(x, v) {
        if (gmax && Math.abs(x - gmax.x) < 1e-6 && Math.abs(v - gmax.valor) < 1e-6) return 5;
        if (gmin && Math.abs(x - gmin.x) < 1e-6 && Math.abs(v - gmin.valor) < 1e-6) return 5;
        return 1;
      }
      res.pontos.forEach(function (pt) {
        var ve = pt.esq[k], vd = pt.dir[k];
        if (pt.x > 1e-9 && pt.x < L - 1e-9 && Math.abs(ve - vd) > tolv) {
          if (Math.abs(ve) >= tolv) cands.push({ x: pt.x, v: ve, lado: "esq", p: prio(pt.x, ve) + 1 });
          if (Math.abs(vd) >= tolv) cands.push({ x: pt.x, v: vd, lado: "dir", p: prio(pt.x, vd) + 1 });
        } else {
          var v = pt.x >= L - 1e-9 ? ve : vd;
          if (Math.abs(v) >= tolv) cands.push({ x: pt.x, v: v, lado: pt.x <= 1e-9 ? "dir" : pt.x >= L - 1e-9 ? "esq" : "meio", p: prio(pt.x, v) + (pt.nome ? 1 : 0) });
        }
      });
      if (k === "M") (res.extremos || []).forEach(function (e) { if (Math.abs(e.M) >= tolv) cands.push({ x: e.x, v: e.M, lado: "meio", p: prio(e.x, e.M) + 3 }); });
      cands.sort(function (a, b) { return b.p - a.p; });
      cands.forEach(function (c) {
        var px = X(c.x), py = Y(c.v), acima = py < yb, t = fmt(c.v), tam = 11.5;
        var ancora = c.lado === "esq" ? "end" : c.lado === "dir" ? "start" : "middle";
        var lx = px + (c.lado === "esq" ? -4 : c.lado === "dir" ? 4 : 0);
        var ly = acima ? py - 6 : py + 15;
        for (var t2 = 0; t2 < 3; t2++) {
          var yy = clamp(ly + (acima ? -13 : 13) * t2, top + 13, top + h - 4);
          var cx = caixaTexto(lx, yy, t, tam, ancora);
          if (col.livre(cx)) {
            col.por(cx);
            s.push(texto(lx, yy, esc(t), { tam: tam, peso: c.p >= 5 ? 700 : 500, halo: true, ancora: ancora }));
            break;
          }
        }
      });
    }
    return s.join("");
  }

  // secção fixada: linha a dourado e os valores
  function desenharSeccao(g, res) {
    if (est.seccao === null || !res || !res.esforcos) return "";
    var x = est.seccao, px = g.X(x), s = ['<g style="pointer-events:none">'];
    s.push(linha(px, 20, px, g.H - 4, COR.dourado, 2, ' stroke-dasharray="6 4"'));
    var e = res.esforcos(x, "esq"), d = res.esforcos(x, "dir");
    var tx = "x = " + fmt(x) + " m", tw = larguraTexto(tx, 12) + 8, tl = clamp(px - tw / 2, 4, g.W - 4 - tw);
    s.push('<rect x="' + r1(tl) + '" y="20" width="' + r1(tw) + '" height="18" rx="4" fill="#FFF6D6" stroke="' + COR.dourado + '"/>');
    s.push(texto(tl + tw / 2, 33, esc(tx), { tam: 12, peso: 700, cor: "#5C4100" }));
    g.paineis.forEach(function (p) {
      var vmax = 0;
      res.diagrama.forEach(function (q) { vmax = Math.max(vmax, Math.abs(q[p.k])); });
      if (vmax < 0.005) return;
      var escala = (p.h / 2 - 22) / vmax, yb = p.top + p.h / 2;
      function Y(v) { return p.k === "M" ? yb + v * escala : yb - v * escala; }
      var ve = e[p.k], vd = d[p.k], salto = Math.abs(ve - vd) >= 0.005;
      var t = salto ? fmt(ve) + " | " + fmt(vd) : fmt(vd);
      s.push('<circle cx="' + r1(px) + '" cy="' + r1(Y(vd)) + '" r="4" fill="' + COR.dourado + '" stroke="' + COR.azul + '" stroke-width="1"/>');
      if (salto) s.push('<circle cx="' + r1(px) + '" cy="' + r1(Y(ve)) + '" r="4" fill="' + COR.dourado + '" stroke="' + COR.azul + '" stroke-width="1"/>');
      var w = larguraTexto(t, 12) + 8, lx = px + 8 + w > g.W - 4 ? px - 8 - w : px + 8, ly = p.top + 8;
      s.push('<rect x="' + r1(lx) + '" y="' + r1(ly) + '" width="' + r1(w) + '" height="18" rx="4" fill="#FFF6D6" stroke="' + COR.dourado + '"/>');
      s.push(texto(lx + w / 2, ly + 13, esc(t), { tam: 12, peso: 700, cor: "#5C4100" }));
    });
    s.push("</g>");
    return s.join("");
  }

  function construirSvg(g, res, paraExportar) {
    var s = [];
    s.push('<svg xmlns="http://www.w3.org/2000/svg" width="' + g.W + '" height="' + g.H + '" viewBox="0 0 ' + g.W + " " + g.H +
      '" font-family="' + FONTE + '">');
    s.push('<rect width="100%" height="100%" fill="#fff"/>');
    s.push(desenharModelo(g));
    g.paineis.forEach(function (p) { s.push(desenharPainel(g, p, res)); });
    if (!res || !res.diagrama) {
      var msg = !res || res.erros.length ? "Corrija os dados da viga." :
        res.classificacao.tipo === "hipostatica" ? "Viga hipostática: não há diagramas." : "";
      if (!est.modelo.apoios.length) msg = "Ponha os apoios: escolha um tipo de apoio na barra e clique na viga.";
      if (msg) s.push(texto(g.X(g.L / 2), g.hM + g.hD * 1.5, esc(msg), { tam: 14, cor: COR.carga, peso: 600, halo: true }));
    }
    s.push(desenharSeccao(g, res));
    if (!paraExportar) {
      s.push('<g id="cursor" style="display:none;pointer-events:none">' + linha(0, 20, 0, g.H - 4, COR.cinza, 1, ' stroke-dasharray="4 3" id="cur-linha"'));
      g.paineis.forEach(function (p) {
        s.push('<circle id="cur-p-' + p.k + '" r="3.5" fill="' + COR.azul + '"/>');
        s.push('<text id="cur-t-' + p.k + '" font-size="11.5" font-weight="600" fill="' + COR.azul +
          '" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round"></text>');
      });
      s.push("</g>");
    }
    s.push("</svg>");
    return s.join("");
  }

  function desenhar() {
    est.geo = geometria();
    $("area-desenho").innerHTML = construirSvg(est.geo, est.res, false);
  }

  // ------------------------------------------------------------ cursor e estado

  function dica() {
    return {
      selecionar: "Arraste um elemento ao longo da viga. <b>Duplo clique</b> edita, <b>botão direito</b> apaga. Clique num diagrama para fixar uma secção.",
      movel: "Clique na viga para pôr um apoio móvel. Sobre um apoio existente, troca-lhe o tipo.",
      fixo: "Clique na viga para pôr um apoio fixo. Sobre um apoio existente, troca-lhe o tipo.",
      encastramento: "Clique na viga para pôr um encastramento. Sobre um apoio existente, troca-lhe o tipo.",
      rotula: "Clique no interior da viga para pôr uma rótula.",
      forca: "Clique na viga no ponto onde atua a força.",
      momento: "Clique na viga no ponto onde atua o momento.",
      distribuida: "Clique no início da carga e arraste até ao fim, ou clique uma vez e escreva as posições."
    }[est.ferramenta];
  }

  function mostrarEstado(html) { $("estado").innerHTML = html; }

  function aviso(texto) {
    mostrarEstado('<span style="color:' + COR.carga + ';font-weight:600">' + esc(texto) + "</span>");
    est.avisoAte = Date.now() + 4500;
    clearTimeout(est.temporizador);
    est.temporizador = setTimeout(function () { mostrarEstado(dica()); }, 4500);
  }

  function esconderCursor() {
    var c = document.getElementById("cursor");
    if (c) c.style.display = "none";
    if (!(Date.now() < (est.avisoAte || 0))) mostrarEstado(dica());
  }

  function moverCursor(x) {
    var g = est.geo, res = est.res, c = document.getElementById("cursor");
    if (!c || !g) return;
    if (x < 0 || x > g.L) { c.style.display = "none"; return; }
    var px = g.X(x);
    c.style.display = "";
    var ln = document.getElementById("cur-linha");
    ln.setAttribute("x1", r1(px)); ln.setAttribute("x2", r1(px));
    if (!res || !res.esforcos) {
      g.paineis.forEach(function (p) {
        document.getElementById("cur-p-" + p.k).setAttribute("cx", -100);
        document.getElementById("cur-t-" + p.k).textContent = "";
      });
      mostrarEstado("x = <b>" + fmt(x) + " m</b>");
      return;
    }
    var v = res.esforcos(x);
    g.paineis.forEach(function (p) {
      var vmax = 0;
      res.diagrama.forEach(function (q) { vmax = Math.max(vmax, Math.abs(q[p.k])); });
      var escala = vmax < 0.005 ? 0 : (p.h / 2 - 22) / vmax, yb = p.top + p.h / 2;
      var y = p.k === "M" ? yb + v[p.k] * escala : yb - v[p.k] * escala;
      var pt = document.getElementById("cur-p-" + p.k), tx = document.getElementById("cur-t-" + p.k);
      pt.setAttribute("cx", r1(px)); pt.setAttribute("cy", r1(y));
      var dir = px < g.W - 110;
      tx.setAttribute("x", r1(px + (dir ? 7 : -7))); tx.setAttribute("y", r1(clamp(y - 7, p.top + 14, p.top + p.h - 4)));
      tx.setAttribute("text-anchor", dir ? "start" : "end");
      tx.textContent = fmt(v[p.k]);
    });
    mostrarEstado("x = <b>" + fmt(x) + " m</b> &nbsp;·&nbsp; N = <b>" + fmt(v.N) + " kN</b> &nbsp;·&nbsp; V = <b>" + fmt(v.V) +
      " kN</b> &nbsp;·&nbsp; M = <b>" + fmt(v.M) + " kN·m</b>");
  }

  // ------------------------------------------------------------ posições

  function posicoesExistentes(ignorar) {
    var m = est.modelo, xs = [0, m.L];
    TIPOS.forEach(function (k) {
      m[k].forEach(function (e) {
        if (ignorar && ignorar.k === k && ignorar.id === e.id) return;
        if (e.x !== undefined) xs.push(e.x); else { xs.push(e.x1, e.x2); }
      });
    });
    return xs;
  }

  function ajustar(xm, ignorar) {
    var L = est.modelo.L, g = est.geo, tolm = 7 / g.sx, melhor = null;
    posicoesExistentes(ignorar).forEach(function (p) {
      var d = Math.abs(p - xm);
      if (d <= tolm && (melhor === null || d < Math.abs(melhor - xm))) melhor = p;
    });
    if (melhor !== null) return clamp(melhor, 0, L);
    var passo = est.grelha > 0 ? est.grelha : 0.01;
    return arred(clamp(Math.round(xm / passo) * passo, 0, L));
  }

  function pontoNoSvg(ev) {
    var svg = $("area-desenho").querySelector("svg");
    var rc = svg.getBoundingClientRect(), k = est.geo.W / rc.width;
    return { x: (ev.clientX - rc.left) * k, y: (ev.clientY - rc.top) * k };
  }

  // ------------------------------------------------------------ interação no desenho

  function alvoDe(ev) {
    var t = ev.target;
    while (t && t !== document && !(t.getAttribute && t.getAttribute("data-k"))) {
      if (t.id === "area-desenho") return null;
      t = t.parentNode;
    }
    if (!t || t === document) return null;
    var ponta = ev.target.getAttribute && ev.target.getAttribute("data-ponta");
    return { k: t.getAttribute("data-k"), id: +t.getAttribute("data-id"), ponta: ponta };
  }

  function fixarSeccao(xm) {
    var g = est.geo, L = est.modelo.L;
    if (xm < -0.02 * L || xm > 1.02 * L) return;
    var x = ajustar(clamp(xm, 0, L));
    if (est.seccao !== null && Math.abs((est.seccao - x) * g.sx) < 4) est.seccao = null;
    else est.seccao = x;
    var inp = $("seccao-x");
    if (inp) inp.value = est.seccao === null ? "" : fmt(est.seccao);
    desenhar();
    atualizarSeccao();
  }

  function aoPremir(ev) {
    if (est.dialogo || !est.geo || (ev.button !== undefined && ev.button !== 0)) return;
    var p = pontoNoSvg(ev), g = est.geo, L = est.modelo.L, xm = g.xDe(p.x);
    var alvo = alvoDe(ev), f = est.ferramenta;
    if (p.y > g.hM) { fixarSeccao(xm); return; }
    if (f === "selecionar") {
      if (alvo) {
        // duplo clique (ou toque duplo) no mesmo elemento: editar
        var agora = Date.now(), u = est.ultimoToque;
        if (u && u.k === alvo.k && u.id === alvo.id && agora - u.t < 450 && Math.hypot(p.x - u.x, p.y - u.y) < 8) {
          est.ultimoToque = null;
          editar(alvo.k, alvo.id);
          return;
        }
        est.ultimoToque = { k: alvo.k, id: alvo.id, t: agora, x: p.x, y: p.y };
        var e = acharElemento(alvo.k, alvo.id);
        est.sel = { k: alvo.k, id: alvo.id };
        est.arrasto = { modo: "mover", k: alvo.k, id: alvo.id, ponta: alvo.ponta, xm0: xm, orig: JSON.parse(JSON.stringify(e)),
                        antes: JSON.stringify(est.modelo), moveu: false };
        try { $("area-desenho").setPointerCapture(ev.pointerId); } catch (er) { /* */ }
        desenhar(); painel();
        ev.preventDefault();
      } else if (est.sel) { est.sel = null; desenhar(); painel(); }
      return;
    }
    if (xm < -0.03 * L || xm > 1.03 * L) return;
    var x = ajustar(clamp(xm, 0, L));
    ev.preventDefault();
    if (f === "movel" || f === "fixo" || f === "encastramento") { colocarApoio(f, x); return; }
    if (f === "rotula") { colocarRotula(x); return; }
    if (f === "forca") { dialogoForca(null, x); return; }
    if (f === "momento") { dialogoMomento(null, x); return; }
    if (f === "distribuida") {
      est.arrasto = { modo: "nova", x1: x };
      est.previa = { x1: x, x2: x };
      try { $("area-desenho").setPointerCapture(ev.pointerId); } catch (er) { /* */ }
      desenhar();
    }
  }

  function aoMover(ev) {
    if (!est.geo || est.dialogo) return;
    var p = pontoNoSvg(ev), g = est.geo, L = est.modelo.L, xm = g.xDe(p.x), a = est.arrasto;
    if (a && a.modo === "nova") {
      est.previa.x2 = ajustar(clamp(xm, 0, L));
      desenhar();
      mostrarEstado("Carga de <b>" + fmt(Math.min(est.previa.x1, est.previa.x2)) + "</b> a <b>" + fmt(Math.max(est.previa.x1, est.previa.x2)) + " m</b>");
      return;
    }
    if (a && a.modo === "mover") {
      var dx = xm - a.xm0;
      if (!a.moveu && Math.abs(dx * g.sx) < 3) return;
      a.moveu = true;
      var e = acharElemento(a.k, a.id), o = a.orig, ign = { k: a.k, id: a.id };
      if (!e) return;
      if (a.k === "distribuidas") {
        var passo = est.grelha > 0 ? est.grelha : 0.01;
        if (a.ponta === "1") e.x1 = Math.min(ajustar(clamp(o.x1 + dx, 0, L), ign), arred(e.x2 - passo));
        else if (a.ponta === "2") e.x2 = Math.max(ajustar(clamp(o.x2 + dx, 0, L), ign), arred(e.x1 + passo));
        else {
          var comp = o.x2 - o.x1, nx = ajustar(clamp(o.x1 + dx, 0, L - comp), ign);
          nx = clamp(nx, 0, L - comp);
          e.x1 = arred(nx); e.x2 = arred(nx + comp);
        }
        mostrarEstado("Carga de <b>" + fmt(e.x1) + "</b> a <b>" + fmt(e.x2) + " m</b>");
      } else {
        e.x = ajustar(clamp(o.x + dx, 0, L), ign);
        mostrarEstado("x = <b>" + fmt(e.x) + " m</b>");
      }
      recalcular();
      return;
    }
    if (p.y >= 0 && p.y <= g.H) moverCursor(xm); else esconderCursor();
  }

  function aoLargar(ev) {
    var a = est.arrasto;
    if (!a) return;
    est.arrasto = null;
    try { $("area-desenho").releasePointerCapture(ev.pointerId); } catch (er) { /* */ }
    if (a.modo === "nova") {
      var x1 = Math.min(est.previa.x1, est.previa.x2), x2 = Math.max(est.previa.x1, est.previa.x2);
      est.previa = null;
      if (x2 - x1 < 1e-6) {
        var L = est.modelo.L, passo = est.grelha > 0 ? est.grelha : 0.01;
        x2 = arred(Math.min(L, x1 + Math.max(passo, Math.round(L / 4 / passo) * passo)));
        if (x2 - x1 < 1e-6) { x1 = arred(Math.max(0, x2 - Math.max(passo, L / 4))); }
      }
      desenhar();
      dialogoDistribuida(null, x1, x2);
      return;
    }
    if (a.modo === "mover" && a.moveu) {
      var res = S.resolver(est.modelo);
      if (res.erros.length) {
        est.modelo = JSON.parse(a.antes);
        aviso("Não pode ficar aí: " + res.erros[0]);
      } else {
        est.hist.push(a.antes);
        est.fut = [];
        mostrarEstado(dica());
      }
      atualizar();
    }
  }

  function aoMenuContexto(ev) {
    var alvo = alvoDe(ev);
    if (!alvo) return;
    ev.preventDefault();
    apagar(alvo.k, alvo.id);
  }

  // ------------------------------------------------------------ operações sobre elementos

  function colocarApoio(tipo, x) {
    var m = est.modelo, existente = null;
    m.apoios.forEach(function (a) { if (Math.abs(a.x - x) < 1e-9) existente = a; });
    if (existente && existente.tipo === tipo) { est.sel = { k: "apoios", id: existente.id }; desenhar(); painel(); return; }
    alterar(function (mm) {
      if (existente) { existente.tipo = tipo; existente.angulo = 0; est.sel = { k: "apoios", id: existente.id }; }
      else {
        var id = est.proximoId++;
        mm.apoios.push({ id: id, x: x, tipo: tipo, angulo: 0 });
        est.sel = { k: "apoios", id: id };
      }
    });
  }

  function colocarRotula(x) {
    var m = est.modelo;
    if (x <= 1e-9 || x >= m.L - 1e-9) { aviso("Uma rótula tem de ficar no interior da viga."); return; }
    if (m.rotulas.some(function (r) { return Math.abs(r.x - x) < 1e-9; })) { aviso("Já há uma rótula nesse ponto."); return; }
    alterar(function (mm) { var id = est.proximoId++; mm.rotulas.push({ id: id, x: x }); est.sel = { k: "rotulas", id: id }; });
  }

  function apagar(k, id) {
    if (est.sel && est.sel.k === k && est.sel.id === id) est.sel = null;
    alterar(function (m) { m[k] = m[k].filter(function (e) { return e.id !== id; }); });
  }

  function editar(k, id) {
    var e = acharElemento(k, id);
    if (!e) return;
    est.sel = { k: k, id: id };
    desenhar(); painel();
    if (k === "apoios") dialogoApoio(e);
    else if (k === "rotulas") dialogoRotula(e);
    else if (k === "forcas") dialogoForca(e);
    else if (k === "momentos") dialogoMomento(e);
    else dialogoDistribuida(e);
  }

  function acrescentar(k) {
    var L = est.modelo.L, x = arred(Math.round(L / 2 / 0.05) * 0.05);
    if (k === "apoios") dialogoApoio(null, x);
    else if (k === "rotulas") dialogoRotula(null, x);
    else if (k === "forcas") dialogoForca(null, x);
    else if (k === "momentos") dialogoMomento(null, x);
    else dialogoDistribuida(null, 0, L);
  }

  function moverSelecionado(sinal) {
    var s = est.sel;
    if (!s) return;
    var e = acharElemento(s.k, s.id), L = est.modelo.L, passo = est.grelha > 0 ? est.grelha : 0.01;
    if (!e) return;
    var antes = JSON.stringify(est.modelo);
    if (s.k === "distribuidas") {
      var comp = e.x2 - e.x1, nx = arred(clamp(e.x1 + sinal * passo, 0, L - comp));
      e.x1 = nx; e.x2 = arred(nx + comp);
    } else e.x = arred(clamp(e.x + sinal * passo, 0, L));
    if (S.resolver(est.modelo).erros.length) { est.modelo = JSON.parse(antes); return; }
    est.hist.push(antes); est.fut = [];
    atualizar();
  }

  function mudarComprimento(texto) {
    var L = lerNum(texto), m = est.modelo;
    if (!(L > 0) || L > 1000) { aviso("O comprimento tem de ser um número positivo."); $("comprimento").value = fmt(m.L); return; }
    L = arred(L);
    if (Math.abs(L - m.L) < 1e-9) { $("comprimento").value = fmt(m.L); return; }
    var antes = 0;
    TIPOS.forEach(function (k) { antes += m[k].length; });
    alterar(function (mm) {
      // o que estava na extremidade direita acompanha-a
      var Lv = mm.L;
      function fim(x) { return Math.abs(x - Lv) < 1e-9 ? L : x; }
      mm.apoios.forEach(function (a) { a.x = fim(a.x); });
      mm.forcas.forEach(function (f) { f.x = fim(f.x); });
