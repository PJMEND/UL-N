  // direção (no ecrã) para onde se desenham os valores positivos de um diagrama numa barra
  function ladoPositivo(b, k) { return k === "M" ? { x: b.s, y: b.c } : { x: -b.s, y: -b.c }; }

  function escalaDiagrama(g, res, k) {
    var vmax = 0;
    res.barras.forEach(function (b) { b.diagrama.forEach(function (p) { vmax = Math.max(vmax, Math.abs(p[k])); }); });
    var maxOff = clamp(0.16 * g.k * res.comprimento, 34, 88);
    return { vmax: vmax, sc: vmax > 0 ? maxOff / vmax : 0 };
  }

  function legendaVista(k, inclinadas) {
    var nota = k === "N" ? "tração +" : k === "M" ? "do lado tracionado" : "convenção da secção";
    var w = Math.max(116 + larguraTexto(nota, 11), inclinadas ? 60 + larguraTexto("fibra inferior de cada barra", 11) : 0);
    var s = '<g style="pointer-events:none"><rect x="8" y="8" width="' + r1(w) + '" height="' + (inclinadas ? 74 : 56) +
      '" rx="6" fill="#fff" fill-opacity="0.92" stroke="#DDE3E9"/>';
    s += texto(18, 36, k, { tam: 22, peso: 700, cor: COR.azul, ancora: "start" });
    s += texto(18, 52, esc(UNIDADE[k]), { tam: 11, cor: COR.cinza, ancora: "start" });
    s += pictogramaSeccao(k, 84, 30);
    s += texto(112, 34, esc(nota), { tam: 11, cor: COR.cinza, ancora: "start" });
    if (inclinadas) {
      s += linha(18, 70, 46, 70, COR.cinza, 1.2, ' stroke-dasharray="4 3"');
      s += texto(52, 74, "fibra inferior de cada barra", { tam: 11, cor: COR.cinza, ancora: "start" });
    }
    return s + "</g>";
  }

  function desenharDiagrama(g, res, k) {
    var s = [], col = new Colocador(), m = est.modelo;
    var temInclinadas = res && res.barras && res.barras.some(function (b) { return Math.abs(b.s) > 1e-9; });
    if (!res || !res.barras) {
      s.push(desenharBarras(g, COR.cinza, 2, false));
      s.push(desenharNos(g, false));
      return s.join("");
    }
    var e = escalaDiagrama(g, res, k);
    var polys = [], eixos = [], sinais = [], cands = [];
    var gmax = res.maximos[k + "max"], gmin = res.maximos[k + "min"];
    function prio(bid, sv, v) {
      if (gmax && gmax.barra === bid && Math.abs(sv - gmax.s) < 1e-6 && Math.abs(v - gmax.valor) < 1e-6) return 5;
      if (gmin && gmin.barra === bid && Math.abs(sv - gmin.s) < 1e-6 && Math.abs(v - gmin.valor) < 1e-6) return 5;
      return 1;
    }
    res.barras.forEach(function (b) {
      var n = ladoPositivo(b, k), dir = { x: b.c, y: -b.s };
      function P(sv) { return { x: g.X(b.xi + b.c * sv), y: g.Y(b.yi + b.s * sv) }; }
      function Q(sv, v) { var p = P(sv); return { x: p.x + n.x * v * e.sc, y: p.y + n.y * v * e.sc }; }
      eixos.push(linha(P(0).x, P(0).y, P(b.L).x, P(b.L).y, COR.azul, 1.8, ' stroke-linecap="round"'));
      if (k !== "N" && temInclinadas) {
        // a fibra inferior fica do lado −y local, que no ecrã é (sen, cos)
        var f0 = P(0), f1 = P(b.L);
        eixos.push(linha(f0.x + b.s * 5, f0.y + b.c * 5, f1.x + b.s * 5, f1.y + b.c * 5, COR.cinza, 1, ' stroke-dasharray="4 3"'));
      }
      if (e.vmax < 0.005) return;
      var regs = regioes(b.diagrama, k, e.vmax * 1e-9);
      regs.forEach(function (rg) {
        var cheio = k === "N" ? (rg.s > 0 ? COR.tracaoClaro : COR.compressaoClaro) : COR.preenche;
        var traco = k === "N" ? (rg.s > 0 ? COR.tracao : COR.compressao) : COR.azul;
        var pp = rg.pts.map(function (q) { var z = Q(q[0], q[1]); return r1(z.x) + "," + r1(z.y); }).join(" ");
        polys.push('<polygon points="' + pp + '" fill="' + cheio + '" fill-opacity="0.85"/>');
        polys.push('<polyline points="' + pp + '" fill="none" stroke="' + traco + '" stroke-width="2" stroke-linejoin="round"/>');
        // sinal no centroide da região, se houver espaço
        var A = 0, As = 0;
        for (var i = 1; i < rg.pts.length; i++) {
          var a = rg.pts[i - 1], c = rg.pts[i], ds = c[0] - a[0], va = Math.abs(a[1]), vc = Math.abs(c[1]);
          A += (va + vc) / 2 * ds; As += (va + vc) / 2 * ds * (a[0] + c[0]) / 2;
        }
        if (A <= 0) return;
        var sc = As / A, s0 = rg.pts[0][0], s1 = rg.pts[rg.pts.length - 1][0];
        if ((s1 - s0) * g.k < 26) return;
        var vcen = 0;
        for (var j = 1; j < rg.pts.length; j++) {
          var p0 = rg.pts[j - 1], p1 = rg.pts[j];
          if (p0[0] <= sc && p1[0] >= sc && p1[0] > p0[0]) { vcen = p0[1] + (p1[1] - p0[1]) * (sc - p0[0]) / (p1[0] - p0[0]); break; }
        }
        if (Math.abs(vcen) * e.sc < 22) return;
        var cq = Q(sc, vcen / 2);
        var corS = k === "N" ? (rg.s > 0 ? COR.tracao : COR.compressao) : COR.azul;
        sinais.push('<circle cx="' + r1(cq.x) + '" cy="' + r1(cq.y) + '" r="8.5" fill="#fff" stroke="' + corS + '" stroke-width="1.4"/>' +
          texto(cq.x, cq.y + 4.6, rg.s > 0 ? "+" : "−", { tam: 14, peso: 700, cor: corS }));
        col.por({ x: cq.x - 10, y: cq.y - 10, w: 20, h: 20 });
      });
      if (!est.valores) return;
      var tol = 0.005;
      b.pontos.forEach(function (pt) {
        var ve = pt.esq[k], vdi = pt.dir[k];
        var inicio = pt.s <= 1e-9, fim = pt.s >= b.L - 1e-9;
        if (!inicio && !fim && Math.abs(ve - vdi) > tol) {
          if (Math.abs(ve) >= tol) cands.push({ b: b, s: pt.s, v: ve, lado: "esq", p: prio(b.id, pt.s, ve) + 1, n: n, dir: dir, Q: Q });
          if (Math.abs(vdi) >= tol) cands.push({ b: b, s: pt.s, v: vdi, lado: "dir", p: prio(b.id, pt.s, vdi) + 1, n: n, dir: dir, Q: Q });
        } else {
          var v = fim ? ve : vdi;
          if (Math.abs(v) >= tol) cands.push({ b: b, s: pt.s, v: v, lado: inicio ? "dir" : fim ? "esq" : "meio", p: prio(b.id, pt.s, v) + (pt.nome ? 1 : 0), n: n, dir: dir, Q: Q });
        }
      });
      if (k === "M") b.extremos.forEach(function (x) {
        if (Math.abs(x.M) >= tol) cands.push({ b: b, s: x.s, v: x.M, lado: "meio", p: prio(b.id, x.s, x.M) + 3, n: n, dir: dir, Q: Q });
      });
    });
    s.push(polys.join(""));
    s.push(eixos.join(""));
    m.apoios.forEach(function (a) { s.push(desenharApoio(g, a, true)); });
    s.push(desenharNos(g, false));
    m.rotulas.forEach(function (rt) {
      var p = posicao(rt.em);
      if (p) s.push('<circle cx="' + r1(g.X(p.x)) + '" cy="' + r1(g.Y(p.y)) + '" r="5.5" fill="#fff" stroke="' + COR.azul + '" stroke-width="2"/>');
    });
    s.push(desenharNomes(g, col));
    s.push(sinais.join(""));
    if (e.vmax < 0.005) {
      var cb = caixaModelo();
      s.push(texto(g.X((cb.x0 + cb.x1) / 2), g.Y(cb.y1) - 30, esc(k + " = 0 em toda a estrutura"), { tam: 13, cor: COR.cinza, estilo: "italic", halo: true }));
    }
    // valores nos pontos notáveis e nos extremos
    cands.sort(function (a, b2) { return b2.p - a.p; });
    cands.forEach(function (c) {
      var q = c.Q(c.s, c.v), sg = c.v >= 0 ? 1 : -1, t = fmt(c.v), tam = 11.5;
      var ox = c.n.x * sg, oy = c.n.y * sg;
      var ancora = "middle", desl = 0;
      if (c.lado !== "meio") {
        var sl = c.lado === "esq" ? -1 : 1;
        if (Math.abs(c.dir.x) > 0.5) { ancora = (c.dir.x * sl > 0) ? "start" : "end"; desl = 4 * sl; }
        else desl = 9 * sl;
      }
      if (Math.abs(ox) > 0.6) ancora = ox > 0 ? "start" : "end";
      for (var t2 = 0; t2 < 4; t2++) {
        var afast = 9 + t2 * 13;
        var lx = q.x + ox * afast + c.dir.x * desl, ly = q.y + oy * afast + c.dir.y * desl + 4;
        var cx = caixaTexto(lx, ly, t, tam, ancora);
        if (col.livre(cx)) {
          col.por(cx);
          s.push(texto(lx, ly, esc(t), { tam: tam, peso: c.p >= 5 ? 700 : 500, halo: true, ancora: ancora }));
          break;
        }
      }
    });
    s.push(legendaVista(k, temInclinadas && k !== "N"));
    return s.join("");
  }

  // treliça: cada barra com a cor da sua natureza e o valor de N
  function desenharNTrelica(g, res) {
    var s = [], col = new Colocador(), m = est.modelo;
    res.barras.forEach(function (b) {
      var x1 = g.X(b.xi), y1 = g.Y(b.yi), x2 = g.X(b.xj), y2 = g.Y(b.yj);
      if (Math.abs(b.N) < 0.005) s.push(linha(x1, y1, x2, y2, COR.cinza, 2, ' stroke-dasharray="6 4" stroke-linecap="round"'));
      else if (b.N > 0) s.push(linha(x1, y1, x2, y2, COR.tracao, 2.6, ' stroke-linecap="round"'));
      else s.push(linha(x1, y1, x2, y2, COR.compressao, 6, ' stroke-linecap="round"'));
    });
    m.apoios.forEach(function (a) { s.push(desenharApoio(g, a, true)); });
    s.push(desenharNos(g, false));
    s.push(desenharNomes(g, col));
    if (est.valores) {
      res.barras.forEach(function (b) {
        var t = Math.abs(b.N) < 0.005 ? "0" : fmt(b.N), nx = -b.s, ny = -b.c;
        if (ny > 0) { nx = -nx; ny = -ny; }
        var cands = [[0.5, 1], [0.5, -1], [0.35, 1], [0.65, 1], [0.35, -1], [0.65, -1]];
        for (var i = 0; i < cands.length; i++) {
          var f = cands[i][0], sd = cands[i][1];
          var px = g.X(b.xi + b.c * b.L * f) + nx * 11 * sd, py = g.Y(b.yi + b.s * b.L * f) + ny * 11 * sd + 4;
          var anc = Math.abs(nx) > 0.6 ? (nx * sd > 0 ? "start" : "end") : "middle";
          var cx = caixaTexto(px, py, t, 12, anc);
          if (col.livre(cx) || i === cands.length - 1) {
            col.por(cx);
            var cor = Math.abs(b.N) < 0.005 ? COR.cinza : b.N > 0 ? COR.tracao : COR.compressao;
            s.push(texto(px, py, esc(t), { tam: 12, peso: 700, cor: cor, halo: true, ancora: anc }));
            break;
          }
        }
      });
    }
    var l = '<g style="pointer-events:none"><rect x="8" y="8" width="210" height="76" rx="6" fill="#fff" fill-opacity="0.92" stroke="#DDE3E9"/>';
    l += texto(18, 30, "N (kN)", { tam: 14, peso: 700, cor: COR.azul, ancora: "start" });
    l += linha(18, 44, 50, 44, COR.tracao, 2.6) + texto(58, 48, "tração (+)", { tam: 11.5, ancora: "start" });
    l += linha(18, 60, 50, 60, COR.compressao, 6) + texto(58, 64, "compressão (−)", { tam: 11.5, ancora: "start" });
    l += linha(18, 76, 50, 76, COR.cinza, 2, ' stroke-dasharray="6 4"') + texto(58, 80, "barra de esforço nulo", { tam: 11.5, ancora: "start" });
    s.push(l + "</g>");
    return s.join("");
  }

  // secção fixada: marca a dourado e os valores
  function desenharSeccao(g, res, vista) {
    if (!est.seccao || !res || !res.barras) return "";
    var b = res.barra(est.seccao.barra);
    if (!b) return "";
    var sv = est.seccao.s, px = g.X(b.xi + b.c * sv), py = g.Y(b.yi + b.s * sv), s = ['<g style="pointer-events:none">'];
    var nrm = { x: -b.s, y: -b.c };
    s.push(linha(px - nrm.x * 40, py - nrm.y * 40, px + nrm.x * 40, py + nrm.y * 40, COR.dourado, 2.4, ' stroke-dasharray="6 4"'));
    s.push('<circle cx="' + r1(px) + '" cy="' + r1(py) + '" r="4.5" fill="' + COR.dourado + '" stroke="' + COR.azul + '"/>');
    if (vista !== "estrutura" && !(trelica() && vista === "N")) {
      var e = escalaDiagrama(g, res, vista), n = ladoPositivo(b, vista);
      var ve = b.esforcos(sv, "esq")[vista], vd = b.esforcos(sv, "dir")[vista];
      [ve, vd].forEach(function (v) {
        s.push('<circle cx="' + r1(px + n.x * v * e.sc) + '" cy="' + r1(py + n.y * v * e.sc) + '" r="4" fill="' + COR.dourado + '" stroke="' + COR.azul + '"/>');
      });
    }
    s.push("</g>");
    return s.join("");
  }

  function construirSvg(g, res, vista, paraExportar) {
    var s = [];
    s.push('<svg xmlns="http://www.w3.org/2000/svg" width="' + g.W + '" height="' + g.H + '" viewBox="0 0 ' + g.W + " " + g.H +
      '" font-family="' + FONTE + '">');
    s.push('<rect width="100%" height="100%" fill="#fff"/>');
    if (vista === "estrutura") s.push(desenharEstrutura(g, paraExportar));
    else if (trelica() && vista === "N" && res && res.barras) s.push(desenharNTrelica(g, res));
    else s.push(desenharDiagrama(g, res, vista));
    if (vista !== "estrutura" && (!res || !res.barras)) {
      var msg = !res || res.erros.length ? "Corrija os dados da estrutura." :
        res.classificacao.tipo === "hipostatica" ? "Estrutura hipostática: não há diagramas." : "";
      if (res && res.vazio) msg = "Desenhe primeiro a estrutura.";
      if (msg) s.push(texto(g.W / 2, 40, esc(msg), { tam: 14, cor: COR.carga, peso: 600, halo: true }));
    }
    if (!est.modelo.barras.length && vista === "estrutura" && !paraExportar) {
      s.push(texto(g.W / 2, g.H - 24, "Escolha Barra e clique em dois pontos da grelha para desenhar a primeira barra; ou abra um exemplo.",
        { tam: 13, cor: COR.cinza, halo: true }));
    }
    s.push(desenharSeccao(g, res, vista));
    if (!paraExportar) {
      s.push('<g id="cursor" style="display:none;pointer-events:none">' +
        linha(0, 0, 0, 0, COR.cinza, 1.2, ' stroke-dasharray="4 3" id="cur-linha"') +
        '<circle id="cur-ponto" r="4" fill="' + COR.azul + '"/>' +
        '<text id="cur-texto" font-size="12" font-weight="700" fill="' + COR.azul +
        '" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round"></text></g>');
      s.push('<g id="cur-snap" style="display:none;pointer-events:none">' +
        linha(0, 0, 0, 0, COR.azul, 2, ' stroke-dasharray="6 4" id="cur-barra"') +
        '<circle id="cur-alvo" r="6" fill="none" stroke="' + COR.dourado + '" stroke-width="2.5"/>' +
        '<text id="cur-coord" font-size="11.5" fill="' + COR.texto + '" stroke="#fff" stroke-width="3.5" paint-order="stroke"></text></g>');
    }
    s.push("</svg>");
    return s.join("");
  }

  function desenhar() {
    est.geo = geometria();
    $("area-desenho").innerHTML = construirSvg(est.geo, est.res, est.vista, false);
  }

  // ------------------------------------------------------------ cursor e estado

  function dica() {
    if (est.vista !== "estrutura") {
      return "Passe o rato sobre uma barra para ler os esforços; clique para fixar a secção. Arraste o fundo para deslocar o desenho e use a roda para ampliar.";
    }
    return {
      selecionar: "Arraste um nó ou um elemento. <b>Duplo clique</b> edita, <b>botão direito</b> apaga. Arraste o fundo para deslocar o desenho; a roda amplia.",
      barra: est.inicioBarra ? "Clique no fim da barra. Continua a partir daí; <b>Esc</b> ou o botão direito terminam." :
        "Clique no início da barra e depois no fim. Um ponto sobre uma barra existente liga-se a ela.",
      movel: "Clique num nó ou numa barra para pôr um apoio móvel. Sobre um apoio existente, troca-lhe o tipo.",
      fixo: "Clique num nó ou numa barra para pôr um apoio fixo. Sobre um apoio existente, troca-lhe o tipo.",
      encastramento: "Clique num nó ou numa barra para pôr um encastramento. Sobre um apoio existente, troca-lhe o tipo.",
      rotula: "Clique num nó onde chegam duas ou mais barras, ou no interior de uma barra, para pôr uma rótula.",
      forca: trelica() ? "Clique num nó para pôr uma força." : "Clique num nó ou numa barra, no ponto onde atua a força.",
      momento: "Clique num nó ou numa barra, no ponto onde atua o momento.",
      distribuida: "Clique numa barra para a carregar toda, ou arraste ao longo dela do início ao fim da carga."
    }[est.ferramenta];
  }

  function mostrarEstado(html) { $("estado").innerHTML = html; }

  function aviso(t) {
    mostrarEstado('<span style="color:' + COR.carga + ';font-weight:600">' + esc(t) + "</span>");
    est.avisoAte = Date.now() + 4500;
    clearTimeout(est.temporizador);
    est.temporizador = setTimeout(function () { mostrarEstado(dica()); }, 4500);
  }

  function emAviso() { return Date.now() < (est.avisoAte || 0); }

  function esconderCursor() {
    var c = document.getElementById("cursor"), sn = document.getElementById("cur-snap");
    if (c) c.style.display = "none";
    if (sn) sn.style.display = "none";
    if (!emAviso()) mostrarEstado(dica());
  }

  function valoresSeccao(b, sv) {
    var v = b.esforcos(sv);
    return "barra <b>" + esc(b.nome) + "</b>, s = <b>" + fmt(sv) + " m</b> &nbsp;·&nbsp; N = <b>" + fmt(v.N) + " kN</b> &nbsp;·&nbsp; V = <b>" + fmt(v.V) +
      " kN</b> &nbsp;·&nbsp; M = <b>" + fmt(v.M) + " kN·m</b>";
  }

  // diagramas: a secção mais próxima do rato
  function moverCursorDiagrama(px, py) {
    var g = est.geo, res = est.res, c = document.getElementById("cursor");
    if (!c || !res || !res.barras) return;
    var bm = barraMaisProxima(px, py, 110);
    if (!bm) { c.style.display = "none"; if (!emAviso()) mostrarEstado(dica()); return; }
    var b = res.barra(bm.barra), sv = clamp(bm.s, 0, b.L), k = est.vista;
    var x0 = g.X(b.xi + b.c * sv), y0 = g.Y(b.yi + b.s * sv), ln = document.getElementById("cur-linha");
    var pt = document.getElementById("cur-ponto"), tx = document.getElementById("cur-texto");
    c.style.display = "";
    if (trelica() && k === "N") {
      ln.setAttribute("x1", r1(x0)); ln.setAttribute("y1", r1(y0)); ln.setAttribute("x2", r1(x0)); ln.setAttribute("y2", r1(y0));
      pt.setAttribute("cx", r1(x0)); pt.setAttribute("cy", r1(y0));
      tx.textContent = "";
      mostrarEstado("barra <b>" + esc(b.nome) + "</b> · N = <b>" + fmt(b.N) + " kN</b> " + (Math.abs(b.N) < 0.005 ? "(nula)" : b.N > 0 ? "(tração)" : "(compressão)"));
      return;
    }
    var e = escalaDiagrama(g, res, k), n = ladoPositivo(b, k), v = b.esforcos(sv)[k];
    var x1 = x0 + n.x * v * e.sc, y1 = y0 + n.y * v * e.sc;
    ln.setAttribute("x1", r1(x0)); ln.setAttribute("y1", r1(y0)); ln.setAttribute("x2", r1(x1)); ln.setAttribute("y2", r1(y1));
    pt.setAttribute("cx", r1(x1)); pt.setAttribute("cy", r1(y1));
    var sg = v >= 0 ? 1 : -1;
    tx.setAttribute("x", r1(x1 + n.x * sg * 12 + 6)); tx.setAttribute("y", r1(y1 + n.y * sg * 12 + 4));
    tx.setAttribute("text-anchor", "start");
    tx.textContent = fmt(v);
    mostrarEstado(valoresSeccao(b, sv));
  }

  // estrutura: o ponto onde a ferramenta vai atuar, e a barra em construção
  function moverCursorEstrutura(px, py) {
    var sn = document.getElementById("cur-snap");
    if (!sn) return;
    var f = est.ferramenta, g = est.geo;
    if (f === "selecionar") {
      sn.style.display = "none";
      var bm = barraMaisProxima(px, py, 10);
      if (bm && est.res && est.res.barras && !emAviso()) mostrarEstado(valoresSeccao(est.res.barra(bm.barra), bm.s));
      else if (!emAviso()) mostrarEstado(dica());
      return;
    }
    var pt;
    if (f === "barra") pt = ajustarPonto(px, py, {});
    else if (f === "distribuida") {
      var bd = barraMaisProxima(px, py, 12);
      pt = bd ? pontoNaBarra(bd.barra, bd.s, true) : null;
    } else pt = ajustarPonto(px, py, { estrutura: true, nos: trelica() });
    est.cursor = pt;
    var alvo = document.getElementById("cur-alvo"), lb = document.getElementById("cur-barra"), co = document.getElementById("cur-coord");
    if (!pt) { sn.style.display = "none"; if (!emAviso()) mostrarEstado(dica()); return; }
    sn.style.display = "";
    var x = g.X(pt.x), y = g.Y(pt.y);
    alvo.setAttribute("cx", r1(x)); alvo.setAttribute("cy", r1(y));
    co.setAttribute("x", r1(x + 10)); co.setAttribute("y", r1(y - 10));
    co.textContent = "(" + fmt(pt.x) + "; " + fmt(pt.y) + ")";
    var info = "(" + fmt(pt.x) + "; " + fmt(pt.y) + ")";
    if (pt.no !== undefined) info = "nó <b>" + esc(nomeNo(pt.no)) + "</b> " + info;
    else if (pt.barra !== undefined) info = "barra <b>" + esc(nomeBarra(pt.barra)) + "</b>, a " + fmt(pt.s) + " m de " + esc(nomeNo(est.idx.barra[pt.barra].i)) + " " + info;
    if (f === "barra" && est.inicioBarra) {
      var a = est.inicioBarra, L = Math.hypot(pt.x - a.x, pt.y - a.y);
      lb.setAttribute("x1", r1(g.X(a.x))); lb.setAttribute("y1", r1(g.Y(a.y))); lb.setAttribute("x2", r1(x)); lb.setAttribute("y2", r1(y));
      lb.style.display = "";
      var ang = Math.atan2(pt.y - a.y, pt.x - a.x) * 180 / Math.PI;
      co.textContent = "L = " + fmt(L) + " m · " + fmtAng(Math.round(ang * 100) / 100);
      info += " &nbsp;·&nbsp; barra com <b>" + fmt(L) + " m</b>";
    } else lb.style.display = "none";
    if (!emAviso()) mostrarEstado(info);
  }

  // ------------------------------------------------------------ posições

  function barraMaisProxima(px, py, tol) {
    var g = est.geo, melhor = null;
    est.modelo.barras.forEach(function (b) {
      var gb = est.idx.geo[b.id];
      if (!gb) return;
      var ax = g.X(gb.xi), ay = g.Y(gb.yi), bx = g.X(gb.xj), by = g.Y(gb.yj);
      var dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
      if (l2 < 1e-9) return;
      var t = clamp(((px - ax) * dx + (py - ay) * dy) / l2, 0, 1);
      var d = Math.hypot(ax + t * dx - px, ay + t * dy - py);
      if (d <= tol && (!melhor || d < melhor.d)) melhor = { barra: b.id, s: t * gb.L, d: d };
    });
    return melhor;
  }

  // um ponto ao longo de uma barra, acertado pela grelha (medida a partir de i)
  function pontoNaBarra(bid, s, comGrelha) {
    var gb = est.idx.geo[bid];
    if (comGrelha && est.ajustar) s = Math.round(s / est.grelha) * est.grelha;
    else s = Math.round(s * 100) / 100;
    s = clamp(arred(s), 0, gb.L);
    if (s <= 1e-9) return { x: gb.xi, y: gb.yi, no: gb.i, barra: bid, s: 0 };
    if (s >= gb.L - 1e-9) return { x: gb.xj, y: gb.yj, no: gb.j, barra: bid, s: gb.L };
    return { x: arred(gb.xi + gb.c * s), y: arred(gb.yi + gb.s * s), barra: bid, s: s };
  }

  // opc: estrutura (só nós e barras), nos (só nós), ignorar {k, id}, ignorarNo
  function ajustarPonto(px, py, opc) {
    opc = opc || {};
    var g = est.geo, m = est.modelo, melhor = null, dmin = 11;
    m.nos.forEach(function (n) {
      if (opc.ignorarNo === n.id) return;
      var d = Math.hypot(g.X(n.x) - px, g.Y(n.y) - py);
      if (d < dmin) { dmin = d; melhor = { x: n.x, y: n.y, no: n.id }; }
    });
    if (melhor) return melhor;
    var dp = 9;
    ITENS.forEach(function (k) {
      m[k].forEach(function (it) {
        if (emNo(it.em) || (opc.ignorar && opc.ignorar.k === k && opc.ignorar.id === it.id)) return;
        var p = posicao(it.em);
        if (!p) return;
        var d = Math.hypot(g.X(p.x) - px, g.Y(p.y) - py);
        if (d < dp) { dp = d; melhor = { x: p.x, y: p.y, barra: it.em.barra, s: it.em.s }; }
      });
    });
    if (melhor) return opc.nos ? null : melhor;
    if (opc.nos) return null;
    var bm = barraMaisProxima(px, py, 11);
    if (bm) {
      var pn = pontoNaBarra(bm.barra, bm.s, true);
      if (pn.no !== undefined) delete pn.barra;
      return pn;
    }
    if (opc.estrutura) return null;
    var xm = g.xDe(px), ym = g.yDe(py), q = est.grelha;
    if (est.ajustar) return { x: arred(Math.round(xm / q) * q), y: arred(Math.round(ym / q) * q) };
    return { x: arred(Math.round(xm * 100) / 100), y: arred(Math.round(ym * 100) / 100) };
  }

  function emDePonto(pt) { return pt.no !== undefined ? { no: pt.no } : { barra: pt.barra, s: pt.s }; }

  function pontoNoSvg(ev) {
    var svg = $("area-desenho").querySelector("svg");
    var rc = svg.getBoundingClientRect(), k = est.geo.W / rc.width;
    return { x: (ev.clientX - rc.left) * k, y: (ev.clientY - rc.top) * k };
  }

  // ------------------------------------------------------------ operações sobre a geometria

  function noNasCoordenadas(m, x, y) {
    for (var i = 0; i < m.nos.length; i++) if (Math.hypot(m.nos[i].x - x, m.nos[i].y - y) < 1e-6) return m.nos[i].id;

    return no.id;
  }

  function sobreposta(m, x1, y1, x2, y2) {

    else if (k === "apoios") dialogoApoio(e);

  }

    if (k === "barras") { dialogoBarra(null); return; }

    if (k === "apoios") dialogoApoio(null, em);

  }

    else {

    try { $("area-desenho").setPointerCapture(ev.pointerId); } catch (er) { /* */ }

        var po = alvo.k === "nos" ? { x: e.x, y: e.y } : ITENS.indexOf(alvo.k) >= 0 ? posicao(e.em) : null;
        if (po) { est.arrasto.ox = est.geo.X(po.x); est.arrasto.oy = est.geo.Y(po.y); }

        try { $("area-desenho").setPointerCapture(ev.pointerId); } catch (er) { /* */ }

    if (est.vista === "estrutura") moverCursorEstrutura(p.x, p.y);
    else moverCursorDiagrama(p.x, p.y);
  }

  function projetar(gb, px, py) {

  function arrastar(a, p) {
    var g = est.geo;

      if (a.ponta === "1") e.s1 = Math.min(pontoNaBarra(e.barra, o.s1 + ds, true).s, arred(e.s2 - q));

        e.s1 = arred(nx); e.s2 = arred(nx + comp);
      }
      mostrarEstado("Carga de <b>" + fmt(e.s1) + "</b> a <b>" + fmt(e.s2) + " m</b> de " + esc(nomeNo(gb.i)));
    } else {
      var pe = ajustarPonto(tx, ty, { estrutura: true, nos: trelica(), ignorar: { k: a.k, id: a.id } });
      if (pe) {
        e.em = emDePonto(pe);
        mostrarEstado(esc(descreverEm(e.em)));
      }
    }
    est.modelo = sanear(est.modelo);
    recalcular();
  }

  function aoLargar(ev) {
    var a = est.arrasto;
    if (!a) return;
    est.arrasto = null;
    try { $("area-desenho").releasePointerCapture(ev.pointerId); } catch (er) { /* */ }
    if (a.modo === "pan") {
      if (!a.moveu && a.clique) { var p = pontoNoSvg(ev); fixarSeccao(p.x, p.y); }
      return;
    }
    if (a.modo === "barra-nova") {
      var p2 = pontoNoSvg(ev);
      if (Math.hypot(p2.x - a.px0, p2.y - a.py0) > 8) {
        var pt = ajustarPonto(p2.x, p2.y, {});
        if (criarBarraEntre(est.inicioBarra, pt)) est.inicioBarra = { x: pt.x, y: pt.y };
      }
      return;
    }
    if (a.modo === "nova-dist") {
      var s1 = Math.min(a.s1, est.previa.s2), s2 = Math.max(a.s1, est.previa.s2);
      est.previa = null;
      if (s2 - s1 < 1e-6) { s1 = 0; s2 = est.idx.geo[a.barra].L; }
      desenhar();
      dialogoDistribuida(null, a.barra, s1, s2);
      return;
    }
    if (a.modo === "mover" && a.moveu) {
      var res = S.resolver(est.modelo);
      if (res.erros.length > a.errosAntes) {
        est.modelo = JSON.parse(a.antes);
        aviso("Não pode ficar aí: " + res.erros[0]);
      } else {
        est.hist.push(a.antes);
        est.fut = [];
        mostrarEstado(dica());
      }
      atualizar();
    }
  }

  function terminarBarra() {
    if (!est.inicioBarra) return false;
    est.inicioBarra = null;
    var lb = document.getElementById("cur-barra");
    if (lb) lb.style.display = "none";
    mostrarEstado(dica());
    return true;
  }

  function aoMenuContexto(ev) {
    ev.preventDefault();
    if (est.ferramenta === "barra" && terminarBarra()) return;
    if (est.vista !== "estrutura") return;
    var alvo = alvoDe(ev);
    if (alvo) apagar(alvo.k, alvo.id);
  }

  function aoRodar(ev) {
    if (est.dialogo || !est.geo) return;
    ev.preventDefault();
    var p = pontoNoSvg(ev), d = ev.deltaMode === 1 ? ev.deltaY * 30 : ev.deltaY;
    zoom(p.x, p.y, Math.pow(1.0015, -d));
    desenhar();
  }

  // ------------------------------------------------------------ diálogos

  // O conteúdo de cada diálogo vive num elemento novo: os ouvintes de um
  // diálogo morrem com ele e não se acumulam no seguinte.
  function abrirDialogo(html, aoAbrir, largo) {
    var fundo = $("fundo-dialogo"), caixa = $("dialogo");
    caixa.className = "dialogo" + (largo ? " largo" : "");
    caixa.innerHTML = "";
    var d = document.createElement("div");
    d.innerHTML = html;
    caixa.appendChild(d);
    fundo.hidden = false;
    est.dialogo = true;
    if (aoAbrir) aoAbrir(d);
    var primeiro = d.querySelector("input[type=text]") || d.querySelector("button.principal") || d.querySelector("button");
    if (primeiro) {
      try { primeiro.focus({ preventScroll: true }); } catch (e) { primeiro.focus(); }
      if (primeiro.select) primeiro.select();
    }
    caixa.scrollTop = 0;
  }

  function fecharDialogo() {
    $("fundo-dialogo").hidden = true;
    $("dialogo").innerHTML = "";
    est.dialogo = false;
  }

  function opcoes(grupo, lista, ativa) {
    return '<div class="opcoes" data-grupo="' + grupo + '">' + lista.map(function (o) {
      return '<button type="button" data-v="' + o[0] + '"' + (o[0] === ativa ? ' class="ativa"' : "") + ">" + o[1] + "</button>";
    }).join("") + "</div>";
  }
  function lerOpcao(d, grupo) { var b = d.querySelector('[data-grupo="' + grupo + '"] .ativa'); return b ? b.getAttribute("data-v") : null; }
  function campoNum(id, valor, unidade) {
    return '<input type="text" inputmode="decimal" id="' + id + '" value="' + esc(valor) + '">' + (unidade ? '<span class="unidade" id="' + id + '-un">' + unidade + "</span>" : "");
  }
  function valorCampo(d, id) { var e = d.querySelector("#" + id); return e ? lerNum(e.value) : NaN; }
  function mostrarLinha(d, nome, ver) {
    Array.prototype.forEach.call(d.querySelectorAll('[data-linha="' + nome + '"]'), function (n) { n.style.display = ver ? "" : "none"; });
  }

  // cfg: titulo, linhas [[rótulo, html, linha?]], previa, aoMudar(d), ler(d) -> {erro} | {valores}, confirmar(v), apagar
  function dialogoForm(cfg) {
    var html = "<h2>" + cfg.titulo + '</h2><div class="form">' + cfg.linhas.map(function (l) {
      return '<label' + (l[2] ? ' data-linha="' + l[2] + '"' : "") + ">" + l[0] + '</label><div class="campo"' +
        (l[2] ? ' data-linha="' + l[2] + '"' : "") + ">" + l[1] + "</div>";
    }).join("") + "</div>" + (cfg.previa ? '<div class="previa" id="d-previa"></div>' : "") +
      '<div class="erro-form" id="d-erro"></div><div class="botoes">' +
      (cfg.apagar ? '<button type="button" data-d="apagar" style="margin-right:auto">Apagar</button>' : "") +
      '<button type="button" data-d="cancelar">Cancelar</button><button type="button" class="principal" data-d="ok">OK</button></div>';
    abrirDialogo(html, function (d) {
      function upd() {
        if (!est.dialogo) return;
        if (cfg.aoMudar) cfg.aoMudar(d);
        var r = cfg.ler(d);
        $("d-erro").textContent = r.erro && r.mostrar !== false ? r.erro : "";
      }
      function ok() {
        if (!est.dialogo) return;
        var r = cfg.ler(d);
        if (r.erro) { $("d-erro").textContent = r.erro; return; }
        fecharDialogo();
        cfg.confirmar(r.valores);
      }
      d.addEventListener("input", upd);
      d.addEventListener("change", upd);
      d.addEventListener("click", function (ev) {
        var b = ev.target.closest("button");
        if (!b) return;
        var g = b.parentNode && b.parentNode.getAttribute && b.parentNode.getAttribute("data-grupo");
        if (g && !b.disabled) {
          Array.prototype.forEach.call(b.parentNode.children, function (c) { c.classList.toggle("ativa", c === b); });
          if (cfg.aoClicarOpcao) cfg.aoClicarOpcao(d, g, b.getAttribute("data-v"));
          upd();
          return;
        }
        var acao = b.getAttribute("data-d");
        if (acao === "ok") ok();
        else if (acao === "cancelar") fecharDialogo();
        else if (acao === "apagar") { fecharDialogo(); cfg.apagar(); }
      });
      d.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" && ev.target.tagName !== "SELECT") { ev.preventDefault(); ok(); }
      });
      if (cfg.aoMudar) cfg.aoMudar(d);
      var r = cfg.ler(d);
      if (r.erro && r.mostrar !== false) $("d-erro").textContent = r.erro;
    });
  }

  // ---- onde fica um elemento: um nó, ou um ponto de uma barra

  function opcoesNos(soNos) {
    var m = est.modelo, nos = m.nos.slice().sort(function (a, b) { return nomeNo(a.id) < nomeNo(b.id) ? -1 : 1; });
    var out = nos.map(function (n) { return ["n:" + n.id, "nó " + nomeNo(n.id) + " (" + fmt(n.x) + "; " + fmt(n.y) + ")"]; });
    if (!soNos) {
      m.barras.slice().sort(function (a, b) { return nomeBarra(a) < nomeBarra(b) ? -1 : 1; }).forEach(function (b) {
        out.push(["b:" + b.id, "barra " + nomeBarra(b) + " (" + fmt(est.idx.geo[b.id].L) + " m)"]);
      });
    }
    return out;
  }

  function linhasPosicao(em, soNos) {
    var v = emNo(em) ? "n:" + em.no : "b:" + em.barra;
    var sel = '<select id="d-em">' + opcoesNos(soNos).map(function (o) {
      return '<option value="' + o[0] + '"' + (o[0] === v ? " selected" : "") + ">" + esc(o[1]) + "</option>";
    }).join("") + "</select>";
    return [["Ponto", sel], ['<span id="d-s-rot">Distância</span>', campoNum("d-s", fmt(emNo(em) ? 0 : em.s), "m"), "s"]];
  }

  function atualizarPosicao(d) {
    var v = d.querySelector("#d-em").value, barra = v.charAt(0) === "b";
    mostrarLinha(d, "s", barra);
    if (barra) {
      var b = est.idx.barra[+v.slice(2)];
      d.querySelector("#d-s-rot").textContent = "Distância a " + nomeNo(b.i);
      d.querySelector("#d-s-un").textContent = "m (de 0 a " + fmt(est.idx.geo[b.id].L) + ")";
    }
  }

  function lerPosicao(d) {
    var v = d.querySelector("#d-em").value, id = +v.slice(2);
    if (v.charAt(0) === "n") return { em: { no: id } };
    var gb = est.idx.geo[id], s = valorCampo(d, "d-s");
    if (!isFinite(s)) return { erro: "Escreva a distância em metros." };
    if (s < -1e-9 || s > gb.L + 1e-9) return { erro: "A distância vai de 0 a " + fmt(gb.L) + " m." };
    s = arred(clamp(s, 0, gb.L));
    if (s <= 1e-9) return { em: { no: gb.i } };
    if (s >= gb.L - 1e-9) return { em: { no: gb.j } };
    return { em: { barra: id, s: s } };
  }

  function dialogoNo(e) {
    dialogoForm({
      titulo: "Nó " + esc(nomeNo(e.id)),
      linhas: [
        ["Nome", '<input type="text" id="d-nome" value="' + esc(e.nome || "") + '" placeholder="' + esc(nomeNo(e.id)) + '" style="width:96px;text-align:left"> <span class="unidade">vazio: automático</span>'],
        ["x", campoNum("d-x", fmt(e.x), "m")],
        ["y", campoNum("d-y", fmt(e.y), "m")]
      ],
      ler: function (d) {
        var x = valorCampo(d, "d-x"), y = valorCampo(d, "d-y"), nome = d.querySelector("#d-nome").value.trim();
        if (!isFinite(x) || !isFinite(y)) return { erro: "Escreva as coordenadas em metros." };
        if (nome.length > 6) return { erro: "Um nome curto, até 6 caracteres." };
        var outro = est.modelo.nos.some(function (n) { return n.id !== e.id && Math.hypot(n.x - x, n.y - y) < 1e-6; });
        if (outro) return { erro: "Já há outro nó nesse ponto." };
        return { valores: { x: arred(x), y: arred(y), nome: nome } };
      },
      confirmar: function (v) {
        alterar(function () {
          var n = acharElemento("nos", e.id);
          n.x = v.x; n.y = v.y;
          if (v.nome) n.nome = v.nome; else delete n.nome;
        });
      },
      apagar: function () { apagar("nos", e.id); }
    });
  }

  function dialogoBarra(e) {
    var gb = e ? est.idx.geo[e.id] : null;
    var u = est.ultimo.barra || { x1: 0, y1: 0, x2: 6, y2: 0 };
    dialogoForm({
      titulo: e ? "Barra " + esc(nomeBarra(e)) : "Nova barra",
      previa: true,
      linhas: [
        ["Início (x; y)", campoNum("d-x1", fmt(gb ? gb.xi : u.x1)) + campoNum("d-y1", fmt(gb ? gb.yi : u.y1), "m")],
        ["Fim (x; y)", campoNum("d-x2", fmt(gb ? gb.xj : u.x2)) + campoNum("d-y2", fmt(gb ? gb.yj : u.y2), "m")]
      ],
      aoMudar: function (d) {
        var r = this.ler(d), pv = $("d-previa");
        if (r.erro) { pv.innerHTML = ""; return; }
        var v = r.valores, L = Math.hypot(v.x2 - v.x1, v.y2 - v.y1), ang = Math.atan2(v.y2 - v.y1, v.x2 - v.x1) * 180 / Math.PI;
        pv.innerHTML = '<div class="info">Comprimento <b>' + fmt(L) + " m</b> · " + fmtAng(Math.round(ang * 100) / 100) + " com o eixo x" +
          (e ? "<br><span style=\"color:#7B8794;font-size:12px\">Mudar as coordenadas desloca os nós, e as barras ligadas a eles acompanham.</span>" : "") + "</div>";
      },
      ler: function (d) {
        var v = { x1: valorCampo(d, "d-x1"), y1: valorCampo(d, "d-y1"), x2: valorCampo(d, "d-x2"), y2: valorCampo(d, "d-y2") };
        if (![v.x1, v.y1, v.x2, v.y2].every(isFinite)) return { erro: "Escreva as coordenadas em metros." };
        Object.keys(v).forEach(function (k) { v[k] = arred(v[k]); });
        if (Math.hypot(v.x2 - v.x1, v.y2 - v.y1) < 1e-6) return { erro: "O início e o fim não podem coincidir." };
        return { valores: v };
      },
      confirmar: function (v) {
        est.ultimo.barra = v;
        if (!e) { criarBarraEntre({ x: v.x1, y: v.y1 }, { x: v.x2, y: v.y2 }); return; }
        var antes = JSON.stringify(est.modelo), errosAntes = est.res ? est.res.erros.length : 0;
        alterar(function () {
          var a = acharElemento("nos", e.i), b = acharElemento("nos", e.j);
          a.x = v.x1; a.y = v.y1; b.x = v.x2; b.y = v.y2;
        });
        if (est.res.erros.length > errosAntes) {
          var msg = est.res.erros[0];
          est.hist.pop();
          est.modelo = JSON.parse(antes);
          atualizar();
          aviso("Não pode ficar assim: " + msg);
        }
      },
      apagar: e ? function () { apagar("barras", e.id); } : null
    });
  }

  function dialogoApoio(e, em0) {
    var em = e ? e.em : em0, tipo = e ? e.tipo : (est.ultimo.apoio || "fixo");
    var tipos = [["movel", "Móvel"], ["fixo", "Fixo"]].concat(trelica() ? [] : [["encastramento", "Encastramento"]]);
    dialogoForm({
      titulo: e ? "Apoio " + esc(nomeEm(e.em)) : "Novo apoio",
      linhas: [["Tipo", opcoes("tipo", tipos, tipo)]].concat(linhasPosicao(em, trelica())).concat([
        ["Inclinação da reação", campoNum("d-ang", fmt(e && e.tipo === "movel" ? e.angulo || 0 : 0), "° com a vertical"), "ang"]
      ]),
      aoMudar: function (d) {
        mostrarLinha(d, "ang", lerOpcao(d, "tipo") === "movel");
        atualizarPosicao(d);
      },
      ler: function (d) {
        var t = lerOpcao(d, "tipo"), pp = lerPosicao(d);
        if (pp.erro) return pp;
        var ang = t === "movel" ? valorCampo(d, "d-ang") : 0;
        if (!isFinite(ang) || Math.abs(ang) > 90) return { erro: "A inclinação da reação vai de -90° a 90° (0° = vertical)." };
        var outro = est.modelo.apoios.some(function (a) { return (!e || a.id !== e.id) && mesmoPonto(a.em, pp.em); });
        if (outro) return { erro: "Já há um apoio nesse ponto." };
        return { valores: { tipo: t, em: pp.em, angulo: arred(ang) } };
      },
      confirmar: function (v) {
        est.ultimo.apoio = v.tipo;
        alterar(function (m) {
          if (e) { var a = acharElemento("apoios", e.id); a.tipo = v.tipo; a.em = v.em; a.angulo = v.angulo; }
          else { var id = est.proximoId++; m.apoios.push({ id: id, em: v.em, tipo: v.tipo, angulo: v.angulo }); est.sel = { k: "apoios", id: id }; }
        });
      },
      apagar: e ? function () { apagar("apoios", e.id); } : null
    });
  }

  function dialogoRotula(e, em0) {
    var em = e ? e.em : em0 || (est.modelo.barras.length ? { barra: est.modelo.barras[0].id, s: arred(est.idx.geo[est.modelo.barras[0].id].L / 2) } : null);
    if (!em) return;
    dialogoForm({
      titulo: e ? "Rótula" : "Nova rótula",
      linhas: linhasPosicao(em, false),
      aoMudar: atualizarPosicao,
      ler: function (d) {
        var pp = lerPosicao(d);
        if (pp.erro) return pp;
        if (emNo(pp.em) && (est.idx.ligacoes[pp.em.no] || []).length < 2) return { erro: "Uma rótula liga duas ou mais barras: nesse nó só chega uma." };
        if (est.modelo.rotulas.some(function (r) { return (!e || r.id !== e.id) && mesmoPonto(r.em, pp.em); })) return { erro: "Já há uma rótula nesse ponto." };
        return { valores: { em: pp.em } };
      },
      confirmar: function (v) {
        alterar(function (m) {
          if (e) acharElemento("rotulas", e.id).em = v.em;
          else { var id = est.proximoId++; m.rotulas.push({ id: id, em: v.em }); est.sel = { k: "rotulas", id: id }; }
        });
      },
      apagar: e ? function () { apagar("rotulas", e.id); } : null
    });
  }

  function previaForca(d, F, alfa) {
    var cx = 70, cy = 58, len = 44, a = alfa * Math.PI / 180, ux = Math.cos(a), uy = -Math.sin(a), s = "";
    var hx = cx + ux * len / 2, hy = cy + uy * len / 2, tx = cx - ux * len / 2, ty = cy - uy * len / 2;
    s += linha(10, cy, 130, cy, "#E1E6EB", 1) + linha(cx, 8, cx, 108, "#E1E6EB", 1);
    if (Math.abs(ux) > 1e-6 && Math.abs(uy) > 1e-6) {
      s += seta(tx, ty, hx, ty, COR.carga, 1.1, true) + seta(hx, ty, hx, hy, COR.carga, 1.1, true);
    }
    s += seta(tx, ty, hx, hy, COR.carga, 2.4);
    var c = S.componentesForca({ F: F, alfa: alfa });
    var info = "F<sub>x</sub> = " + fmt(Math.abs(c.Fx)) + " kN " + (c.Fx > 1e-9 ? "→" : c.Fx < -1e-9 ? "←" : "") +
      "<br>F<sub>y</sub> = " + fmt(Math.abs(c.Fy)) + " kN " + (c.Fy > 1e-9 ? "↑" : c.Fy < -1e-9 ? "↓" : "") +
      '<br><span style="color:#7B8794;font-size:12px">' + esc(descreverDirecao(alfa)) + "</span>";
    $("d-previa").innerHTML = '<svg width="140" height="116" viewBox="0 0 140 116">' + s + '</svg><div class="info">' + info + "</div>";
  }

  function dialogoForca(e, em0) {
    var u = est.ultimo.forca || { F: 10, alfa: 270 }, em = e ? e.em : em0;
    var F0 = e ? e.F : u.F, an = angulosDeAlfa(e ? e.alfa : u.alfa);
    dialogoForm({
      titulo: e ? "Editar força" : "Nova força",
      previa: true,
      linhas: linhasPosicao(em, trelica()).concat([
        ["Intensidade F", campoNum("d-F", fmt(F0), "kN")],
        ["Ângulo com a horizontal", campoNum("d-th", fmt(an.theta, an.theta % 1 ? 2 : 0), "°") +
          opcoes("atalho", [["90", "90°"], ["0", "0°"], ["30", "30°"], ["45", "45°"], ["60", "60°"]], "")],
        ["Sentido horizontal", opcoes("sh", [["dir", "→ para a direita"], ["esq", "← para a esquerda"]], an.sh)],
        ["Sentido vertical", opcoes("sv", [["baixo", "↓ para baixo"], ["cima", "↑ para cima"]], an.sv)]
      ]),
      aoClicarOpcao: function (d, g, v) {
        if (g === "atalho") {
          d.querySelector("#d-th").value = v;
          Array.prototype.forEach.call(d.querySelectorAll('[data-grupo="atalho"] button'), function (b) { b.classList.remove("ativa"); });
        }
      },
      aoMudar: function (d) {
        atualizarPosicao(d);
        var th = valorCampo(d, "d-th"), F = valorCampo(d, "d-F");
        Array.prototype.forEach.call(d.querySelectorAll('[data-grupo="sh"] button'), function (b) { b.disabled = Math.abs(th - 90) < 1e-9; });
        Array.prototype.forEach.call(d.querySelectorAll('[data-grupo="sv"] button'), function (b) { b.disabled = Math.abs(th) < 1e-9; });
        if (isFinite(th) && th >= 0 && th <= 90 && isFinite(F) && F > 0) previaForca(d, F, alfaDeAngulos(th, lerOpcao(d, "sh"), lerOpcao(d, "sv")));
        else $("d-previa").innerHTML = "";
      },
      ler: function (d) {
        var pp = lerPosicao(d);
        if (pp.erro) return pp;
        var F = valorCampo(d, "d-F"), th = valorCampo(d, "d-th");
        if (!(F > 0)) return { erro: "A intensidade tem de ser positiva; o sentido escolhe-se em baixo." };
        if (!(th >= 0 && th <= 90)) return { erro: "O ângulo com a horizontal vai de 0° a 90°." };
        return { valores: { em: pp.em, F: arred(F), alfa: alfaDeAngulos(th, lerOpcao(d, "sh"), lerOpcao(d, "sv")) } };
      },
      confirmar: function (v) {
        est.ultimo.forca = { F: v.F, alfa: v.alfa };
        alterar(function (m) {
          if (e) { var f = acharElemento("forcas", e.id); f.em = v.em; f.F = v.F; f.alfa = v.alfa; }
          else { var id = est.proximoId++; m.forcas.push({ id: id, em: v.em, F: v.F, alfa: v.alfa }); est.sel = { k: "forcas", id: id }; }
        });
      },
      apagar: e ? function () { apagar("forcas", e.id); } : null
    });
  }

  function dialogoMomento(e, em0) {
    var u = est.ultimo.momento || { M: 10, sentido: "horario" }, em = e ? e.em : em0;
    dialogoForm({
      titulo: e ? "Editar momento" : "Novo momento",
      linhas: linhasPosicao(em, false).concat([
        ["Intensidade M", campoNum("d-M", fmt(e ? e.M : u.M), "kN·m")],
        ["Sentido", opcoes("sentido", [["horario", "↻ horário"], ["anti-horario", "↺ anti-horário"]], e ? e.sentido : u.sentido)]
      ]),
      aoMudar: atualizarPosicao,
      ler: function (d) {
        var pp = lerPosicao(d);
        if (pp.erro) return pp;
        var M = valorCampo(d, "d-M");
        if (!(M > 0)) return { erro: "A intensidade tem de ser positiva; o sentido escolhe-se em baixo." };
        return { valores: { em: pp.em, M: arred(M), sentido: lerOpcao(d, "sentido") } };
      },
      confirmar: function (v) {
        est.ultimo.momento = { M: v.M, sentido: v.sentido };
        alterar(function (m) {
          if (e) { var q = acharElemento("momentos", e.id); q.em = v.em; q.M = v.M; q.sentido = v.sentido; }
          else { var id = est.proximoId++; m.momentos.push({ id: id, em: v.em, M: v.M, sentido: v.sentido }); est.sel = { k: "momentos", id: id }; }
        });
      },
      apagar: e ? function () { apagar("momentos", e.id); } : null
    });
  }

  // os sentidos de uma carga distribuída, com as palavras da sua direção
  function sentidosDist(direcao, gb) {
    if (direcao === "horizontal" || (direcao === "perpendicular" && gb && Math.abs(gb.c) < 1e-9)) return [["baixo", "→ para a direita"], ["cima", "← para a esquerda"]];
    if (direcao === "perpendicular") return [["baixo", "para o lado de baixo da barra"], ["cima", "para o lado de cima"]];
    return [["baixo", "↓ para baixo"], ["cima", "↑ para cima"]];
  }

  function dialogoDistribuida(e, bid0, s10, s20) {
    var u = est.ultimo.dist || { q1: 10, q2: 10, direcao: "vertical" };
    var bid = e ? e.barra : bid0, q1 = e ? e.q1 : u.q1, q2 = e ? e.q2 : u.q2, unif = Math.abs(q1 - q2) < 1e-9;
    var direcao = e ? e.direcao : u.direcao || "vertical";
    // as intensidades escrevem-se positivas e o sentido escolhe-se à parte, como nas forças
    var sg = (Math.abs(q1) >= Math.abs(q2) ? q1 : q2) < 0 ? -1 : 1;
    var barras = est.modelo.barras.slice().sort(function (a, b) { return nomeBarra(a) < nomeBarra(b) ? -1 : 1; });
    var sel = '<select id="d-barra">' + barras.map(function (b) {
      return '<option value="' + b.id + '"' + (b.id === bid ? " selected" : "") + ">" + esc(nomeBarra(b)) + " (" + fmt(est.idx.geo[b.id].L) + " m)</option>";
    }).join("") + "</select>";
    function geoSel(d) { return est.idx.geo[+d.querySelector("#d-barra").value]; }
    dialogoForm({
      titulo: e ? "Editar carga distribuída" : "Nova carga distribuída",
      previa: true,
      linhas: [
        ["Barra", sel],
        ['<span id="d-s1-rot">Início</span>', campoNum("d-s1", fmt(e ? e.s1 : s10), "m")],
        ['<span id="d-s2-rot">Fim</span>', campoNum("d-s2", fmt(e ? e.s2 : s20), "m")],
        ["Direção", opcoes("direcao", [["vertical", "Vertical"], ["horizontal", "Horizontal"], ["perpendicular", "Perpendicular à barra"]], direcao)],
        ["Forma", opcoes("forma", [["uniforme", "Uniforme"], ["variavel", "Triangular ou trapezoidal"]], unif ? "uniforme" : "variavel")],
        ["q no início", campoNum("d-q1", fmt(q1 * sg), "kN/m")],
        ["q no fim", campoNum("d-q2", fmt(q2 * sg), "kN/m"), "q2"],
        ["Sentido", opcoes("sentido", sentidosDist(direcao, est.idx.geo[bid]), sg > 0 ? "baixo" : "cima")]
      ],
      aoMudar: function (d) {
        var gb = geoSel(d), ni = nomeNo(gb.i);
        d.querySelector("#d-s1-rot").textContent = "Início, a partir de " + ni;
        d.querySelector("#d-s2-rot").textContent = "Fim, a partir de " + ni;
        d.querySelector("#d-s2-un").textContent = "m (a barra tem " + fmt(gb.L) + " m)";
        mostrarLinha(d, "q2", lerOpcao(d, "forma") !== "uniforme");
        var rot = sentidosDist(lerOpcao(d, "direcao"), gb);
        Array.prototype.forEach.call(d.querySelectorAll('[data-grupo="sentido"] button'), function (b, i) { b.textContent = rot[i][1]; });
        var r = this.ler(d), pv = $("d-previa");
        if (r.erro) { pv.innerHTML = ""; return; }
        var v = r.valores, R = S.resultanteDistribuida(v);
        pv.innerHTML = '<div class="info">Resultante: <b>R = ' + fmt(Math.abs(R.F)) + " kN</b>" +
          (R.s !== null ? " a <b>" + fmt(R.s) + " m</b> de " + esc(ni) : "") +
          '<br><span style="color:#7B8794;font-size:12px">Por metro de barra.</span></div>';
      },
      ler: function (d) {
        var gb = geoSel(d), a = valorCampo(d, "d-s1"), b = valorCampo(d, "d-s2");
        if (!isFinite(a) || !isFinite(b)) return { erro: "Escreva as posições em metros." };
        if (a < -1e-9 || b > gb.L + 1e-9) return { erro: "As posições vão de 0 a " + fmt(gb.L) + " m." };
        if (b - a < 1e-6) return { erro: "O fim tem de vir depois do início." };
        var uni = lerOpcao(d, "forma") === "uniforme";
        var v1 = valorCampo(d, "d-q1"), v2 = uni ? v1 : valorCampo(d, "d-q2");
        if (!isFinite(v1) || !isFinite(v2)) return { erro: "Escreva os valores da carga em kN/m." };
        if (v1 < 0 || v2 < 0) return { erro: "As intensidades são positivas; o sentido escolhe-se em baixo." };
        if (v1 < 1e-12 && v2 < 1e-12) return { erro: "A carga não pode ser nula nas duas extremidades." };
        var s = lerOpcao(d, "sentido") === "cima" ? -1 : 1;
        return { valores: { barra: gb.id, s1: arred(clamp(a, 0, gb.L)), s2: arred(clamp(b, 0, gb.L)), q1: arred(v1 * s), q2: arred(v2 * s),
                            direcao: lerOpcao(d, "direcao") } };
      },
      confirmar: function (v) {
        est.ultimo.dist = { q1: v.q1, q2: v.q2, direcao: v.direcao };
        alterar(function (m) {
          if (e) { var dd = acharElemento("distribuidas", e.id); Object.keys(v).forEach(function (k) { dd[k] = v[k]; }); }
          else { var id = est.proximoId++; v.id = id; m.distribuidas.push(v); est.sel = { k: "distribuidas", id: id }; }
        });
      },
      apagar: e ? function () { apagar("distribuidas", e.id); } : null
    });
  }

  function figuraConvencao() {
    var s = '<svg width="420" height="150" viewBox="0 0 420 150" font-family="' + FONTE + '">';
    s += '<rect x="186" y="50" width="48" height="50" fill="#DCE4EC" stroke="' + COR.azul + '" stroke-width="1.5"/>';

    s += seta(160, 112, 160, 42, COR.reacao, 2) + texto(150, 38, "V", { ancora: "end", peso: 700, tam: 13 });
    s += arco(132, 75, 22, 200, 340, COR.reacao, 2) + texto(110, 44, "M", { ancora: "end", peso: 700, tam: 13 });
    s += seta(300, 75, 360, 75, COR.reacao, 2) + texto(364, 70, "N", { ancora: "start", peso: 700, tam: 13 });
    s += seta(260, 42, 260, 112, COR.reacao, 2) + texto(270, 38, "V", { ancora: "start", peso: 700, tam: 13 });
    s += arco(288, 75, 22, 340, 200, COR.reacao, 2) + texto(310, 44, "M", { ancora: "start", peso: 700, tam: 13 });
    s += texto(90, 140, "à esquerda da secção", { tam: 11, cor: COR.cinza }) + texto(330, 140, "à direita da secção", { tam: 11, cor: COR.cinza });

  }

  function dialogoAjuda() {
    var html = "<h2>Diagramas de Esforços</h2>" +
      "<h3>Desenhar a estrutura</h3><ul>" +
      "<li>Escolha <b>Barra</b> e clique no início e no fim de cada barra; o desenho continua a partir do último ponto, até carregar em <kbd>Esc</kbd> ou no botão direito. Um ponto sobre uma barra que já existe liga-se a ela.</li>" +
      "<li>Os pontos acertam pelos nós e pela grelha. O botão <b>Ajustar</b> (tecla <kbd>G</kbd>) liga e desliga a grelha; sem ela, acertam ao centímetro. Para valores exatos, faça duplo clique num nó ou numa barra e escreva as coordenadas.</li>" +
      "<li>Em <b>Estrutura</b>, escolha <b>Treliça</b> para ter todos os nós articulados, com as cargas e os apoios nos nós.</li>" +
      "<li>Apoios, rótulas, forças e momentos põem-se com um clique num nó ou num ponto de uma barra; uma carga distribuída, arrastando ao longo de uma barra (ou com um clique, para a barra toda). As cargas escrevem-se sem sinal, com o sentido à parte; as distribuídas são por metro de barra.</li>" +
      "<li>Com <b>Selecionar</b>, arraste nós e elementos; duplo clique edita; o botão direito ou <kbd>Delete</kbd> apaga; as setas deslocam o que estiver selecionado. Apagar o nó entre duas barras alinhadas junta-as numa só.</li>" +
      "<li>Arraste o fundo para deslocar o desenho e use a roda do rato para ampliar; <b>Enquadrar</b> (tecla <kbd>F</kbd>) volta a ajustá-lo à janela.</li>" +
      "<li><kbd>Ctrl</kbd>+<kbd>Z</kbd> desfaz e <kbd>Ctrl</kbd>+<kbd>Y</kbd> refaz (<kbd>⌘</kbd> no Mac). A última estrutura fica guardada neste browser; <b>Guardar</b> cria um ficheiro para a abrir noutro computador.</li></ul>" +
      "<h3>Ver os resultados</h3><ul>" +
      "<li>Os botões por cima do desenho mostram a estrutura com as cargas e as reações, ou um dos diagramas de <b>N</b>, <b>V</b> e <b>M</b> desenhado sobre as barras. Numa treliça, o diagrama de N é a cor de cada barra.</li>" +
      "<li>Passe o rato sobre uma barra para ler os esforços; clique para fixar a secção. No painel, os quadros dão os valores nos pontos notáveis de cada barra.</li></ul>" +
      "<h3>Duas convenções de sinais</h3>" +
      '<p><span class="conv equilibrio">→ + &nbsp;↑ + &nbsp;↺ +</span> Reações e verificação do equilíbrio. No desenho, as setas dão o sentido real.</p>' +
      '<p><span class="conv seccao">convenção da secção</span> Diagramas e quadros de N, V e M.</p>' +
      '<div class="convencao">' + figuraConvencao() + "</div>" +
      "<p>N positivo de tração, V positivo com a resultante à esquerda para cima, M positivo a tracionar a fibra inferior (a tracejado nas barras inclinadas e verticais). A esquerda é o lado do nó onde começa s.</p>" +
      "<p>Os sinais não se comparam entre as duas: numa consola encastrada à esquerda, M<sub>A</sub> é positivo e o momento fletor em A é negativo.</p>" +
      "<h3>Classificação</h3><ul>" +
      "<li>Vigas e pórticos: g = r − 3 − e, com r reações e e rótulas (uma rótula que liga k barras conta k − 1); cada contorno fechado de barras rígidas soma 3.</li>" +
      "<li>Treliças: g = b + r − 2n, com b barras, r reações e n nós.</li>" +
      "<li>A contagem é necessária, mas não chega: o programa verifica também a disposição dos vínculos. Numa estrutura hipostática, o tracejado laranja mostra um movimento possível.</li>" +
      "<li>Isostáticas: resolvidas pelas equações de equilíbrio. Hiperestáticas: resolvidas admitindo EI e EA constantes em todas as barras; as reações dependem da rigidez, e esse cálculo não faz parte da matéria de Estática.</li></ul>" +
      '<p style="color:#7B8794;font-size:12px;margin-top:14px">Estática · 2026/2027 · Paulo Mendes. A partir do módulo de diagramas do StructuralTool (Paulo Mendes, licença MIT).</p>' +
      '<div class="botoes"><button type="button" class="principal" data-d="fechar">Fechar</button></div>';
    abrirDialogo(html, function (d) {
      d.querySelector('[data-d="fechar"]').addEventListener("click", fecharDialogo);
    }, true);
  }

  // ------------------------------------------------------------ painel lateral

  // cada quadro diz em que convenção de sinais estão os seus números
  var CONV_EQUILIBRIO = '<span class="conv equilibrio" title="Convenção das equações de equilíbrio: positivo para a direita, para cima e no sentido anti-horário">→ + &nbsp;↑ + &nbsp;↺ +</span>';
  var CONV_SECCAO = '<span class="conv seccao" title="N positivo de tração; V positivo com a resultante à esquerda para cima; M positivo a tracionar a fibra inferior">convenção da secção</span>';

  function seta4(v, eixo) {
    if (Math.abs(v) < 0.005) return "";
    if (eixo === "H") return v > 0 ? "→" : "←";
    if (eixo === "V") return v > 0 ? "↑" : "↓";
    if (eixo === "M") return v > 0 ? "↺" : "↻";
    return "";
  }

  // «viga» quando as barras estão todas sobre a mesma horizontal
  function substantivo() {
    if (trelica()) return "Treliça";
    var ns = est.modelo.nos;
    if (ns.length && ns.every(function (n) { return Math.abs(n.y - ns[0].y) < 1e-9; })) return "Viga";
    return "Estrutura";
  }

  function htmlClassificacao(res) {
    if (res.vazio) {
      return '<div class="cartao classe vazia"><div class="veredicto">Sem estrutura</div><p class="nota">Escolha <b>Barra</b> e clique em dois pontos da grelha, ou abra um dos <b>Exemplos</b>.</p></div>';
    }
    if (res.erros.length) {
      return '<div class="cartao classe erro"><div class="veredicto">Dados por corrigir</div><ul>' +
        res.erros.map(function (e) { return "<li>" + esc(e) + "</li>"; }).join("") + "</ul></div>";
    }
    var c = res.classificacao, nome = substantivo(), cont;
    if (c.trelica) {
      cont = '<div class="contagem">b = ' + c.b + " barras · r = " + c.r + " reações · n = " + c.n + " nós<br>g = b + r − 2n = <b>" + c.g + "</b></div>";
    } else {
      var f = "r − 3" + (c.partes > 1 ? "·" + c.partes : "") + " − e" + (c.aneis ? " + 3a" : "");
      cont = '<div class="contagem">r = ' + c.r + " reações · e = " + c.e + " rótula" + (c.e === 1 ? "" : "s") +
        (c.aneis ? " · a = " + c.aneis + " contorno" + (c.aneis === 1 ? "" : "s") + " fechado" + (c.aneis === 1 ? "" : "s") : "") +
        "<br>g = " + f + " = <b>" + c.g + "</b></div>";
    }
    if (c.tipo === "isostatica")
      return '<div class="cartao classe isostatica"><div class="veredicto">' + nome + " isostática</div>" + cont + "</div>";
    if (c.tipo === "hiperestatica")
      return '<div class="cartao classe hiperestatica"><div class="veredicto">' + nome + " hiperestática de grau " + c.g + "</div>" + cont +
        '<p class="nota">As reações dependem da rigidez: foram calculadas admitindo EI e EA constantes em todas as barras. Este cálculo não faz parte da matéria de Estática.</p></div>';
    return '<div class="cartao classe hipostatica"><div class="veredicto">' + nome + " hipostática</div>" + cont +
      '<p class="nota" style="color:#7A1F1F">' + esc(c.motivo) + " Sem equilíbrio para um carregamento qualquer, não há diagramas." +
      (res.mecanismo ? " O tracejado laranja mostra um movimento possível." : "") + "</p></div>";
  }

  function htmlReacoes(res) {
    var s = '<div class="cartao"><h3>Reações de apoio ' + CONV_EQUILIBRIO + "</h3>", enc = [];
    res.reacoes.forEach(function (R) {
      // num encastramento onde só chega uma barra, a reação M e o momento fletor na barra têm o mesmo valor absoluto
      if (R.tipo === "encastramento" && Math.abs(R.M) >= 0.005 && R.no !== null) {
        var lig = est.idx.ligacoes[R.no] || [];
        if (lig.length === 1) {
          var b = res.barra(lig[0]), noI = est.idx.barra[lig[0]].i === R.no;
          var Mf = b.esforcos(noI ? 0 : b.L, noI ? "dir" : "esq").M;
          enc.push(" Em " + esc(R.nome) + ": " + nomeHtml("M", R.nome) + " = " + fmt(R.M) + " kN·m; momento fletor na barra " +
            esc(b.nome) + " = " + fmt(Mf) + " kN·m.");
        }
      }
      var nome = R.nome;
      s += '<div class="apoio-cab">' + esc(nome) + " <span>· " + NOME_APOIO[R.tipo].toLowerCase() + " em " + esc(textoPonto(R)) + "</span></div>";
      function linhaR(rot, v, eixo, un) {
        return '<div class="reacao"><span>' + rot + '</span><span><span class="val">' + fmt(v) + " " + un + '</span> <span class="seta">' + seta4(v, eixo) + "</span></span></div>";
      }
      if (R.tipo === "movel") {
        if (Math.abs(R.angulo || 0) > 1e-9) {
          s += linhaR(nomeHtml("R", nome) + " (a " + fmtAng(R.angulo) + " da vertical)", R.R, "R", "kN");
          s += linhaR(nomeHtml("R", nome + "h"), R.H, "H", "kN");
          s += linhaR(nomeHtml("R", nome + "v"), R.V, "V", "kN");
        } else s += linhaR(nomeHtml("R", nome), R.V, "V", "kN");
      } else {
        s += linhaR(nomeHtml("R", nome + "h"), R.H, "H", "kN");
        s += linhaR(nomeHtml("R", nome + "v"), R.V, "V", "kN");
        if (R.tipo === "encastramento") s += linhaR(nomeHtml("M", nome), R.M, "M", "kN·m");
      }
    });
    return s + '<p class="nota">A seta dá o sentido real. Os sinais não se comparam com os de N, V e M.' + enc.join("") + "</p></div>";
  }

  function htmlEquilibrio(res) {
    var e = res.equilibrio;
    function v(nome, val, un) {
      var ok = Math.abs(val) < 0.005;
      return "<span>" + nome + " = " + fmt(val) + " " + un + ' <span class="' + (ok ? "ok" : "") + '">' + (ok ? "✓" : "✗") + "</span></span>";
    }
    return '<div class="cartao"><h3>Verificação do equilíbrio ' + CONV_EQUILIBRIO + '</h3><div class="verif">' +
      v("ΣF<sub>x</sub>", e.Fx, "kN") + v("ΣF<sub>y</sub>", e.Fy, "kN") + v("ΣM<sub>" + esc(e.ref) + "</sub>", e.M, "kN·m") +
      '</div><p class="nota">Com todas as cargas e reações. Momentos em relação a ' + esc(e.ref) + ".</p></div>";
  }

  function htmlSeccao(res) {
    var sc = est.seccao, opc = res.barras.slice().sort(function (a, b) { return a.nome < b.nome ? -1 : 1; }).map(function (b) {
      return '<option value="' + b.id + '"' + (sc && sc.barra === b.id ? " selected" : "") + ">" + esc(b.nome) + "</option>";
    }).join("");
    return '<div class="cartao cartao-seccao' + (sc ? "" : " sem-valor") + '" id="cartao-seccao"><h3>Esforços numa secção ' + CONV_SECCAO +
      '</h3><div class="seccao-entrada">barra <select id="seccao-barra">' + (sc ? "" : '<option value="">—</option>') + opc +
      '</select> s =<input type="text" inputmode="decimal" id="seccao-s" value="' + (sc ? fmt(sc.s) : "") +
      '"> m</div><div class="nota" style="margin:0 0 4px">ou clique numa barra, num diagrama</div><div id="seccao-valores"></div></div>';
  }

  function atualizarSeccao() {
    var alvo = $("seccao-valores"), res = est.res;
    if (!alvo || !res || !res.barras) return;
    $("cartao-seccao").classList.toggle("sem-valor", !est.seccao);
    if (!est.seccao) { alvo.innerHTML = ""; return; }
    var b = res.barra(est.seccao.barra);
    if (!b) { alvo.innerHTML = ""; return; }
    var sv = est.seccao.s, e = b.esforcos(sv, "esq"), d = b.esforcos(sv, "dir");
    var salto = ["N", "V", "M"].some(function (k) { return Math.abs(e[k] - d[k]) >= 0.005; }) && sv > 1e-9 && sv < b.L - 1e-9;
    var cab = "<tr><th></th><th>N (kN)</th><th>V (kN)</th><th>M (kN·m)</th></tr>";
    function lin(rot, v) { return "<tr><td>" + rot + "</td><td>" + fmt(v.N) + "</td><td>" + fmt(v.V) + "</td><td>" + fmt(v.M) + "</td></tr>"; }
    var corpo = salto ? lin('<span class="lado">à esquerda</span>', e) + lin('<span class="lado">à direita</span>', d)
      : lin("s = " + fmt(sv) + " m", sv >= b.L - 1e-9 ? e : d);
    alvo.innerHTML = '<table class="quadro">' + cab + corpo + "</table>";
  }

  function htmlMaximos(res) {
    var mx = res.maximos, s = '<div class="cartao"><h3>Valores extremos ' + CONV_SECCAO + "</h3>", varias = res.barras.length > 1;
    function lin(rot, e, un, extra) {
      if (!e) return "";
      return '<div class="linha-max"><span>' + rot + " = <b>" + fmt(e.valor) + " " + un + "</b></span><span>" + (varias ? esc(e.nome) + ", " : "") +
        "s = " + fmt(e.s) + " m" + (extra || "") + "</span></div>";
    }
    function emV0(e) {
      if (!e) return "";
      var b = res.barra(e.barra);
      return b && b.extremos.some(function (z) { return Math.abs(z.s - e.s) < 1e-6; }) ? " (V = 0)" : "";
    }
    s += lin("M máximo", mx.Mmax, "kN·m", emV0(mx.Mmax));

        linhas.push({ s: p.s, h: ["", '<span class="lado">dir.</span>', p.dir], cls: "salto-dir" });

  // para imprimir: a estrutura e os diagramas, cada um na sua figura
  function prepararImpressao() {
    var alvo = $("impressao"), camAntes = est.cam, manual = est.manual, geoAntes = est.geo;
    var vistas = trelica() ? ["estrutura", "N"] : ["estrutura", "N", "V", "M"];
    // a altura de cada figura segue a proporção da estrutura
    var W = 760, b = caixaModelo(), wx = b.x1 - b.x0, wy = b.y1 - b.y0;
    var kx = wx > 1e-6 ? (W - MARGEM.e - MARGEM.d) / wx : 80;
    var H = Math.round(clamp(MARGEM.c + MARGEM.b + wy * kx, 300, 640));
    var k = Math.min(kx, wy > 1e-6 ? (H - MARGEM.c - MARGEM.b) / wy : Infinity);
    est.cam = { k: k, ox: MARGEM.e + (W - MARGEM.e - MARGEM.d) / 2 - (b.x0 + b.x1) / 2 * k, oy: MARGEM.c + (H - MARGEM.c - MARGEM.b) / 2 + (b.y0 + b.y1) / 2 * k };
    var g = geometria();
    g.W = W; g.H = H;
    var s = "";
    vistas.forEach(function (v) {
      var tit = v === "estrutura" ? "Estrutura, cargas e reações" : NOME_VISTA[v] + " (" + UNIDADE[v] + ")";
      s += '<figure class="fig-imp"><figcaption>' + esc(tit) + "</figcaption>" + construirSvg(g, est.res, v, true) + "</figure>";

    est.cam = camAntes; est.manual = manual; est.geo = geoAntes;

      var b = ev.target.closest("[data-ferramenta]");
      if (b) escolherFerramenta(b.getAttribute("data-ferramenta"));
    });
    $("vistas").addEventListener("click", function (ev) {
      var b = ev.target.closest("[data-vista]");
      if (b) escolherVista(b.getAttribute("data-vista"));
    });
    $("tipo-estrutura").addEventListener("change", function () { mudarTipo(this.value); });
    $("grelha").addEventListener("change", function () { est.grelha = parseFloat(this.value) || 0.1; guardarLocal(); desenhar(); });
    $("ajustar").addEventListener("click", function () { alternarAjuste(); });
    $("mostrar-valores").addEventListener("change", function () { est.valores = this.checked; guardarLocal(); desenhar(); });

    document.addEventListener("click", function (ev) {
      var b = ev.target.closest("[data-acao]");
      var lista = $("lista-exemplos");
      if (ev.target.closest("[data-exemplo]")) {
        var ch = ev.target.closest("[data-exemplo]").getAttribute("data-exemplo");
        var ex = EXEMPLOS.filter(function (e) { return e.chave === ch; })[0];
        lista.hidden = true;
        if (ex) { carregarModelo(S.deViga(ex.viga), true); mostrarEstado("Exemplo: <b>" + esc(ex.nome) + "</b>. Ctrl+Z volta à estrutura anterior."); }
        return;
      }
      if (!ev.target.closest(".menu")) lista.hidden = true;
      if (!b) return;
      var acao = b.getAttribute("data-acao");
      if (acao === "exemplos") { lista.hidden = !lista.hidden; return; }
      if (acao === "desfazer") desfazer();
      else if (acao === "refazer") refazer();
      else if (acao === "limpar") {
        var tipo = est.modelo.tipo;
        alterar(function (m) { TIPOS.forEach(function (k) { m[k] = []; }); m.tipo = tipo; });
        est.sel = null; est.seccao = null; est.inicioBarra = null;
        enquadrar(); desenhar();
        mostrarEstado("Estrutura apagada. Ctrl+Z desfaz.");
      }
      else if (acao === "abrir") $("ficheiro").click();
      else if (acao === "guardar") guardarFicheiro();
      else if (acao === "imagem") exportarImagem();
      else if (acao === "imprimir") { prepararImpressao(); window.print(); }
      else if (acao === "enquadrar") { enquadrar(); desenhar(); }
      else if (acao === "ajuda") dialogoAjuda();
    });
    window.addEventListener("beforeprint", function () { if (!$("impressao").innerHTML) prepararImpressao(); });
    window.addEventListener("afterprint", function () { $("impressao").innerHTML = ""; });
    $("ficheiro").addEventListener("change", function () {
      if (this.files && this.files[0]) abrirFicheiro(this.files[0]);
      this.value = "";
    });

    document.querySelector(".separadores").addEventListener("click", function (ev) {
      var b = ev.target.closest("[data-sep]");
      if (!b) return;
      var sep = b.getAttribute("data-sep");
      Array.prototype.forEach.call(document.querySelectorAll(".separador"), function (x) { x.classList.toggle("ativo", x === b); });
      $("sep-resultados").hidden = sep !== "resultados";
      $("sep-elementos").hidden = sep !== "elementos";
    });

    $("sep-elementos").addEventListener("click", function (ev) {
      var t = ev.target.closest("button");
      if (t && t.getAttribute("data-mais")) { acrescentar(t.getAttribute("data-mais")); return; }
      if (t && t.getAttribute("data-editar")) { editar(t.getAttribute("data-editar"), +t.getAttribute("data-id")); return; }
      if (t && t.getAttribute("data-apagar")) { apagar(t.getAttribute("data-apagar"), +t.getAttribute("data-id")); return; }
      var it = ev.target.closest("[data-item]");
      if (it) { est.sel = { k: it.getAttribute("data-item"), id: +it.getAttribute("data-id") }; desenhar(); painelElementos(); }
    });
    $("sep-elementos").addEventListener("dblclick", function (ev) {
      var it = ev.target.closest("[data-item]");
      if (it) editar(it.getAttribute("data-item"), +it.getAttribute("data-id"));
    });

    $("fundo-dialogo").addEventListener("pointerdown", function (ev) { if (ev.target === this) fecharDialogo(); });

    document.addEventListener("keydown", function (ev) {
      var tag = ev.target && ev.target.tagName, emCampo = tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA";
      if (ev.key === "Escape") {
        if (est.dialogo) { fecharDialogo(); return; }
        $("lista-exemplos").hidden = true;
        if (terminarBarra()) return;
        est.sel = null; est.seccao = null;
        escolherFerramenta("selecionar");
        desenhar(); painel();
        return;
      }
      if (est.dialogo || emCampo) return;
      var mod = ev.ctrlKey || ev.metaKey;
      if (mod && (ev.key === "z" || ev.key === "Z") && !ev.shiftKey) { ev.preventDefault(); desfazer(); }
      else if (mod && (ev.key === "y" || ev.key === "Y" || ((ev.key === "z" || ev.key === "Z") && ev.shiftKey))) { ev.preventDefault(); refazer(); }
      else if (mod) return;
      else if ((ev.key === "Delete" || ev.key === "Backspace") && est.sel) { ev.preventDefault(); apagar(est.sel.k, est.sel.id); }
      else if (ev.key === "ArrowLeft" && est.sel) { ev.preventDefault(); moverSelecionado(-1, 0); }
      else if (ev.key === "ArrowRight" && est.sel) { ev.preventDefault(); moverSelecionado(1, 0); }
      else if (ev.key === "ArrowUp" && est.sel) { ev.preventDefault(); moverSelecionado(0, 1); }
      else if (ev.key === "ArrowDown" && est.sel) { ev.preventDefault(); moverSelecionado(0, -1); }
      else if (ev.key === "g" || ev.key === "G") alternarAjuste();
      else if (ev.key === "f" || ev.key === "F") { enquadrar(); desenhar(); }
      else if (ev.key === "b" || ev.key === "B") escolherFerramenta("barra");
    });

    var tempo = null;
    window.addEventListener("resize", function () {
      clearTimeout(tempo);
      tempo = setTimeout(function () { if (!est.manual) enquadrar(); desenhar(); }, 80);
    });
  }

  function iniciar() {
    construirBarra();
    ligarEventos();
    var hash = (location.hash || "").replace("#", "");
    var ex = /exemplo=([a-z]+)/.exec(hash), guardado = lerLocal(CHAVE_LOCAL), antigo = guardado ? null : lerLocal(CHAVE_V1);
    var exemplo = ex ? EXEMPLOS.filter(function (e) { return e.chave === ex[1]; })[0] : null;
    var pref = guardado || antigo;
    if (pref) {
      if (typeof pref.grelha === "number" && pref.grelha > 0) est.grelha = pref.grelha;
      if (typeof pref.ajustar === "boolean") est.ajustar = pref.ajustar;
      if (typeof pref.valores === "boolean") est.valores = pref.valores;
    }
    var mod = null;
    try {
      if (exemplo) mod = S.deViga(exemplo.viga);
      else if (hash === "vazio") mod = vazio("portico");
      else if (guardado && guardado.modelo && Array.isArray(guardado.modelo.nos)) mod = guardado.modelo;
      else if (antigo && antigo.modelo && lerNum(antigo.modelo.L) > 0) mod = S.deViga(antigo.modelo);
    } catch (e) { mod = null; }
    est.modelo = comIds(mod || S.deViga(EXEMPLOS[0].viga));
    $("grelha").value = String(est.grelha);
    if ($("grelha").value === "") { est.grelha = 0.1; $("grelha").value = "0.1"; }
    $("mostrar-valores").checked = est.valores;
    alternarAjuste(est.ajustar);
    est.res = S.resolver(est.modelo);
    est.nomes = S.nomes(est.modelo);
    indexar();
    enquadrar();
    sincronizarTipo();
    escolherFerramenta("selecionar");
    atualizar();
  }

  // para os testes da interface
  window.Diagramas = {
    estado: est,
    carregar: function (mod) { carregarModelo(mod, true); },
    viga: function (v) { carregarModelo(S.deViga(v), true); },
    modelo: function () { return JSON.parse(JSON.stringify(est.modelo)); },
    ferramenta: escolherFerramenta,
    vista: escolherVista,
    ecra: function (x, y) { var g = est.geo, r = $("area-desenho").querySelector("svg").getBoundingClientRect(), k = rcW(); return { x: r.left + g.X(x) / k, y: r.top + g.Y(y) / k }; }
  };
  function rcW() { var r = $("area-desenho").querySelector("svg").getBoundingClientRect(); return est.geo.W / r.width; }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", iniciar);
  else iniciar();
})();

</script>
</body>
</html>
