<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagramas de Esforços · Estática</title>
<style>
:root {
  --azul: #12344F;
  --azul-medio: #2E5574;
  --azul-claro: #E6EDF3;
  --dourado: #FCC000;
  --carga: #C62828;
  --reacao: #1E7B34;
  --tracao: #C62828;
  --compressao: #2E6DA4;
  --texto: #1F2933;
  --texto-2: #52606D;
  --linha: #D5DCE3;
  --fundo: #F4F6F8;
  --branco: #FFFFFF;
  --verde-fundo: #E6F4EA;
  --ambar-fundo: #FFF6DA;
  --vermelho-fundo: #FDECEC;
  font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  color: var(--texto);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { display: flex; flex-direction: column; background: var(--fundo); font-size: 14px; }
button, input, select { font: inherit; color: inherit; }

/* ---- cabeçalho */
.topo {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--azul); color: #fff; padding: 8px 16px; gap: 12px;
}
.marca { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brasao {
  width: 42px; height: 42px; border-radius: 50%; background: #fff; flex: none;
  display: flex; align-items: center; justify-content: center;
}
.brasao img { width: 38px; height: 38px; }
.titulo { font-size: 19px; font-weight: 700; letter-spacing: 0.2px; }
.subtitulo { font-size: 12px; opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.botao-topo {
  background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.5);
  border-radius: 6px; padding: 6px 12px; cursor: pointer; white-space: nowrap;
}
.botao-topo:hover { background: rgba(255,255,255,0.12); }

/* ---- barra de ferramentas */
.barra {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px;
  background: var(--branco); border-bottom: 1px solid var(--linha); padding: 6px 12px;
}
.grupo { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.ferramenta {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  width: 62px; height: 54px; padding: 3px 2px; border: 1px solid transparent; border-radius: 7px;
  background: transparent; cursor: pointer; font-size: 11px; color: var(--texto-2); gap: 2px;
}
.ferramenta svg { width: 30px; height: 26px; }
.ferramenta:hover { background: var(--azul-claro); }
.ferramenta.ativa { background: var(--azul); color: #fff; border-color: var(--azul); }
.ferramenta.ativa svg * { stroke: #fff; }
.ferramenta.ativa svg .cheio { fill: #fff; }
.campos label { display: flex; flex-direction: column; font-size: 11px; color: var(--texto-2); gap: 2px; margin-right: 6px; }
.campos label.caixa { flex-direction: row; align-items: center; gap: 6px; font-size: 13px; color: var(--texto); }
.entrada { display: flex; align-items: center; gap: 4px; color: var(--texto); font-size: 13px; }
.campos input[type=text], .campos select {
  border: 1px solid var(--linha); border-radius: 5px; padding: 4px 6px; background: #fff; font-size: 13px;
}
.campos input[type=text] { width: 72px; text-align: right; }
.acao {
  border: 1px solid var(--linha); background: #fff; border-radius: 6px; padding: 6px 10px;
  cursor: pointer; font-size: 13px; white-space: nowrap;
}
.acao:hover { background: var(--azul-claro); }
.acao.icone { font-size: 17px; line-height: 1; padding: 4px 9px; }
.acao:disabled { opacity: 0.45; cursor: default; background: #fff; }
.menu { position: relative; }
.lista-menu {
  position: absolute; top: 100%; left: 0; z-index: 20; margin-top: 4px; min-width: 290px;
  background: #fff; border: 1px solid var(--linha); border-radius: 8px; box-shadow: 0 8px 24px rgba(18,52,79,0.18);
  padding: 4px;
}
.lista-menu button {
  display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px;
  border-radius: 5px; cursor: pointer;
}
.lista-menu button:hover { background: var(--azul-claro); }
.lista-menu small { display: block; color: var(--texto-2); font-size: 11.5px; }

.alternar {
  display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--linha); background: #fff;
  border-radius: 5px; padding: 3px 8px; cursor: pointer; font-size: 13px; color: var(--texto-2);
}
.alternar:hover { background: var(--azul-claro); }
.alternar.ligado { background: var(--azul); border-color: var(--azul); color: #fff; }
.ferramenta[hidden], .vista[hidden] { display: none; }

/* ---- corpo */
.corpo { flex: 1; display: flex; min-height: 0; }
.coluna-desenho { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.barra-vista {
  display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 6px 10px; background: #fff; border-bottom: 1px solid var(--linha);
}
.vistas { display: inline-flex; border: 1px solid var(--linha); border-radius: 7px; overflow: hidden; }
.vista {
  border: 0; border-right: 1px solid var(--linha); background: #fff; padding: 6px 16px; cursor: pointer;
  font-weight: 600; color: var(--texto-2); min-width: 46px;
}
.vista:last-child { border-right: 0; }
.vista:hover { background: var(--azul-claro); }
.vista.ativa { background: var(--azul); color: #fff; }
.vista-acoes { display: flex; align-items: center; gap: 12px; }
.area-desenho { flex: 1; overflow: hidden; background: #fff; min-height: 0; touch-action: none; }
.area-desenho svg { display: block; user-select: none; -webkit-user-select: none; }
.estado {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  border-top: 1px solid var(--linha); background: #fff; padding: 6px 12px; font-size: 13px;
  color: var(--texto-2); min-height: 32px; font-variant-numeric: tabular-nums;
}
.estado b { color: var(--texto); }
.caixa-estado { display: flex; align-items: center; gap: 6px; white-space: nowrap; color: var(--texto); cursor: pointer; }
.painel {
  width: 400px; flex: none; border-left: 1px solid var(--linha); background: var(--fundo);
  display: flex; flex-direction: column; min-height: 0;
}
.separadores { display: flex; background: #fff; border-bottom: 1px solid var(--linha); }
.separador {
  flex: 1; border: 0; background: transparent; padding: 10px; cursor: pointer; font-weight: 600;
  color: var(--texto-2); border-bottom: 3px solid transparent;
}
.separador.ativo { color: var(--azul); border-bottom-color: var(--dourado); }
.conteudo-sep { flex: 1; overflow: auto; padding: 10px; }

.cartao {
  background: #fff; border: 1px solid var(--linha); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px;
}
.cartao h3 {
  margin: 0 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--azul);
  display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;
}
/* a convenção de sinais de cada quadro */
.conv {
  text-transform: none; letter-spacing: 0; font-size: 11px; font-weight: 600; white-space: nowrap;
  padding: 1px 8px; border-radius: 9px; border: 1px solid; cursor: help;
  -webkit-print-color-adjust: exact; print-color-adjust: exact;
}
.conv.equilibrio { background: var(--verde-fundo); color: var(--reacao); border-color: #B5DCC0; }
.conv.seccao { background: #E3EBF3; color: var(--azul); border-color: #BFCEDC; }
.cartao .nota { font-size: 12px; color: var(--texto-2); margin: 6px 0 0; }
.classe { border-left: 5px solid; }
.classe.isostatica { border-left-color: var(--reacao); background: var(--verde-fundo); }
.classe.hiperestatica { border-left-color: #C98A00; background: var(--ambar-fundo); }
.classe.hipostatica, .classe.erro { border-left-color: var(--carga); background: var(--vermelho-fundo); }
.classe .veredicto { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.classe .contagem { font-variant-numeric: tabular-nums; }
.classe ul { margin: 4px 0 0 18px; padding: 0; }

table.quadro { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
.quadro th { text-align: right; font-size: 11.5px; color: var(--texto-2); font-weight: 600; border-bottom: 1px solid var(--linha); padding: 3px 4px; }
.quadro td { text-align: right; padding: 3px 4px; border-bottom: 1px solid #EEF1F4; white-space: nowrap; }
.quadro th:first-child, .quadro td:first-child { text-align: left; }
.quadro td.ponto { text-align: left; color: var(--texto-2); font-size: 12px; white-space: normal; }
.quadro tr.especial td { background: #FFF9E3; }
.quadro tr.especial td.ponto { color: #8A6100; font-weight: 600; }
.quadro tr.salto-dir td { border-bottom: 1px solid var(--linha); }
.quadro .lado { color: var(--texto-2); font-size: 11px; }

.reacao { display: flex; justify-content: space-between; align-items: baseline; padding: 2px 0; font-variant-numeric: tabular-nums; }
.reacao .val { font-weight: 600; }
.reacao .seta { display: inline-block; width: 18px; text-align: center; color: var(--reacao); font-weight: 700; }
.apoio-cab { font-weight: 700; color: var(--azul); margin-top: 6px; }
.apoio-cab:first-of-type { margin-top: 0; }
.apoio-cab span { font-weight: 400; color: var(--texto-2); font-size: 12px; }
.verif { display: flex; gap: 12px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.verif span.ok { color: var(--reacao); font-weight: 700; }
.linha-max { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; font-variant-numeric: tabular-nums; }
.linha-max span:last-child { color: var(--texto-2); }
.seccao-entrada { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
.seccao-entrada input, .seccao-entrada select { border: 1px solid var(--linha); border-radius: 5px; padding: 4px 6px; background: #fff; }
.seccao-entrada input { width: 80px; text-align: right; }
.cab-barra { font-weight: 700; color: var(--azul); margin: 4px 0; font-size: 13px; }
details.barra-quadro { margin: 6px 0; }
details.barra-quadro summary { cursor: pointer; font-weight: 700; color: var(--azul); font-size: 13px; padding: 3px 0; }
.classe.vazia { border-left-color: var(--linha); }
.impressao { display: none; }

/* ---- elementos */
.grupo-el { margin-bottom: 10px; }
.grupo-el .cab { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.grupo-el .cab h3 { margin: 0; }
.mais { border: 1px solid var(--linha); background: #fff; border-radius: 5px; padding: 2px 8px; cursor: pointer; font-size: 12px; }
.mais:hover { background: var(--azul-claro); }
.item {
  display: flex; align-items: center; gap: 6px; padding: 5px 6px; border-radius: 6px; cursor: pointer;
  font-variant-numeric: tabular-nums;
}
.item:hover { background: var(--azul-claro); }
.item.sel { background: #FFF3C4; }
.item .desc { flex: 1; min-width: 0; }
.item .desc small { display: block; color: var(--texto-2); font-size: 11.5px; }
.item button { border: 0; background: transparent; cursor: pointer; padding: 2px 5px; border-radius: 4px; color: var(--texto-2); }
.item button:hover { background: #fff; color: var(--texto); }
.vazio { color: var(--texto-2); font-size: 12.5px; padding: 2px 6px; }

/* ---- diálogos */
.fundo-dialogo {
  position: fixed; inset: 0; background: rgba(18,52,79,0.35); z-index: 50;
  display: flex; align-items: center; justify-content: center; padding: 16px;
}
.fundo-dialogo[hidden] { display: none; }
.dialogo {
  background: #fff; border-radius: 10px; box-shadow: 0 16px 48px rgba(0,0,0,0.25);
  width: 100%; max-width: 440px; max-height: calc(100vh - 32px); overflow: auto; padding: 16px 18px;
}
.dialogo.largo { max-width: 680px; }
.dialogo h2 { margin: 0 0 12px; font-size: 17px; color: var(--azul); }
.dialogo h3 { font-size: 14px; color: var(--azul); margin: 16px 0 6px; }
.dialogo p, .dialogo li { line-height: 1.45; }
.dialogo ul { padding-left: 20px; }
.form { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; align-items: center; }
.form label { font-size: 13px; color: var(--texto-2); }
.form .campo { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.form input[type=text], .form select {
  border: 1px solid var(--linha); border-radius: 5px; padding: 5px 7px; font-size: 14px; background: #fff;
}
.form input[type=text] { width: 96px; text-align: right; }
.form .unidade { color: var(--texto-2); font-size: 13px; }
.opcoes { display: flex; gap: 4px; flex-wrap: wrap; }
.opcoes button {
  border: 1px solid var(--linha); background: #fff; border-radius: 5px; padding: 4px 9px; cursor: pointer; font-size: 13px;
}
.opcoes button.ativa { background: var(--azul); color: #fff; border-color: var(--azul); }
.opcoes button:disabled { opacity: 0.4; cursor: default; }
.previa { display: flex; gap: 12px; align-items: center; margin-top: 12px; padding: 8px; background: var(--fundo); border-radius: 8px; }
.previa svg { flex: none; background: #fff; border-radius: 6px; border: 1px solid var(--linha); }
.previa .info { font-size: 13px; font-variant-numeric: tabular-nums; line-height: 1.5; }
.erro-form { color: var(--carga); font-size: 13px; margin-top: 10px; min-height: 1em; }
.botoes { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.botoes button { border-radius: 6px; padding: 7px 16px; cursor: pointer; border: 1px solid var(--linha); background: #fff; }
.botoes .principal { background: var(--azul); color: #fff; border-color: var(--azul); }
.convencao { display: flex; justify-content: center; margin: 6px 0 10px; }
.convencao.pequena { justify-content: flex-start; margin: 2px 0 6px; }
kbd { border: 1px solid var(--linha); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font-size: 12px; background: var(--fundo); }

/* ---- ecrãs estreitos */
@media (max-width: 1050px) {
  .corpo { flex-direction: column; }
  .painel { width: auto; border-left: 0; border-top: 1px solid var(--linha); }
  .area-desenho { min-height: 560px; }
  .subtitulo { display: none; }
}

/* ---- impressão */
@media print {
  @page { size: A4 landscape; margin: 10mm; }
  body { background: #fff; display: block; }
  .barra, .botao-topo, .separadores, .estado, .mais, .item button, .seccao-entrada, .barra-vista, .area-desenho { display: none !important; }
  .topo { background: #fff; color: var(--azul); border-bottom: 2px solid var(--azul); padding: 0 0 6px; }
  .corpo { display: block; }
  .impressao { display: grid; grid-template-columns: 1fr 1fr; gap: 4mm 6mm; margin-top: 3mm; }
  .fig-imp { margin: 0 0 3mm; break-inside: avoid; }
  .fig-imp figcaption { font-weight: 700; color: var(--azul); font-size: 13px; margin-bottom: 2mm; }
  .fig-imp svg { width: 100%; height: auto; border: 1px solid var(--linha); }
  details.barra-quadro > summary { list-style: none; }
  .painel { width: auto; border: 0; display: block; background: #fff; }
  .conteudo-sep { overflow: visible; padding: 0; }
  #sep-elementos[hidden], #sep-resultados[hidden] { display: block !important; }
  .conteudo-sep { columns: 2; column-gap: 16px; }
  .cartao, .grupo-el { break-inside: avoid; }
  .cartao-seccao.sem-valor { display: none; }
}

</style>
</head>

      <button class="separador ativo" data-sep="resultados" role="tab">Resultados</button>
      <button class="separador" data-sep="elementos" role="tab">Elementos</button>
    </div>
    <div id="sep-resultados" class="conteudo-sep"></div>
    <div id="sep-elementos" class="conteudo-sep" hidden></div>
  </aside>

<script>
/* Diagramas de Esforços — motor de cálculo.
 *
 * Estruturas planas de barras retas no plano XY: vigas, pórticos e treliças.
 * Unidades: m e kN. Eixo x para a direita, y para cima.
 *
 * Modelo:
 *   tipo          "portico": nós rígidos, salvo onde há rótula;
 *                 "trelica": todos os nós articulados, cargas e apoios só nos nós
 *   nos           {id, x, y, nome?}
 *   barras        {id, i, j}, orientadas de i para j: da esquerda para a direita,
 *                 ou de baixo para cima se forem verticais (ver canonico)
 *   apoios        {id, em, tipo: "movel"|"fixo"|"encastramento", angulo}
 *   rotulas       {id, em}
 *   forcas        {id, em, F, alfa}        alfa a partir do eixo x, anti-horário
 *   momentos      {id, em, M, sentido: "horario"|"anti-horario"}
 *   distribuidas  {id, barra, s1, s2, q1, q2, direcao: "vertical"|"horizontal"|"perpendicular"}
 *   em = {no: id} ou {barra: id, s}, com s medido ao longo da barra a partir de i.
 *
 * Uma carga distribuída é por metro de barra. Positiva para baixo (vertical),
 * para a direita (horizontal), ou para o lado de baixo da barra (perpendicular).
 *
 * Convenções (as da sebenta, §3), em cada barra com o eixo local x de i para j
 * e o y local rodado 90° no sentido anti-horário:
 *   forças e reações    H positiva para a direita, V para cima, momentos anti-horários;
 *   esforço normal N    positivo de tração;
 *   esforço transverso V positivo quando a resultante das forças do lado de i
 *                       aponta no sentido do y local (para cima, numa barra horizontal);
 *   momento fletor M    positivo quando traciona a fibra do lado do −y local
 *                       (a fibra inferior, numa barra horizontal).
 *
 * As barras partem-se nos pontos interiores com apoios, rótulas, forças ou
 * momentos. Incógnitas: as forças na extremidade inicial de cada troço (3) e as
 * reações; equações: o equilíbrio de cada nó (3, ou 2 num nó articulado) e um
 * momento nulo em cada extremidade de troço ligada a uma rótula. A matriz de
 * equilíbrio classifica a estrutura pelo seu posto e resolve as isostáticas de
 * forma exata. As hiperestáticas resolvem-se pelo mínimo da energia
 * complementar sobre as soluções equilibradas (teorema de Menabrea), com EI e
 * EA constantes.
 */
(function (global) {
  "use strict";

  var TOL = 1e-9;
  var LETRAS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

  // ---------------------------------------------------------------- utilitários

  function rad(g) { return g * Math.PI / 180; }

  function limpa(v, escala) {
    return Math.abs(v) < 1e-12 * Math.max(1, Math.abs(escala || 1)) ? 0 : v;
  }

  function zeros(n) { var a = new Array(n); for (var i = 0; i < n; i++) a[i] = 0; return a; }

  function matriz(nl, nc) {
    var m = new Array(nl);
    for (var i = 0; i < nl; i++) m[i] = zeros(nc);
    return m;
  }

  function maxAbs(A) {
    var m = 0;
    for (var i = 0; i < A.length; i++)
      for (var j = 0; j < A[i].length; j++) m = Math.max(m, Math.abs(A[i][j]));
    return m;
  }

  function transposta(A, nc) {
    var T = matriz(nc, A.length);
    for (var i = 0; i < A.length; i++) for (var j = 0; j < nc; j++) T[j][i] = A[i][j];
    return T;
  }

  // Resolve A·x = b (A quadrada). Devolve null se A for singular.
  function resolverSistema(A0, b0) {
    var n = A0.length;
    var A = A0.map(function (l, i) { return l.concat([b0[i]]); });
    var tol = 1e-13 * Math.max(1, maxAbs(A0));
    for (var c = 0; c < n; c++) {
      var p = c;
      for (var i = c + 1; i < n; i++) if (Math.abs(A[i][c]) > Math.abs(A[p][c])) p = i;
      if (Math.abs(A[p][c]) <= tol) return null;
      var t = A[p]; A[p] = A[c]; A[c] = t;
      for (var k = c + 1; k < n; k++) {
        var f = A[k][c] / A[c][c];
        if (f !== 0) for (var j = c; j <= n; j++) A[k][j] -= f * A[c][j];
      }
    }
    var x = zeros(n);
    for (var r = n - 1; r >= 0; r--) {
      var s = A[r][n];
      for (var q = r + 1; q < n; q++) s -= A[r][q] * x[q];
      x[r] = s / A[r][r];
    }
    return x;
  }

  // Forma escalonada reduzida (Gauss-Jordan com pivotagem parcial): dá o posto,
  // uma solução particular de A·x = b e uma base do núcleo de A.
  function escalonar(A0, b0, nc) {
    var nl = A0.length;
    var A = A0.map(function (l) { return l.slice(); }), b = b0 ? b0.slice() : zeros(nl);
    var tol = 1e-10 * Math.max(1, maxAbs(A)) * Math.max(nl, nc, 1);
    var piv = [], r = 0;
    for (var c = 0; c < nc && r < nl; c++) {
      var p = r;
      for (var i = r + 1; i < nl; i++) if (Math.abs(A[i][c]) > Math.abs(A[p][c])) p = i;
      if (Math.abs(A[p][c]) <= tol) continue;
      var t = A[p]; A[p] = A[r]; A[r] = t;
      var tb = b[p]; b[p] = b[r]; b[r] = tb;
      var d = A[r][c];
      for (var j = c; j < nc; j++) A[r][j] /= d;
      b[r] /= d;
      for (var k = 0; k < nl; k++) {
        if (k === r) continue;
        var f = A[k][c];
        if (f === 0) continue;
        for (var q = c; q < nc; q++) A[k][q] -= f * A[r][q];
        b[k] -= f * b[r];
      }
      piv.push(c);
      r++;
    }
    var ePiv = zeros(nc);
    piv.forEach(function (c) { ePiv[c] = 1; });
    var particular = zeros(nc);
    piv.forEach(function (c, k) { particular[c] = b[k]; });
    var nucleo = [];
    for (var f2 = 0; f2 < nc; f2++) {
      if (ePiv[f2]) continue;
      var z = zeros(nc);
      z[f2] = 1;
      piv.forEach(function (c, k) { z[c] = -A[k][f2]; });
      nucleo.push(z);
    }
    return { posto: r, particular: particular, nucleo: nucleo };
  }

  // ---------------------------------------------------------------- ações

  // Componentes de uma força: alfa medido a partir do eixo x, sentido anti-horário.
  function componentesForca(f) {
    var a = rad(f.alfa);
    return { Fx: limpa(f.F * Math.cos(a), f.F), Fy: limpa(f.F * Math.sin(a), f.F) };
  }

  // Direção da reação de um apoio móvel: ângulo medido a partir da vertical.
  function direcaoMovel(angulo) {
    var b = rad(angulo || 0);
    return { cx: limpa(Math.sin(b)), cy: limpa(Math.cos(b)) };
  }

  function momentoAntiHorario(m) { return m.sentido === "anti-horario" ? m.M : -m.M; }

  // Versor do sentido positivo de uma carga distribuída numa barra de direção (c, s).
  function direcaoDistribuida(direcao, c, s) {
    if (direcao === "horizontal") return { ux: 1, uy: 0 };
    if (direcao === "perpendicular") return { ux: limpa(s), uy: limpa(-c) };
    return { ux: 0, uy: -1 };
  }

  // Resultante de uma carga distribuída (para o sentido positivo) e a sua posição
  // ao longo da barra.
  function resultanteDistribuida(d) {
    var l = d.s2 - d.s1, F = (d.q1 + d.q2) / 2 * l;
    var s = Math.abs(d.q1 + d.q2) > 1e-12
      ? d.s1 + l * (d.q1 + 2 * d.q2) / (3 * (d.q1 + d.q2))
      : null;
    return { F: F, s: s };
  }

  // ---------------------------------------------------------------- modelo

  function num(v, omissao) {
    var n = typeof v === "string" ? parseFloat(v.replace(",", ".")) : v;
    return isFinite(n) ? n : omissao;
  }

  function copiaEm(em) {
    if (!em) return { no: null };
    if (em.no !== undefined && em.no !== null) return { no: em.no };
    return { barra: em.barra, s: num(em.s, 0) };
  }

  // Cópia do modelo com as barras orientadas da esquerda para a direita (ou de
  // baixo para cima), as posições ao longo delas acertadas, e os pontos sobre as
  // extremidades de uma barra passados para o nó.
  function canonico(mod) {
    var m = {
      tipo: mod.tipo === "trelica" ? "trelica" : "portico",
      nos: (mod.nos || []).map(function (n) {
        var c = { id: n.id, x: num(n.x, 0), y: num(n.y, 0) };
        if (n.nome) c.nome = String(n.nome).trim();
        return c;
      }),
      barras: (mod.barras || []).map(function (b) { return { id: b.id, i: b.i, j: b.j }; }),
      apoios: (mod.apoios || []).map(function (a) {
        return { id: a.id, em: copiaEm(a.em), tipo: a.tipo, angulo: a.tipo === "movel" ? num(a.angulo, 0) : 0 };
      }),
      rotulas: (mod.rotulas || []).map(function (r) { return { id: r.id, em: copiaEm(r.em) }; }),
      forcas: (mod.forcas || []).map(function (f) { return { id: f.id, em: copiaEm(f.em), F: num(f.F, 0), alfa: num(f.alfa, 270) }; }),
      momentos: (mod.momentos || []).map(function (q) {
        return { id: q.id, em: copiaEm(q.em), M: num(q.M, 0), sentido: q.sentido === "anti-horario" ? "anti-horario" : "horario" };
      }),
      distribuidas: (mod.distribuidas || []).map(function (d) {
        var q1 = num(d.q1, 0);
        return { id: d.id, barra: d.barra, s1: num(d.s1, 0), s2: num(d.s2, 0), q1: q1, q2: num(d.q2, q1),
                 direcao: d.direcao === "horizontal" || d.direcao === "perpendicular" ? d.direcao : "vertical" };
      })
    };
    var no = {};
    m.nos.forEach(function (n) { no[n.id] = n; });
    var info = {};
    m.barras.forEach(function (b) {
      var a = no[b.i], c = no[b.j];
      if (!a || !c) return;
      var dx = c.x - a.x, dy = c.y - a.y, L = Math.hypot(dx, dy);
      var inv = L > TOL && (dx < -TOL * L || (Math.abs(dx) <= TOL * L && dy < 0));
      if (inv) { var t = b.i; b.i = b.j; b.j = t; }
      info[b.id] = { L: L, inv: inv, i: b.i, j: b.j };
    });
    function acerta(item) {
      var em = item.em;
      if (em.barra === undefined || !info[em.barra]) return;
      var bi = info[em.barra];
      var s = bi.inv ? bi.L - em.s : em.s;
      if (Math.abs(s) <= TOL * Math.max(1, bi.L)) item.em = { no: bi.i };
      else if (Math.abs(s - bi.L) <= TOL * Math.max(1, bi.L)) item.em = { no: bi.j };
      else item.em = { barra: em.barra, s: s };
    }
    m.apoios.forEach(acerta); m.rotulas.forEach(acerta); m.forcas.forEach(acerta); m.momentos.forEach(acerta);
    m.distribuidas.forEach(function (d) {
      var bi = info[d.barra];
      if (!bi || !bi.inv) return;
      var s1 = bi.L - d.s2, s2 = bi.L - d.s1, q1 = d.q2, q2 = d.q1;
      d.s1 = s1; d.s2 = s2; d.q1 = q1; d.q2 = q2;
    });
    return m;
  }

  // Uma viga da primeira versão do programa ({L, apoios: [{x}], ...}) em barras.
  function deViga(v) {
    var L = num(v.L, 0), id = 4;
    var m = { tipo: "portico", nos: [{ id: 1, x: 0, y: 0 }, { id: 2, x: L, y: 0 }], barras: [{ id: 3, i: 1, j: 2 }],
              apoios: [], rotulas: [], forcas: [], momentos: [], distribuidas: [] };
    function em(x) { x = num(x, 0); return x <= TOL ? { no: 1 } : x >= L - TOL ? { no: 2 } : { barra: 3, s: x }; }
    (v.apoios || []).forEach(function (a) { m.apoios.push({ id: id++, em: em(a.x), tipo: a.tipo, angulo: num(a.angulo, 0) }); });
    (v.rotulas || []).forEach(function (r) { m.rotulas.push({ id: id++, em: em(r.x) }); });
    (v.forcas || []).forEach(function (f) { m.forcas.push({ id: id++, em: em(f.x), F: num(f.F, 0), alfa: num(f.alfa, 270) }); });
    (v.momentos || []).forEach(function (q) { m.momentos.push({ id: id++, em: em(q.x), M: num(q.M, 0), sentido: q.sentido }); });
    (v.distribuidas || []).forEach(function (d) {
      var q1 = num(d.q1, 0);
      m.distribuidas.push({ id: id++, barra: 3, s1: num(d.x1, 0), s2: num(d.x2, 0), q1: q1, q2: num(d.q2, q1), direcao: "vertical" });
    });
    return m;
  }

  function fmtn(x) { return (Math.abs(x) < 0.005 ? 0 : x).toFixed(2).replace(".", ","); }

  // ---------------------------------------------------------------- discretização

  // Nós internos: os do modelo e os pontos interiores das barras onde há um
  // apoio, uma rótula, uma força ou um momento. Troços: as partes de cada barra
  // entre nós internos consecutivos.
  function discretizar(m, erros) {
    var P = [], idxNo = {}, info = {}, E = [];
    m.nos.forEach(function (n) {
      idxNo[n.id] = P.length;
      P.push({ x: n.x, y: n.y, no: n.id, nomeProprio: n.nome || "", barra: null, s: null, apoio: null, rotula: false,
               Fx: 0, Fy: 0, M: 0, forcas: 0, momentos: 0, pontas: 0 });
    });
    m.barras.forEach(function (b) {
      var a = P[idxNo[b.i]], c = P[idxNo[b.j]];
      var dx = c.x - a.x, dy = c.y - a.y, L = Math.hypot(dx, dy);
      info[b.id] = { b: b, L: L, c: dx / L, s: dy / L, x0: a.x, y0: a.y, interiores: [], trocos: [] };
    });

    function ponto(em, descr) {
      if (em.no !== undefined && em.no !== null) {
        if (idxNo[em.no] === undefined) { erros.push(descr + ": o nó não existe."); return -1; }
        return idxNo[em.no];
      }
      var bi = info[em.barra];
      if (!bi) { erros.push(descr + ": a barra não existe."); return -1; }
      if (!(em.s > 0 && em.s < bi.L)) { erros.push(descr + " fica fora da barra."); return -1; }
      for (var k = 0; k < bi.interiores.length; k++)
        if (Math.abs(P[bi.interiores[k]].s - em.s) <= TOL * Math.max(1, bi.L)) return bi.interiores[k];
      P.push({ x: bi.x0 + bi.c * em.s, y: bi.y0 + bi.s * em.s, no: null, nomeProprio: "", barra: em.barra, s: em.s,
               apoio: null, rotula: false, Fx: 0, Fy: 0, M: 0, forcas: 0, momentos: 0, pontas: 0 });
      bi.interiores.push(P.length - 1);
      return P.length - 1;
    }

    m.apoios.forEach(function (a) {
      var k = ponto(a.em, "Um apoio");
      if (k < 0) return;
      if (P[k].apoio) erros.push("Há dois apoios no mesmo ponto.");
      else P[k].apoio = a;
    });
    m.rotulas.forEach(function (r) {
      var k = ponto(r.em, "Uma rótula");
      if (k < 0) return;
      if (P[k].rotula) erros.push("Há duas rótulas no mesmo ponto.");
      P[k].rotula = true;
    });
    m.forcas.forEach(function (f) {
      var k = ponto(f.em, "Uma força");
      if (k < 0) return;
      var c = componentesForca(f);
      P[k].Fx += c.Fx; P[k].Fy += c.Fy; P[k].forcas++;
    });
    m.momentos.forEach(function (q) {
      var k = ponto(q.em, "Um momento");
      if (k < 0) return;
      P[k].M += momentoAntiHorario(q); P[k].momentos++;
    });

    m.barras.forEach(function (b) {
      var bi = info[b.id];
      var seq = [{ s: 0, k: idxNo[b.i] }].concat(bi.interiores.map(function (k) { return { s: P[k].s, k: k }; }))
        .concat([{ s: bi.L, k: idxNo[b.j] }]);
      seq.sort(function (p, q) { return p.s - q.s; });
      for (var t = 0; t < seq.length - 1; t++) {
        var e = { a: seq[t].k, b: seq[t + 1].k, s0: seq[t].s, l: seq[t + 1].s - seq[t].s, barra: b.id,
                  c: bi.c, s: bi.s, pecas: [] };
        bi.trocos.push(E.length);
        E.push(e);
        P[e.a].pontas++; P[e.b].pontas++;
      }
    });

    m.distribuidas.forEach(function (d) {
      var bi = info[d.barra];
      if (!bi) { erros.push("Uma carga distribuída está numa barra que não existe."); return; }
      if (!(d.s1 >= -TOL && d.s2 <= bi.L + TOL && d.s2 - d.s1 > TOL)) { erros.push("Uma carga distribuída sai da barra."); return; }
      var u = direcaoDistribuida(d.direcao, bi.c, bi.s);
      var ax = u.ux * bi.c + u.uy * bi.s, ay = -u.ux * bi.s + u.uy * bi.c;   // componentes locais do versor
      function q(s) { return d.q1 + (d.q2 - d.q1) * (s - d.s1) / (d.s2 - d.s1); }
      bi.trocos.forEach(function (ie) {
        var e = E[ie], lo = Math.max(d.s1, e.s0), hi = Math.min(d.s2, e.s0 + e.l);
        if (hi - lo <= TOL) return;
        var qa = q(lo), qb = q(hi);
        e.pecas.push({ ta: lo - e.s0, tb: hi - e.s0, wxa: qa * ax, wxb: qb * ax, wya: qa * ay, wyb: qb * ay,
                       gxa: qa * u.ux, gxb: qb * u.ux, gya: qa * u.uy, gyb: qb * u.uy });
      });
    });
    return { P: P, E: E, info: info, idxNo: idxNo };
  }

  // A parte das cargas de um troço sobre [0, t]: Wx, Wy (componentes locais) e o
  // momento Mq = ∫ (t − τ)·wy(τ) dτ. Cada peça linear parte-se em dois triângulos,
  // cada um uma força no seu centroide: exato, mesmo que a carga troque de sinal.
  function cargaAte(e, t) {
    var Wx = 0, Wy = 0, Mq = 0;
    for (var k = 0; k < e.pecas.length; k++) {
      var p = e.pecas[k], lo = p.ta, hi = Math.min(p.tb, t);
      if (hi - lo <= 1e-14) continue;
      var l = hi - lo, f = (hi - p.ta) / (p.tb - p.ta);
      var wxh = p.wxa + (p.wxb - p.wxa) * f, wyh = p.wya + (p.wyb - p.wya) * f;
      var F1x = p.wxa * l / 2, F2x = wxh * l / 2, F1y = p.wya * l / 2, F2y = wyh * l / 2;
      Wx += F1x + F2x;
      Wy += F1y + F2y;
      Mq += F1y * (t - (lo + l / 3)) + F2y * (t - (lo + 2 * l / 3));
    }
    return { Wx: Wx, Wy: Wy, Mq: Mq };
  }

  // ---------------------------------------------------------------- equilíbrio

  function montar(m, d) {
    var P = d.P, E = d.E, trelica = m.tipo === "trelica";
    P.forEach(function (p) {
      p.articulado = trelica || p.rotula;
      p.rodaApoio = !!(p.apoio && p.apoio.tipo === "encastramento");
    });
    // linhas: ΣFx, ΣFy e ΣM em cada nó (sem ΣM num nó articulado que pode rodar)
    var nl = 0;
    P.forEach(function (p) {
      p.lx = nl++; p.ly = nl++;
      p.lm = p.articulado && !p.rodaApoio ? -1 : nl++;
    });
    var libertacoes = [];
    E.forEach(function (e, ie) {
      if (P[e.a].articulado) libertacoes.push({ e: ie, ponta: "i", linha: nl++ });
      if (P[e.b].articulado) libertacoes.push({ e: ie, ponta: "j", linha: nl++ });
    });
    // colunas: as forças na extremidade inicial de cada troço, depois as reações
    var cols = [];
    var nE = 3 * E.length;
    P.forEach(function (p, k) {
      var a = p.apoio;
      if (!a) return;
      if (a.tipo === "movel") {
        var dm = direcaoMovel(a.angulo);
        cols.push({ no: k, comp: "R", termos: [[p.lx, dm.cx], [p.ly, dm.cy]] });
      } else {
        cols.push({ no: k, comp: "H", termos: [[p.lx, 1]] });
        cols.push({ no: k, comp: "V", termos: [[p.ly, 1]] });
        if (a.tipo === "encastramento") cols.push({ no: k, comp: "M", termos: [[p.lm, 1]] });
      }
    });
    var nc = nE + cols.length;
    var A = matriz(nl, nc), b = zeros(nl);

    E.forEach(function (e, ie) {
      var c = e.c, s = e.s, col = 3 * ie, pa = P[e.a], pb = P[e.b];
      var tot = cargaAte(e, e.l);
      e.Wx = tot.Wx; e.Wy = tot.Wy; e.Mq = tot.Mq;
      // nó inicial: o troço atua sobre ele com −f
      A[pa.lx][col] -= c; A[pa.lx][col + 1] += s;
      A[pa.ly][col] -= s; A[pa.ly][col + 1] -= c;
      if (pa.lm >= 0) A[pa.lm][col + 2] -= 1;
      // nó final: f_j = (−fx − Wx, −fy − Wy, l·fy − m + Mq)
      A[pb.lx][col] += c; A[pb.lx][col + 1] -= s; b[pb.lx] -= c * tot.Wx - s * tot.Wy;
      A[pb.ly][col] += s; A[pb.ly][col + 1] += c; b[pb.ly] -= s * tot.Wx + c * tot.Wy;
      if (pb.lm >= 0) { A[pb.lm][col + 1] -= e.l; A[pb.lm][col + 2] += 1; b[pb.lm] += tot.Mq; }
    });
    libertacoes.forEach(function (lb) {
      var e = E[lb.e], col = 3 * lb.e;
      if (lb.ponta === "i") A[lb.linha][col + 2] = 1;                       // M(0) = −m = 0
      else { A[lb.linha][col + 1] = e.l; A[lb.linha][col + 2] = -1; b[lb.linha] = -e.Mq; }   // M(l) = 0
    });
    cols.forEach(function (cl, k) { cl.termos.forEach(function (t) { A[t[0]][nE + k] += t[1]; }); });
    P.forEach(function (p) {
      b[p.lx] -= p.Fx; b[p.ly] -= p.Fy;
      if (p.lm >= 0) b[p.lm] -= p.M;
    });
    return { A: A, b: b, cols: cols, nl: nl, nc: nc, nE: nE, libertacoes: libertacoes };
  }

  // ---------------------------------------------------------------- classificação

  function componentesLigadas(P, E) {
    var pai = P.map(function (p, i) { return i; });
    function raiz(i) { while (pai[i] !== i) { pai[i] = pai[pai[i]]; i = pai[i]; } return i; }
    E.forEach(function (e) { pai[raiz(e.a)] = raiz(e.b); });
    var n = 0;
    P.forEach(function (p, i) { if (raiz(i) === i) n++; });
    return n;
  }

  function classificar(m, d, eq) {
    var P = d.P, E = d.E, trelica = m.tipo === "trelica";
    var r = eq.cols.length;
    var esc = escalonar(eq.A, eq.b, eq.nc);
    var rho = esc.posto;
    var C = componentesLigadas(P, E), aneis = E.length - P.length + C;
    var e = 0;
    P.forEach(function (p) { if (p.articulado) e += p.pontas - (p.rodaApoio ? 0 : 1); });
    var b = m.barras.length, n = m.nos.length;
    var g = trelica ? b + r - 2 * n : r - 3 * C - e + 3 * aneis;
    var direcoes = [];
    eq.cols.forEach(function (cl) {
      if (cl.comp === "M") return;
      var vx = 0, vy = 0;
      cl.termos.forEach(function (t) { if (t[0] === P[cl.no].lx) vx = t[1]; else if (t[0] === P[cl.no].ly) vy = t[1]; });
      direcoes.push([vx, vy]);
    });
    var horizontal = direcoes.some(function (v) { return Math.abs(v[0]) > 1e-12; });
    var paralelas = direcoes.length > 0 && direcoes.every(function (v) {
      return Math.abs(v[0] * direcoes[0][1] - v[1] * direcoes[0][0]) < 1e-12;
    }) && !eq.cols.some(function (cl) { return cl.comp === "M"; });
    var tipo, motivo = "";
    if (rho < eq.nl) {
      tipo = "hipostatica";
      var quem = trelica ? "as barras e os apoios estão mal dispostos" : "os vínculos estão mal dispostos";
      if (r === 0) motivo = "Não há apoios.";
      else if (g < 0) motivo = "Faltam ligações: a contagem dá g = " + g + ".";
      else if (C > 1) motivo = "A estrutura tem partes separadas, e cada uma precisa dos seus apoios.";
      else if (!horizontal) motivo = "A contagem dá g = " + g + ", mas nenhum apoio impede o movimento horizontal.";
      else if (paralelas) motivo = "A contagem dá g = " + g + ", mas as reações são todas paralelas.";
      else motivo = "A contagem dá g = " + g + ", mas " + quem + ": há um movimento que nenhum deles impede.";
    } else if (eq.nc === rho) tipo = "isostatica";
    else tipo = "hiperestatica";
    return {
      tipo: tipo, r: r, e: e, b: b, n: n, aneis: aneis, partes: C, g: g,
      posto: rho, equacoes: eq.nl, incognitas: eq.nc, trelica: trelica,
      malDispostos: tipo === "hipostatica" && g >= 0, semHorizontal: !horizontal,
      motivo: motivo, _esc: esc
    };
  }

  // Um movimento possível de uma estrutura hipostática: um vetor do núcleo de Aᵀ,
  // lido nas linhas ΣFx e ΣFy de cada nó (trabalho virtual).
  function mecanismo(d, eq) {
    var AT = transposta(eq.A, eq.nc);
    var esc = escalonar(AT, null, eq.nl);
    if (!esc.nucleo.length) return null;
    var melhor = null;
    esc.nucleo.forEach(function (v) {
      var mx = 0;
      d.P.forEach(function (p) { mx = Math.max(mx, Math.hypot(v[p.lx], v[p.ly])); });
      if (mx > 1e-9 && !melhor) melhor = { v: v, mx: mx };
    });
    if (!melhor) return null;
    return {
      nos: d.P.map(function (p) { return { x: p.x, y: p.y, dx: melhor.v[p.lx] / melhor.mx, dy: melhor.v[p.ly] / melhor.mx }; }),
      trocos: d.E.map(function (e) { return [e.a, e.b]; })
    };
  }

  // ---------------------------------------------------------------- hiperestáticas

  var GP = [-0.906179845938664, -0.538469310105683, 0, 0.538469310105683, 0.906179845938664];
  var GW = [0.236926885056189, 0.478628670499366, 0.568888888888889, 0.478628670499366, 0.236926885056189];

  // Energia complementar de cada troço, U = ½ fᵀQf + qᵀf + c, com N = −fx − Wx(t)
  // e M = t·fy − m + Mq(t).
  function energiaTroco(e, EA, EI) {
    var Q = [[e.l / EA, 0, 0], [0, e.l * e.l * e.l / 3 / EI, -e.l * e.l / 2 / EI], [0, -e.l * e.l / 2 / EI, e.l / EI]];
    var q = [0, 0, 0];
    var cortes = [0, e.l];
    e.pecas.forEach(function (p) { cortes.push(p.ta, p.tb); });
    cortes.sort(function (a, b) { return a - b; });
    for (var k = 0; k < cortes.length - 1; k++) {
      var a = cortes[k], b = cortes[k + 1];
      if (b - a <= 1e-14) continue;
      for (var g = 0; g < 5; g++) {
        var t = a + (b - a) * (GP[g] + 1) / 2, w = GW[g] * (b - a) / 2;
        var c = cargaAte(e, t);
        q[0] += c.Wx / EA * w;
        q[1] += t * c.Mq / EI * w;
        q[2] -= c.Mq / EI * w;
      }
    }
    return { Q: Q, q: q };
  }

  function resolverHiperestatica(d, eq, esc, EA, EI) {
    var Z = esc.nucleo, up = esc.particular, nE = eq.nE, gdim = Z.length;
    var en = d.E.map(function (e) { return energiaTroco(e, EA, EI); });
    // Q·v para um vetor v (só as colunas dos troços têm energia)
    function Qv(v) {
      var out = zeros(v.length);
      for (var ie = 0; ie < d.E.length; ie++) {
        var Q = en[ie].Q, o = 3 * ie;
        for (var i = 0; i < 3; i++) out[o + i] = Q[i][0] * v[o] + Q[i][1] * v[o + 1] + Q[i][2] * v[o + 2];
      }
      return out;
    }
    function dot(a, b, n) { var s = 0; for (var i = 0; i < n; i++) s += a[i] * b[i]; return s; }
    var QZ = Z.map(Qv), Qup = Qv(up), qv = zeros(nE);
    en.forEach(function (x, ie) { qv[3 * ie] = x.q[0]; qv[3 * ie + 1] = x.q[1]; qv[3 * ie + 2] = x.q[2]; });
    var H = matriz(gdim, gdim), rhs = zeros(gdim);
    for (var i = 0; i < gdim; i++) {
      for (var j = 0; j < gdim; j++) H[i][j] = dot(Z[i], QZ[j], nE);
      rhs[i] = -(dot(Z[i], Qup, nE) + dot(Z[i], qv, nE));
    }
    var x = resolverSistema(H, rhs);
    if (!x) return null;
    var u = up.slice();
    for (var k = 0; k < gdim; k++) for (var c = 0; c < u.length; c++) u[c] += x[k] * Z[k][c];
    return u;
  }

  // ---------------------------------------------------------------- esforços

  function esforcoTroco(e, f, t) {
    var c = cargaAte(e, t);
    return { N: -f[0] - c.Wx, V: f[1] + c.Wy, M: t * f[1] - f[2] + c.Mq };
  }

  // Zeros de V num intervalo sem pontos notáveis no interior: V é aí um polinómio
  // de grau ≤ 2, que fica definido por três valores.
  function zerosV(esf, a, b, escala) {
    var V0 = esf(a, "dir").V, Vm = esf((a + b) / 2).V, V1 = esf(b, "esq").V;
    var c0 = V0, c2 = 2 * (V1 - 2 * Vm + V0), c1 = V1 - V0 - c2;
    var tol = 1e-9 * Math.max(1, escala), ts = [];
    if (Math.abs(c0) <= tol && Math.abs(c1) <= tol && Math.abs(c2) <= tol) return [];
    if (Math.abs(c2) <= tol) {
      if (Math.abs(c1) > tol) ts.push(-c0 / c1);
    } else {
      var disc = c1 * c1 - 4 * c2 * c0;
      if (disc >= 0) {
        var s = Math.sqrt(disc);
        ts.push((-c1 - s) / (2 * c2), (-c1 + s) / (2 * c2));
      }
    }
    ts.sort(function (p, q) { return p - q; });
    return ts.filter(function (t, i) { return t > 1e-7 && t < 1 - 1e-7 && (i === 0 || t - ts[i - 1] > 1e-9); })
      .map(function (t) { return a + t * (b - a); });
  }

  // Zeros de M no interior de um intervalo (M é aí um polinómio de grau ≤ 3).
  function zerosM(esf, a, b, escala) {
    var n = 64, tol = 1e-9 * Math.max(1, escala), out = [];
    function Mx(x) { return x <= a ? esf(a, "dir").M : x >= b ? esf(b, "esq").M : esf(x).M; }
    var xs = [], ms = [];
    for (var i = 0; i <= n; i++) { var x = a + (b - a) * i / n; xs.push(x); ms.push(Mx(x)); }
    if (ms.every(function (v) { return Math.abs(v) <= tol; })) return [];
    for (var k = 0; k < n; k++) {
      var m0 = ms[k], m1 = ms[k + 1];
      if (Math.abs(m0) <= tol) {
        if (k > 0 && Math.abs(ms[k - 1]) > tol && Math.abs(m1) > tol) out.push(xs[k]);
        continue;
      }
      if (Math.abs(m1) <= tol || (m0 < 0) === (m1 < 0)) continue;
      var lo = xs[k], hi = xs[k + 1];
      for (var it = 0; it < 80; it++) {
        var mid = (lo + hi) / 2, mm = Mx(mid);
        if ((mm < 0) === (m0 < 0)) lo = mid; else hi = mid;
      }
      out.push((lo + hi) / 2);
    }
    return out.filter(function (x) { return x > a + 1e-7 * (b - a) && x < b - 1e-7 * (b - a); });
  }

  // ---------------------------------------------------------------- nomes

  // Letras para os nós e para os pontos interiores com apoio ou rótula, da
  // esquerda para a direita (e de baixo para cima); um nome escrito à mão fica.
  function darNomes(d) {
    var nomeados = d.P.filter(function (p) { return p.no !== null || p.apoio || p.rotula; });
    var usados = {};
    nomeados.forEach(function (p) {
      if (p.nomeProprio) {
        var n = p.nomeProprio, k = 1;
        while (usados[n]) n = p.nomeProprio + "'".repeat(k++);
        p.nome = n; usados[n] = true;
      }
    });
    var ordem = nomeados.slice().sort(function (p, q) {
      var dx = Math.round(p.x * 1e6) - Math.round(q.x * 1e6);
      return dx !== 0 ? dx : Math.round(p.y * 1e6) - Math.round(q.y * 1e6);
    });
    var i = 0;
    function proxima() {
      for (;;) {
        var n = i < LETRAS.length ? LETRAS[i] : LETRAS[i % LETRAS.length] + Math.floor(i / LETRAS.length);
        i++;
        if (!usados[n]) { usados[n] = true; return n; }
      }
    }
    ordem.forEach(function (p) { if (!p.nome) p.nome = proxima(); });
  }

  // Os nomes, sem resolver: servem o desenho, mesmo com o modelo por acabar.
  function nomes(mod) {
    var m = canonico(mod), existe = {};
    m.nos.forEach(function (n) { existe[n.id] = n; });
    m.barras = m.barras.filter(function (b) {
      return existe[b.i] && existe[b.j] && b.i !== b.j &&
        Math.hypot(existe[b.j].x - existe[b.i].x, existe[b.j].y - existe[b.i].y) > 1e-9;
    });
    var d = discretizar(m, []);
    darNomes(d);
    var out = { nos: {}, pontos: [] };
    d.P.forEach(function (p) {
      if (p.no !== null) out.nos[p.no] = p.nome;
      else if (p.nome) out.pontos.push({ barra: p.barra, s: p.s, nome: p.nome });
    });
    return out;
  }

  // ---------------------------------------------------------------- validação

  function validar(m) {
    var erros = [], trelica = m.tipo === "trelica";
    if (!m.barras.length) { erros.push("Não há barras."); return erros; }
    var no = {};
    m.nos.forEach(function (n) {
      if (!isFinite(n.x) || !isFinite(n.y)) erros.push("Um nó tem coordenadas inválidas.");
      no[n.id] = n;
    });
    for (var a = 0; a < m.nos.length; a++)
      for (var b = a + 1; b < m.nos.length; b++)
        if (Math.hypot(m.nos[a].x - m.nos[b].x, m.nos[a].y - m.nos[b].y) < 1e-6)
          erros.push("Há dois nós no mesmo ponto (" + fmtn(m.nos[a].x) + "; " + fmtn(m.nos[a].y) + ").");
    var pares = {}, ligados = {};
    m.barras.forEach(function (br) {
      if (!no[br.i] || !no[br.j]) { erros.push("Uma barra liga a um nó que não existe."); return; }
      if (br.i === br.j || Math.hypot(no[br.j].x - no[br.i].x, no[br.j].y - no[br.i].y) < 1e-6) { erros.push("Há uma barra de comprimento nulo."); return; }
      var ch = Math.min(br.i, br.j) + "-" + Math.max(br.i, br.j);
      if (pares[ch]) erros.push("Há duas barras entre os mesmos nós.");
      pares[ch] = true;
      ligados[br.i] = ligados[br.j] = true;
    });
    m.nos.forEach(function (n) { if (!ligados[n.id]) erros.push("Há um nó que não está ligado a nenhuma barra."); });
    m.apoios.forEach(function (ap) {
      if (["movel", "fixo", "encastramento"].indexOf(ap.tipo) < 0) erros.push("Tipo de apoio desconhecido: " + ap.tipo + ".");
      if (ap.tipo === "movel" && Math.abs(ap.angulo) > 90 + TOL) erros.push("A reação de um apoio móvel faz com a vertical um ângulo entre -90° e 90°.");
    });
    m.distribuidas.forEach(function (d) {
      if (d.s2 - d.s1 <= TOL) erros.push("Numa carga distribuída, o fim tem de vir depois do início.");
    });
    if (trelica) {
      var dentro = function (it) { return it.em.barra !== undefined; };
      if (m.apoios.some(dentro) || m.forcas.some(dentro)) erros.push("Numa treliça, os apoios e as cargas ficam nos nós.");
      if (m.apoios.some(function (ap) { return ap.tipo === "encastramento"; })) erros.push("Numa treliça, os apoios são móveis ou fixos.");
      if (m.momentos.length) erros.push("Numa treliça não há momentos aplicados: as barras só têm esforço axial.");
      if (m.distribuidas.length) erros.push("Numa treliça, as cargas atuam nos nós: não há cargas distribuídas.");
    }
    return erros;
  }

  // ---------------------------------------------------------------- resolver

  function resolver(modelo) {
    var m = canonico(modelo);
    var erros = validar(m);
    var res = { modelo: m, erros: erros, vazio: !m.barras.length };
    if (erros.length) return res;

    var d = discretizar(m, erros);
    if (erros.length) return res;
    // validações que precisam dos nós internos
    d.P.forEach(function (p) {
      if (m.tipo !== "trelica" && p.rotula && p.pontas < 2) erros.push("Uma rótula tem de ligar duas barras, e num dos pontos só chega uma.");
      if ((m.tipo === "trelica" || p.rotula) && !(p.apoio && p.apoio.tipo === "encastramento") && Math.abs(p.M) > 0)
        erros.push("Um momento não pode atuar sobre uma rótula: ponha-o numa das barras.");
    });
    if (erros.length) return res;
    darNomes(d);
    res.pontos = d.P.filter(function (p) { return !!p.nome; }).map(function (p) {
      return { nome: p.nome, x: p.x, y: p.y, no: p.no, barra: p.barra, s: p.s, apoio: !!p.apoio, rotula: p.rotula };
    });
    var nomeNo = {};
    d.P.forEach(function (p) { if (p.no !== null) nomeNo[p.no] = p.nome; });
    res.nomesNos = nomeNo;

    var eq = montar(m, d);
    var cls = classificar(m, d, eq);
    res.classificacao = cls;
    res.resultantes = m.distribuidas.map(resultanteDistribuida);
    if (cls.tipo === "hipostatica") { res.mecanismo = mecanismo(d, eq); return res; }

    // escala das ações, para as tolerâncias
    var Lc = 0, x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    m.nos.forEach(function (n) { x0 = Math.min(x0, n.x); x1 = Math.max(x1, n.x); y0 = Math.min(y0, n.y); y1 = Math.max(y1, n.y); });
    Lc = Math.max(Math.hypot(x1 - x0, y1 - y0), 1e-6);
    var escala = 1;
    m.forcas.forEach(function (f) { escala = Math.max(escala, Math.abs(f.F)); });
    m.momentos.forEach(function (q) { escala = Math.max(escala, Math.abs(q.M) / Lc); });
    m.distribuidas.forEach(function (q) { escala = Math.max(escala, (Math.abs(q.q1) + Math.abs(q.q2)) * (q.s2 - q.s1)); });
    var escalaM = escala * Lc;

    var u;
    if (cls.tipo === "isostatica") u = cls._esc.particular;
    else {
      var EI = 1, EA = 1e6 / (Lc * Lc);
      res.rigidez = { EI: EI, EA: EA };
      u = resolverHiperestatica(d, eq, cls._esc, EA, EI);
    }
    if (!u) {
      cls.tipo = "hipostatica";
      cls.motivo = "O sistema de equações é singular: os vínculos não impedem todos os movimentos.";
      return res;
    }

    // reações
    var reac = [], porNo = {};
    d.P.forEach(function (p, k) {
      if (!p.apoio) return;
      porNo[k] = reac.length;
      reac.push({ id: p.apoio.id, nome: p.nome, x: p.x, y: p.y, no: p.no, barra: p.barra, s: p.s,
                  tipo: p.apoio.tipo, angulo: p.apoio.angulo, H: 0, V: 0, M: 0, R: 0 });
    });
    eq.cols.forEach(function (cl, k) {
      var R = reac[porNo[cl.no]], v = u[eq.nE + k];
      if (cl.comp === "R") {
        var dm = direcaoMovel(R.angulo);
        R.R = v; R.H = v * dm.cx; R.V = v * dm.cy;
      } else R[cl.comp] = v;
    });
    reac.forEach(function (r) {
      ["H", "V", "M", "R"].forEach(function (k) { r[k] = limpa(r[k], k === "M" ? escalaM * 1e3 : escala * 1e3); });
    });
    res.reacoes = reac;

    // esforços, barra a barra
    var fT = d.E.map(function (e, ie) { return [u[3 * ie], u[3 * ie + 1], u[3 * ie + 2]]; });
    function limpo(v) { return { N: limpa(v.N, escala * 1e3), V: limpa(v.V, escala * 1e3), M: limpa(v.M, escalaM * 1e3) }; }
    var barras = [], porBarra = {};
    m.barras.forEach(function (br) {
      var bi = d.info[br.id], tr = bi.trocos;
      function esf(s, lado) {
        var dir = lado !== "esq", k = 0;
        if (dir) { while (k < tr.length - 1 && s >= d.E[tr[k]].s0 + d.E[tr[k]].l - TOL) k++; }
        else { while (k < tr.length - 1 && s > d.E[tr[k]].s0 + d.E[tr[k]].l + TOL) k++; }
        var e = d.E[tr[k]], t = Math.max(0, Math.min(e.l, s - e.s0));
        return limpo(esforcoTroco(e, fT[tr[k]], t));
      }
      // pontos notáveis
      var lista = [];
      function junta(s, motivo, nome) {
        for (var i = 0; i < lista.length; i++)
          if (Math.abs(lista[i].s - s) <= TOL * Math.max(1, bi.L)) {
            if (motivo && lista[i].motivos.indexOf(motivo) < 0) lista[i].motivos.push(motivo);
            if (nome && !lista[i].nome) lista[i].nome = nome;
            return;
          }
        lista.push({ s: s, motivos: motivo ? [motivo] : [], nome: nome || "" });
      }
      function descrever(p) {
        var t = [];
        if (p.apoio) t.push("apoio");
        if (p.rotula) t.push("rótula");
        if (p.forcas) t.push(p.forcas > 1 ? "forças" : "força");
        if (p.momentos) t.push("momento");
        return t;
      }
      [0].concat(tr.map(function (ie) { return d.E[ie].s0 + d.E[ie].l; })).forEach(function (s, k) {
        var p = k === 0 ? d.P[d.E[tr[0]].a] : d.P[d.E[tr[k - 1]].b];
        var ds = descrever(p);
        if (!ds.length) ds = [p.no === null ? "" : p.pontas === 1 ? "extremidade" : "nó"];
        ds.forEach(function (t) { junta(s, t, p.nome); });
      });
      m.distribuidas.forEach(function (q) {
        if (q.barra !== br.id) return;
        junta(q.s1, "início de carga");

  function atualizar() {
    est.res = S.resolver(est.modelo);
    est.nomes = S.nomes(est.modelo);
    indexar();
    if (est.sel && !acharElemento(est.sel.k, est.sel.id)) est.sel = null;
    if (est.seccao && (!est.idx.barra[est.seccao.barra] || est.seccao.s > est.idx.geo[est.seccao.barra].L)) est.seccao = null;
    guardarLocal();
    garantirVisivel();
    desenhar();
    painel();
    atualizarBotoes();
  }

  function recalcular() {
    est.res = S.resolver(est.modelo);
    est.nomes = S.nomes(est.modelo);
    indexar();
    agendar();
  }

  function trelica() { return est.modelo.tipo === "trelica"; }

  // ------------------------------------------------------------ vista: escala e enquadramento

  function tamanhoArea() {

  }

  function caixaModelo() {

    var b = { x0: Infinity, x1: -Infinity, y0: Infinity, y1: -Infinity };

  }

  function geometria() {
    var t = tamanhoArea(), c = est.cam;
    var g = { W: t.W, H: t.H, k: c.k, ox: c.ox, oy: c.oy };

    g.Y = function (y) { return c.oy - y * c.k; };
    g.xDe = function (px) { return (px - c.ox) / c.k; };
    g.yDe = function (py) { return (c.oy - py) / c.k; };

  }

  // ---- primitivas SVG

  function linha(x1, y1, x2, y2, cor, esp, extra) {
    return '<line x1="' + r1(x1) + '" y1="' + r1(y1) + '" x2="' + r1(x2) + '" y2="' + r1(y2) +
      '" stroke="' + cor + '" stroke-width="' + esp + '"' + (extra || "") + "/>";
  }

      '<polygon points="' + r1(x2) + "," + r1(y2) + " " + r1(bx - uy * w) + "," + r1(by + ux * w) + " " +
      r1(bx + uy * w) + "," + r1(by - ux * w) + '" fill="' + cor + '"/>';

  // arco de (cx, cy), ângulos de ecrã em graus (y para baixo: a crescer = horário), com seta no fim

      '<polygon points="' + r1(ex) + "," + r1(ey) + " " + r1(bx - uy * w) + "," + r1(by + ux * w) + " " +
      r1(bx + uy * w) + "," + r1(by - ux * w) + '" fill="' + cor + '"/>';

    o = o || {};
    return '<text x="' + r1(x) + '" y="' + r1(y) + '" font-size="' + (o.tam || 12) + '" fill="' + (o.cor || COR.texto) +
      '" text-anchor="' + (o.ancora || "middle") + '"' + (o.peso ? ' font-weight="' + o.peso + '"' : "") +
      (o.halo ? ' stroke="#fff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"' : "") +
      (o.estilo ? ' font-style="' + o.estilo + '"' : "") + ">" + t + "</text>";

    return '<rect x="' + r1(x) + '" y="' + r1(y) + '" width="' + r1(w) + '" height="' + r1(h) +

    if (maior < p) maior = p * 5;
    var xa = Math.floor(g.xDe(0) / p) * p, xb = g.xDe(g.W), ya = Math.floor(g.yDe(g.H) / p) * p, yb = g.yDe(0);

    var nx = 0;
    for (var x = xa; x <= xb && nx < 600; x += p, nx++) {

    for (var x2 = Math.ceil(g.xDe(30) / passoTxt) * passoTxt; x2 <= g.xDe(g.W - 10); x2 += passoTxt)
      s.push(texto(g.X(x2), 12, fmt(x2, passoTxt < 1 ? 1 : 0), { tam: 10, cor: "#A3ADB8" }));
    for (var y2 = Math.ceil(g.yDe(g.H - 10) / passoTxt) * passoTxt; y2 <= g.yDe(22); y2 += passoTxt)
      s.push(texto(4, g.Y(y2) + 3.5, fmt(y2, passoTxt < 1 ? 1 : 0), { tam: 10, cor: "#A3ADB8", ancora: "start" }));
    s.push(texto(g.W - 6, 12, "x, y (m)", { tam: 10, cor: "#A3ADB8", ancora: "end" }));

  // ------------------------------------------------------------ desenho da estrutura

  // direções (no ecrã) das barras que saem de um ponto
  function direcoesNoPonto(em) {

      (ix.ligacoes[em.no] || []).forEach(function (bid) {
        var gb = ix.geo[bid];
        if (!gb) return;
        var sg = gb.i === em.no ? 1 : -1;
        out.push({ x: gb.c * sg, y: -gb.s * sg });
      });
    } else {
      var gb = ix.geo[em.barra];
      if (gb) { out.push({ x: gb.c, y: -gb.s }); out.push({ x: -gb.c, y: gb.s }); }
    }
    return out;
  }

  // o que já ocupa a vizinhança de um ponto (direções no ecrã): barras, cargas distribuídas
  // das barras que lá chegam, e as setas das forças aplicadas nele
  function ocupacaoDoPonto(em) {
    var m = est.modelo, ix = est.idx, barras = direcoesNoPonto(em), lados = [];
    var aqui = emNo(em) ? ix.ligacoes[em.no] || [] : [em.barra];
    m.distribuidas.forEach(function (d) {
      if (aqui.indexOf(d.barra) < 0) return;
      var gb = ix.geo[d.barra], u = S.direcaoDistribuida(d.direcao, gb.c, gb.s);
      lados.push({ x: -u.ux, y: u.uy });
    });
    m.forcas.forEach(function (f) {
      if (!mesmoPonto(f.em, em)) return;
      var c = S.componentesForca(f), F = Math.hypot(c.Fx, c.Fy);
      if (F < 1e-12) return;
      var ux = c.Fx / F, uy = -c.Fy / F, horizontal = Math.abs(c.Fy) <= 1e-9 * F;
      lados.push(horizontal || c.Fy < 0 ? { x: -ux, y: -uy } : { x: ux, y: uy });

    if (m.momentos.some(function (q) { return mesmoPonto(q.em, em); })) lados.push({ x: 0.7, y: -0.7 });
    return { barras: barras, lados: lados };
  }

  // onde escrever o nome de um ponto: ao lado do apoio, como na sebenta, ou na
  // direção mais afastada das barras e das cargas
  function lugarDoNome(em, apoio) {
    if (apoio && apoio.tipo !== "encastramento") return { dx: -19, dy: 17, ancora: "end" };
    if (apoio) {
      var f = ladoDeFora(em);
      if (f.x !== 0) return { dx: f.x * 30, dy: -22, ancora: f.x < 0 ? "end" : "start" };
      return { dx: -26, dy: f.y > 0 ? 20 : -12, ancora: "end" };
    }
    var oc = ocupacaoDoPonto(em), melhor = null;
    for (var k = 0; k < 8; k++) {
      var a = (225 - k * 45) * Math.PI / 180, d = { x: Math.cos(a), y: -Math.sin(a) };
      var nota = Math.PI;
      oc.barras.forEach(function (u) { nota = Math.min(nota, Math.acos(clamp(u.x * d.x + u.y * d.y, -1, 1))); });
      oc.lados.forEach(function (u) { if (u.x * d.x + u.y * d.y > 0.25) nota -= 2; });
      if (k === 0) nota += 0.05;
      if (!melhor || nota > melhor.nota + 1e-9) melhor = { nota: nota, d: d };
    }
    var dd = melhor.d;
    return { dx: dd.x * 17, dy: dd.y * 17 + 5, ancora: dd.x > 0.3 ? "start" : dd.x < -0.3 ? "end" : "middle" };
  }

  function desenharNome(g, em, nome, col, apoio) {
    var p = posicao(em);
    if (!p || !nome) return "";
    var l = lugarDoNome(em, apoio), x = g.X(p.x) + l.dx, y = g.Y(p.y) + l.dy;
    col.por(caixaTexto(x, y, nome, 14, l.ancora));
    return texto(x, y, esc(nome), { tam: 14, peso: 700, cor: COR.azul, ancora: l.ancora, halo: true });
  }

  // lado de fora de um encastramento: oposto às barras, acertado a um dos quatro eixos
  function ladoDeFora(em) {
    var dirs = direcoesNoPonto(em), sx = 0, sy = 0;
    if (!emNo(em)) return { x: 0, y: 1 };
    dirs.forEach(function (u) { sx += u.x; sy += u.y; });
    var l = Math.hypot(sx, sy);
    if (l < 1e-6) return { x: 0, y: 1 };
    sx = -sx / l; sy = -sy / l;
    return Math.abs(sx) > Math.abs(sy) ? { x: sx > 0 ? 1 : -1, y: 0 } : { x: 0, y: sy > 0 ? 1 : -1 };
  }

  function desenharApoio(g, a, cinza) {
    var p = posicao(a.em);
    if (!p) return "";
    var x = g.X(p.x), y0 = g.Y(p.y), s = "", az = cinza ? COR.cinza : COR.azul, i;
    if (a.tipo === "encastramento") {
      var f = ladoDeFora(a.em);
      if (eSel("apoios", a.id)) s += realce(x - 24, y0 - 24, 48, 48);
      if (f.x !== 0) {
        s += linha(x, y0 - 20, x, y0 + 20, az, 4);
        for (i = 0; i < 6; i++) { var yy = y0 - 18 + i * 7.2; s += linha(x, yy, x + f.x * 9, yy + 9, az, 1.3); }
      } else {
        s += linha(x - 20, y0, x + 20, y0, az, 4);
        for (i = 0; i < 6; i++) { var xx = x - 18 + i * 7.2; s += linha(xx, y0, xx + 9 * (f.y > 0 ? -1 : 1), y0 + f.y * 9, az, 1.3); }
      }
      s += '<rect x="' + r1(x - 18) + '" y="' + r1(y0 - 22) + '" width="36" height="44" fill="transparent"/>';
    } else {
      if (eSel("apoios", a.id)) s += realce(x - 22, y0 - 6, 44, 40);
      var ang = a.tipo === "movel" ? (a.angulo || 0) : 0;
      var t = '<polygon points="' + r1(x) + "," + r1(y0 + 3) + " " + r1(x - 11) + "," + r1(y0 + 21) + " " + r1(x + 11) + "," + r1(y0 + 21) +
        '" fill="#fff" stroke="' + az + '" stroke-width="1.8" stroke-linejoin="round"/>';
      var base = a.tipo === "movel" ? y0 + 26 : y0 + 21;

  function reacaoDoApoio(id) {
    if (!est.res || !est.res.reacoes) return null;

  // setas das reações; os rótulos vão num bloco por baixo do apoio
  function desenharReacao(g, a, R, nome, blocos) {

    var temH = Math.abs(R.H) >= 0.005, temV = Math.abs(R.V) >= 0.005, temM = Math.abs(R.M) >= 0.005;
    var inclinado = a.tipo === "movel" && Math.abs(a.angulo || 0) > 1e-9;

      }
      if (a.tipo === "movel") linhas.push(nomeSvg("R", nome, " = " + fmt(Math.abs(R.V)) + " kN"));

        if (temH) s += R.H > 0 ? seta(x - 58, y0 + 46, x - 6, y0 + 46, vd, 2.2) : seta(x + 58, y0 + 46, x + 6, y0 + 46, vd, 2.2);

  }

  function colocarBlocos(g, blocos, col) {

        y += 14;

      b.linhas.forEach(function (l, i) {
        s += texto(x0 + b.w / 2, y + i * 14, l, { tam: 12, cor: COR.reacao, peso: i === 0 ? 600 : 500, halo: true });

  function desenharRotula(g, rt) {

    var minx = Math.min(cabeca[0], cauda[0]), maxx = Math.max(cabeca[0], cauda[0]);
    var miny = Math.min(cabeca[1], cauda[1]), maxy = Math.max(cabeca[1], cauda[1]);
    if (eSel("forcas", f.id)) s += realce(minx - 12, miny - 12, maxx - minx + 24, maxy - miny + 18);
    var inclinada = !horizontal && Math.abs(c.Fx) > 1e-9 * F;
    if (inclinada) {
      var canto = [cabeca[0], cauda[1]];
      s += seta(cauda[0], cauda[1], canto[0], canto[1], COR.carga, 1.2, true);
      s += seta(canto[0], canto[1], cabeca[0], cabeca[1], COR.carga, 1.2, true);
      var aH = ux > 0 ? 0 : 180, aF = Math.atan2(cabeca[1] - cauda[1], cabeca[0] - cauda[0]) * 180 / Math.PI;
      var d = aF - aH;
      while (d > 180) d -= 360;
      while (d < -180) d += 360;
      var n = 16, pts = [];
      for (var i = 0; i <= n; i++) {
        var t = (aH + d * i / n) * Math.PI / 180;
        pts.push(r1(cauda[0] + 18 * Math.cos(t)) + "," + r1(cauda[1] + 18 * Math.sin(t)));
      }
      s += '<polyline fill="none" stroke="' + COR.carga + '" stroke-width="1" points="' + pts.join(" ") + '"/>';
      var tm = (aH + d / 2) * Math.PI / 180;
      s += texto(cauda[0] + 31 * Math.cos(tm), cauda[1] + 31 * Math.sin(tm) + 4, fmtAng(angulosDeAlfa(f.alfa).theta),
        { tam: 10.5, cor: COR.carga, halo: true });
    }
    s += seta(cauda[0], cauda[1], cabeca[0], cabeca[1], COR.carga, 2.3);
    // rótulo junto à extremidade livre da seta
    var livre = (c.Fy < 0 || horizontal) ? cauda : cabeca;
    var rot = fmt(F) + " kN", tam = 12, ancora = "middle", lx = livre[0], ly = livre[1] - 7;
    if (horizontal) { ancora = ux > 0 ? "end" : "start"; lx = livre[0] - ux * 4; ly = livre[1] + 4; }
    else if (Math.abs(ux) > 0.2) { ancora = (livre === cauda ? -ux : ux) > 0 ? "start" : "end"; lx = livre[0] + (ancora === "start" ? 3 : -3); }
    for (var tentativa = 0; tentativa < 4; tentativa++) {

    s += texto(lx, ly, esc(rot), { tam: tam, cor: COR.carga, peso: 600, halo: true, ancora: ancora });
    s += linha(cauda[0], cauda[1], cabeca[0], cabeca[1], "transparent", 16);
    return grupo("forcas", f.id, s);
  }

  function desenharMomento(g, q, col) {
    var p = posicao(q.em);

  // faixas: cargas distribuídas da mesma barra que se sobrepõem ficam umas por fora das outras
  function faixasDistribuidas(ds) {
    var porBarra = {}, faixa = {};
    ds.forEach(function (d) { (porBarra[d.barra] = porBarra[d.barra] || []).push(d); });
    Object.keys(porBarra).forEach(function (b) {
      var fins = [];
      porBarra[b].slice().sort(function (p, q) { return p.s1 - q.s1; }).forEach(function (d) {
        var k = 0;
        while (k < fins.length && fins[k] > d.s1 + 1e-9) k++;
        fins[k] = d.s2;
        faixa[d.id] = k;
      });
    });
    return faixa;
  }

  function desenharDistribuida(g, d, faixa, qmax, col) {
    var gb = est.idx.geo[d.barra];
    if (!gb) return "";
    var u = S.direcaoDistribuida(d.direcao, gb.c, gb.s), hq = 36;
    var off = { x: -u.ux, y: u.uy }, base = 4 + faixa * (hq + 18), s = "";   // para o lado de onde vem a carga
    function q(t) { return d.s2 > d.s1 ? d.q1 + (d.q2 - d.q1) * (t - d.s1) / (d.s2 - d.s1) : d.q1; }
    function h(qq) { return qmax > 0 ? Math.abs(qq) / qmax * hq : 0; }
    function P(t, e) { return { x: g.X(gb.xi + gb.c * t) + off.x * e, y: g.Y(gb.yi + gb.s * t) + off.y * e }; }
    var pts = [], a = P(d.s1, base), b = P(d.s2, base);
    pts.push(r1(a.x) + "," + r1(a.y));
    for (var i = 0; i <= 24; i++) {
      var t = d.s1 + (d.s2 - d.s1) * i / 24, pt = P(t, base + h(q(t)));
      pts.push(r1(pt.x) + "," + r1(pt.y));
    }
    pts.push(r1(b.x) + "," + r1(b.y));
    if (eSel("distribuidas", d.id)) {
      var hmax = base + Math.max(h(d.q1), h(d.q2));
      var c1 = P(d.s1, 0), c2 = P(d.s2, 0), c3 = P(d.s2, hmax + 6), c4 = P(d.s1, hmax + 6);
      s += '<polygon points="' + [c1, c2, c3, c4].map(function (z) { return r1(z.x) + "," + r1(z.y); }).join(" ") +
        '" fill="' + COR.dourado + '" fill-opacity="0.32" stroke="' + COR.dourado + '" stroke-width="1.5"/>';
    }
    s += '<polygon points="' + pts.join(" ") + '" fill="' + COR.cargaClaro + '" stroke="' + COR.carga + '" stroke-width="1.3" stroke-linejoin="round"/>';
    var comp = Math.hypot(b.x - a.x, b.y - a.y), n = Math.max(2, Math.round(comp / 24)) + 1;
    for (var k = 0; k < n; k++) {
      var ta = d.s1 + (d.s2 - d.s1) * k / (n - 1), qa = q(ta), ha = h(qa);
      if (ha < 6) continue;
      var p0 = P(ta, base), p1 = P(ta, base + ha);
      s += qa > 0 ? seta(p1.x, p1.y, p0.x, p0.y, COR.carga, 1.1) : seta(p0.x, p0.y, p1.x, p1.y, COR.carga, 1.1);
    }
    // rótulos, sem sinal: o sentido lê-se nas setas
    var rots = [], fora = 8;
    function rot(t, qq, ancora) {
      var pt = P(t, base + h(qq) + fora);
      rots.push({ x: pt.x, y: pt.y + (off.y > 0.5 ? 9 : off.y < -0.5 ? 0 : 4), t: fmt(Math.abs(qq)) + " kN/m", a: ancora });
    }
    var ladoX = off.x > 0.5 ? "start" : off.x < -0.5 ? "end" : null;
    if (Math.abs(d.q1 - d.q2) < 1e-9) rot((d.s1 + d.s2) / 2, d.q1, ladoX || "middle");
    else {
      if (Math.abs(d.q1) > 1e-9) rot(d.s1, d.q1, ladoX || (gb.c >= 0 ? "start" : "end"));
      if (Math.abs(d.q2) > 1e-9) rot(d.s2, d.q2, ladoX || (gb.c >= 0 ? "end" : "start"));
    }
    rots.forEach(function (rt) {
      for (var t2 = 0; t2 < 3; t2++) {
        var cx = caixaTexto(rt.x, rt.y, rt.t, 11.5, rt.a);
        if (col.livre(cx)) { col.por(cx); break; }
        rt.x += off.x * 12; rt.y += off.y * 12;

      s += texto(rt.x, rt.y, esc(rt.t), { tam: 11.5, cor: COR.carga, peso: 600, halo: true, ancora: rt.a });

    if (eSel("distribuidas", d.id)) {

          COR.dourado + '" stroke="' + COR.azul + '" stroke-width="1" style="cursor:move"/>';
      });
    }
    return grupo("distribuidas", d.id, s);

    var b = caixaModelo(), amp = 0.12 * Math.max(b.x1 - b.x0, b.y1 - b.y0, 1), mc = res.mecanismo, s = [];

  function desenharEstrutura(g, semGrelha) {
    var m = est.modelo, s = [], col = new Colocador();
    if (!semGrelha) s.push(desenharGrelha(g));
    var faixa = faixasDistribuidas(m.distribuidas), qmax = 0;
    m.distribuidas.forEach(function (d) { qmax = Math.max(qmax, Math.abs(d.q1), Math.abs(d.q2)); });
    if (est.previa) {
      var gb = est.idx.geo[est.previa.barra];

        s.push(linha(g.X(gb.xi + gb.c * a), g.Y(gb.yi + gb.s * a), g.X(gb.xi + gb.c * b), g.Y(gb.yi + gb.s * b), COR.carga, 12,
          ' stroke-opacity="0.35" stroke-linecap="round"'));

    s.push(desenharBarras(g, COR.azul, 5, true));

    m.apoios.forEach(function (a) {

  // ------------------------------------------------------------ diagramas sobre as barras

  function regioes(pts, k, tolv) {
    var regs = [], cur = null, sZero = null;
    function sg(v) { return v > tolv ? 1 : v < -tolv ? -1 : 0; }
    function fecha(s) { if (cur) { cur.pts.push([s, 0]); regs.push(cur); cur = null; } }
    for (var i = 0; i < pts.length; i++) {
      var s = pts[i].s, v = pts[i][k], s1 = sg(v);
      if (cur && s1 !== 0 && s1 !== cur.s) {
        var ant = cur.pts[cur.pts.length - 1];
        var sc = Math.abs(ant[0] - s) < 1e-12 ? s : ant[0] + (s - ant[0]) * (ant[1] / (ant[1] - v));
        fecha(sc);
        cur = { s: s1, pts: [[sc, 0]] };
      }
      if (s1 === 0) { fecha(s); sZero = s; continue; }
      if (!cur) cur = { s: s1, pts: [[sZero !== null ? sZero : s, 0]] };
      sZero = null;
      cur.pts.push([s, v]);
    }
    if (pts.length) fecha(pts[pts.length - 1].s);
    return regs;
  }

  // sentidos positivos de N, V ou M nas duas faces de um troço, como na figura da sebenta (§3)
  function pictogramaSeccao(k, cx, cy) {
    var az = COR.azul, s = '<g><title>Sentidos positivos de ' + k + " (convenção da secção)</title>";
    s += '<rect x="' + r1(cx - 4) + '" y="' + r1(cy - 6) + '" width="8" height="12" fill="#DCE4EC" stroke="' + az + '" stroke-width="1"/>';
    if (k === "N") s += seta(cx - 6, cy, cx - 20, cy, az, 1.5) + seta(cx + 6, cy, cx + 20, cy, az, 1.5);
    else if (k === "V") s += seta(cx - 10, cy + 8, cx - 10, cy - 8, az, 1.5) + seta(cx + 10, cy - 8, cx + 10, cy + 8, az, 1.5);
    else s += arco(cx - 15, cy, 8, 160, 340, az, 1.5, 5) + arco(cx + 15, cy, 8, 20, -160, az, 1.5, 5);
    return s + "</g>";
  }

  // os três sentidos positivos numa linha, por cima do quadro de esforços
  function legendaSeccao() {
    var s = '<svg width="330" height="30" viewBox="0 0 330 30" font-family="' + FONTE + '">';
    ["N", "V", "M"].forEach(function (k, i) {
